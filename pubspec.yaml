name: neostation
description: NeoStation - Emulation Hub

publish_to: "none" # Remove this line if you wish to publish to pub.dev

workspace:
  - packages/external_folder_access
  - packages/flutter_7zip
  - packages/gamepads
  - packages/gamepads_android
  - packages/gamepads_darwin
  - packages/gamepads_linux
  - packages/gamepads_platform_interface
  - packages/gamepads_windows

version: 0.9.9+125

environment:
  sdk: '>=3.9.2'

dependencies:
  archive: ^4.0.7
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  device_apps:
    git:
      url: https://github.com/franzsilva/device_apps
      ref: f90baa40979f98f43970899a19e363cfb3f082e7
  device_info_plus: ^12.1.0
  dio: ^5.9.0
  equatable: ^2.0.7
  external_folder_access: ^1.0.0
  file_picker: 12.0.0-beta.3
  flutter:
    sdk: flutter
  flutter_7zip: ^1.0.0
  flutter_localization: ^0.3.3
  flutter_screenutil: ^5.9.3
  flutter_soloud: ^4.0.12
  flutter_svg: ^2.2.1
  fullscreen_window: ^1.2.1
  gamepads: ^0.2.2
  google_fonts: ^6.3.2
  http: ^1.5.0
  image: ^4.5.4
  intl: ^0.20.2
  material_symbols_icons: ^4.2815.0
  package_info_plus: ^8.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  sqflite_common_ffi: ^2.3.6
  sqlite3_flutter_libs: ^0.5.40
  url_launcher: ^6.3.2
  video_player: ^2.10.0
  wakelock_plus: ^1.3.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/gamepad/
    - assets/images/logo/
    - assets/l10n/
    - assets/sounds/
    - assets/sql/
    - assets/system_backgrounds/
    - assets/system_icons/
    - assets/system_logos/
    - assets/systems/
