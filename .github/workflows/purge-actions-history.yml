name: Purge GitHub Actions run history

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  purge:
    if: github.event.head_commit.message == 'Purge GitHub Actions run history'
    runs-on: ubuntu-latest
    steps:
      - name: Delete all completed workflow runs except this one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'NeoStation Actions history purge',
          }

          page = 1
          deleted = 0
          while True:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}',
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              runs = payload.get('workflow_runs', [])
              if not runs:
                  break

              for run in runs:
                  run_id = int(run['id'])
                  if run_id == current:
                      continue
                  if run.get('status') != 'completed':
                      continue
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                      method='DELETE',
                      headers=headers,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30):
                          pass
                      deleted += 1
                  except urllib.error.HTTPError as error:
                      if error.code not in (404, 409):
                          raise
              if len(runs) < 100:
                  break
              page += 1

          print(f'Deleted {deleted} completed workflow run(s).')
          PY

      - name: Best-effort self-delete after completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          cat >/tmp/delete-self.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          for _ in $(seq 1 60); do
            sleep 2
            status=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$CURRENT_RUN_ID" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null)
            if [ "$status" = "completed" ]; then
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/actions/runs/$CURRENT_RUN_ID" >/dev/null 2>&1
              exit 0
            fi
          done
          SH
          chmod +x /tmp/delete-self.sh
          env -u RUNNER_TRACKING_ID nohup /tmp/delete-self.sh >/tmp/delete-self.log 2>&1 </dev/null &
