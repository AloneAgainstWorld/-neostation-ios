name: Update README badges

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-readme-badges.yml'
  schedule:
    - cron: '17 */6 * * *'
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published, released, deleted, unpublished]
  workflow_run:
    workflows: ["Build iOS (NeoStation)"]
    types: [completed]

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: write

concurrency:
  group: update-readme-badges
  cancel-in-progress: false

env:
  BADGE_BRANCH: automation/readme-badges

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Read private repository statistics
        id: stats
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          stars=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.stargazers_count')
          issues=$(gh api -X GET search/issues -f q="repo:${GITHUB_REPOSITORY} is:issue is:open" --jq '.total_count')
          downloads=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].assets[].download_count' 2>/dev/null | awk '{s+=$1} END {print s+0}')
          build_status=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ios-build.yml/runs" -f per_page=1 --jq '.workflow_runs[0].conclusion // .workflow_runs[0].status // "unknown"')
          echo "stars=$stars" >> "$GITHUB_OUTPUT"
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          echo "downloads=$downloads" >> "$GITHUB_OUTPUT"
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"

      - name: Generate local SVG badges
        env:
          STARS: ${{ steps.stats.outputs.stars }}
          ISSUES: ${{ steps.stats.outputs.issues }}
          DOWNLOADS: ${{ steps.stats.outputs.downloads }}
          BUILD_STATUS: ${{ steps.stats.outputs.build_status }}
        shell: bash
        run: |
          mkdir -p assets/readme/badges
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path

          out = Path('assets/readme/badges')
          out.mkdir(parents=True, exist_ok=True)

          def badge(filename, label, value, color='#007ec6'):
              label_w = max(42, 8 * len(label) + 14)
              value_w = max(28, 8 * len(value) + 14)
              width = label_w + value_w
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="20" role="img" aria-label="{html.escape(label)}: {html.escape(value)}">
          <title>{html.escape(label)}: {html.escape(value)}</title>
          <linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
          <clipPath id="r"><rect width="{width}" height="20" rx="3" fill="#fff"/></clipPath>
          <g clip-path="url(#r)"><rect width="{label_w}" height="20" fill="#555"/><rect x="{label_w}" width="{value_w}" height="20" fill="{color}"/><rect width="{width}" height="20" fill="url(#s)"/></g>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11"><text x="{label_w/2}" y="15" fill="#010101" fill-opacity=".3">{html.escape(label)}</text><text x="{label_w/2}" y="14">{html.escape(label)}</text><text x="{label_w + value_w/2}" y="15" fill="#010101" fill-opacity=".3">{html.escape(value)}</text><text x="{label_w + value_w/2}" y="14">{html.escape(value)}</text></g>
          </svg>'''
              (out / filename).write_text(svg, encoding='utf-8')

          status = os.environ.get('BUILD_STATUS', 'unknown')
          if status == 'success':
              build_value, build_color = 'passing', '#4c1'
          elif status in {'failure', 'cancelled', 'timed_out', 'action_required'}:
              build_value, build_color = status, '#e05d44'
          elif status in {'queued', 'in_progress', 'requested', 'waiting', 'pending'}:
              build_value, build_color = status.replace('_', ' '), '#007ec6'
          else:
              build_value, build_color = status, '#9f9f9f'

          badge('downloads.svg', 'downloads', os.environ.get('DOWNLOADS', '0'))
          badge('build.svg', 'build', build_value, build_color)
          badge('stars.svg', 'stars', os.environ.get('STARS', '0'))
          badge('issues.svg', 'issues', os.environ.get('ISSUES', '0'))
          PY

      - name: Commit badge changes on automation branch
        id: badge_commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/badges

          if git diff --cached --quiet; then
            echo "Badges already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -C "$BADGE_BRANCH"
          git commit -m "Refresh README badges"
          git push --force origin "HEAD:$BADGE_BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or refresh protected badge PR
        if: steps.badge_commit.outputs.changed == 'true'
        id: badge_pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BADGE_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BADGE_BRANCH" \
              --base main \
              --title "Refresh README badges" \
              --body $'Automated refresh of the local README statistics badges.\n\nThis PR is generated by GitHub Actions and must pass the repository ruleset before it can be merged. Only files under `assets/readme/badges/` are allowed.')
            pr_number=${pr_url##*/}
          else
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Refresh README badges" \
              --body $'Automated refresh of the local README statistics badges.\n\nThis PR is generated by GitHub Actions and must pass the repository ruleset before it can be merged. Only files under `assets/readme/badges/` are allowed.'
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Run required PR checks on badge branch
        if: steps.badge_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run pr-checks.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BADGE_BRANCH"

      - name: Wait for required checks
        if: steps.badge_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.badge_commit.outputs.head_sha }}
        shell: bash
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow pr-checks.yml \
              --branch "$BADGE_BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" \
              | head -1)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "Required PR Checks workflow did not start for $HEAD_SHA." >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify badge PR is badge-only
        if: steps.badge_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.badge_pr.outputs.number }}
        shell: bash
        run: |
          unexpected=$(gh pr diff "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --name-only \
            | grep -Ev '^assets/readme/badges/[^/]+\.svg$' || true)

          if [ -n "$unexpected" ]; then
            echo "Refusing to merge: the automated PR contains non-badge files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Merge protected badge PR
        if: steps.badge_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.badge_pr.outputs.number }}
        shell: bash
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch
