name: Apply RPCS3 persistence media and autostart polish

on:
  push:
    branches:
      - feature/rpcs3-stage3
  pull_request:
    branches:
      - feature/rpcs3-stage3

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rpcs3-stage4-polish
  cancel-in-progress: true

jobs:
  polish:
    name: Patch, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/rpcs3-stage3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Apply RPCS3 stage 4 patch
        run: python3 tools/rpcs3_stage4_patch.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/data/datasources/sqlite_database_service.dart \
            lib/l10n/rpcs3_library_locale.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            lib/services/rpcs3_launch_service.dart \
            lib/services/screenscraper/media_downloader.dart \
            lib/services/screenscraper/game_id_media_fallback.dart \
            lib/services/screenscraper_service.dart \
            test/rpcs3_stage3_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify source changes
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+132" pubspec.yaml
          grep -Fq "rpcs3-library://" lib/data/datasources/sqlite_database_service.dart
          grep -Fq "isPersistentExternalLibraryPath" lib/data/datasources/sqlite_database_service.dart
          grep -Fq "Rejected invalid ScreenScraper" lib/services/screenscraper/media_downloader.dart
          grep -Fq "mediaVideoJeu.php" lib/services/screenscraper/game_id_media_fallback.dart
          grep -Fq "rpcs3_scraper_media_debug.txt" lib/services/screenscraper_service.dart
          grep -Fq 'RPCS3 synchronisé — $count jeux PS3.' lib/l10n/rpcs3_library_locale.dart
          grep -Fq "NEOSTATION_RPC_WAITING_FOR_START" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "NEOSTATION_RPC_BOOT_COMPLETED" assets/data/rpcs3_stikdebug_launch.js
          test ! -f lib/services/screenscraper/melonx_media_fallback.dart

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run dedicated RPCS3 tests
        run: flutter test test/rpcs3_library_service_test.dart test/rpcs3_stage3_test.dart

      - name: Run full Flutter test suite
        run: flutter test

      - name: Commit validated source and remove temporary automation
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/workflows/rpcs3-stage4-polish-once.yml
          rm -f tools/rpcs3_stage4_patch.py
          rm -f _rpcs3_stage3_pr_marker
          rm -f .github/ISSUE_TEMPLATE/_noop_should_not_exist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): persist RPCS3 media and auto-launch titles"
          git push origin HEAD:feature/rpcs3-stage3
