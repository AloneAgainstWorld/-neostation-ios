      - name: Verify NeoSync v2 safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('lib/utils/app_config.dart').read_text()
          service = Path('lib/services/neosync/neo_sync_service.dart').read_text()
          paths = Path('lib/providers/neosync/neosync_path_resolver.dart').read_text()
          tab = Path('lib/screens/neo_sync_screen/neo_sync_tab.dart').read_text()
          retro = Path('lib/services/retroarch_config_service.dart').read_text()
          assert 'sync.neosync.cloud' in app
          assert '/api/v1/' not in service
          assert '/api/v2/' in service
          assert 'CloudPathBuilder.build' in paths
          assert "scope: isSharedCard ? 'shared' : 'game'" in paths
          assert '_neoSyncSelected' not in tab
          assert 'ConfigService.linkedExternalFolderPath' in retro
          assert "resolveDirectory('saves'" in retro
          assert "resolveDirectory('states'" in retro
          print('NeoSync v2 iOS safety contract verified.')
          PY

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze NeoSync iOS port
        run: |
          flutter analyze \
            lib/utils/cloud_path_builder.dart \
            lib/utils/app_config.dart \
            lib/screens/neo_sync_screen/neo_sync_tab.dart \
            lib/services/retroarch_config_service.dart \
            lib/services/neosync/neo_sync_service.dart \
            lib/providers/neo_sync_provider.dart \
            lib/providers/neosync/neosync_path_resolver.dart \
            lib/providers/neosync/neosync_upload.dart \
            lib/providers/neosync/neosync_core.dart \
            lib/providers/neosync/neosync_download.dart \
            lib/repositories/game_repository.dart

      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for candidate in \
            test/game_repository_test.dart \
            test/ios_gamepad_navigation_test.dart \
            test/video_preview_lifecycle_test.dart; do
            if [ -f "$candidate" ]; then tests+=("$candidate"); fi
          done
          if [ ${#tests[@]} -gt 0 ]; then
            flutter test "${tests[@]}"
          fi

      - name: Commit validated NeoSync v2 iOS source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeoStation Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/utils/cloud_path_builder.dart \
            lib/utils/app_config.dart \
            lib/screens/neo_sync_screen/neo_sync_tab.dart \
            lib/services/retroarch_config_service.dart \
            lib/services/neosync/neo_sync_service.dart \
            lib/providers/neo_sync_provider.dart \
            lib/providers/neosync/neosync_path_resolver.dart \
            lib/providers/neosync/neosync_upload.dart \
            lib/providers/neosync/neosync_core.dart \
            lib/providers/neosync/neosync_download.dart \
            lib/repositories/game_repository.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Port NeoSync v2 core to iOS'
            git push origin HEAD:feature/neosync-v2-ios
          fi

      - name: Validate ScreenScraper environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCREENSCRAPER_DEV_ID"
          test -n "$SCREENSCRAPER_DEV_PASSWORD"
          printf 'SCREENSCRAPER_DEV_ID=%s\nSCREENSCRAPER_DEV_PASSWORD=%s\n' \
            "$SCREENSCRAPER_DEV_ID" "$SCREENSCRAPER_DEV_PASSWORD" > .env
          chmod 600 .env

      - name: Patch flutter_localization for Xcode 16.2
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_LOCALIZATION_FILE=$(find "$HOME/.pub-cache" \
            -path '*flutter_localization-0.4.1/ios/flutter_localization/Sources/flutter_localization/FlutterLocalizationPlugin.swift' \
            -print -quit)
          test -n "$FLUTTER_LOCALIZATION_FILE"
          python3 - "$FLUTTER_LOCALIZATION_FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          old = '      binaryMessenger: registrar.messenger(),\n    )'
          new = '      binaryMessenger: registrar.messenger()\n    )'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          elif new not in s:
              raise SystemExit('Unexpected flutter_localization Swift source')
          PY

      - name: Keep iOS video audio-session policy intact
        run: |
          python3 build-utils/patch_ios_video_player_audio_session.py
          python3 build-utils/patch_ios_video_player_audio_session.py --check

      - name: Scaffold iOS platform if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi

      - name: Configure iOS project
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"

      - name: Patch device_info_plus for runner SDK compatibility
        shell: bash
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path '*device_info_plus*/FPPDeviceInfoPlusPlugin.m' -print -quit)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate and force fork icon
        run: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Configure Flutter build
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-neosync-v2.log

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -r ../../../NeoStation-NeoSync-v2-iOS-preview.ipa Payload)

      - name: Upload preview IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-NeoSync-v2-iOS-preview
          path: |
            NeoStation-NeoSync-v2-iOS-preview.ipa
            build/ios/xcodebuild-neosync-v2.log
          if-no-files-found: warn

      - name: Cleanup secret file
        if: always()
        run: rm -f .env
