name: Temporary Actions ping
on:
  push:
    branches: [main]
permissions:
  statuses: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Publish ping status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"success\",\"context\":\"neostation/actions-ping\",\"description\":\"run_id=$RUN_ID\"}"
