name: Temporary NeoSync ARMSX2 grouping v3

on:
  push:
    branches:
      - fix/neosync-armsx2-grouping-work

permissions:
  contents: write
  statuses: write

env:
  SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
  SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

jobs:
  build:
    if: github.event.head_commit.message == 'Run ARMSX2 NeoSync grouped IPA v3'
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/neosync-armsx2-grouping-work
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'state':'pending','context':'neostation/neosync-armsx2-grouping-v3','description':f"run_id={os.environ['RUN_ID']}",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",data=payload,method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          urllib.request.urlopen(req,timeout=30).read()
          PY

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply source patch and UI fixup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-utils/patch_neosync_armsx2_grouping.py')
          s=p.read_text()
          old="insert_before(resolver, '  bool _isMeloNXTitleId(String value) =>\\n', armsx2_resolver_block)"
          new="insert_before(resolver, '  bool _isMeloNXTitleId(String value) {\\n', armsx2_resolver_block)"
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif new not in s:
              raise SystemExit('patch marker self-fix not found')
          PY
          python3 build-utils/patch_neosync_armsx2_grouping.py
          python3 build-utils/patch_neosync_grouping_ui_fixup.py

      - name: Format and resolve
        run: |
          dart format \
            lib/providers/neosync/neosync_upload.dart \
            lib/providers/neosync/neosync_path_resolver.dart \
            lib/providers/neosync/neosync_core.dart \
            lib/screens/neo_sync_screen/login_screen/neo_sync_content.dart
          flutter pub get

      - name: Verify contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          upload=Path('lib/providers/neosync/neosync_upload.dart').read_text()
          resolver=Path('lib/providers/neosync/neosync_path_resolver.dart').read_text()
          core=Path('lib/providers/neosync/neosync_core.dart').read_text()
          ui=Path('lib/screens/neo_sync_screen/login_screen/neo_sync_content.dart').read_text()
          assert "['memcards', 'savestates', 'sstates']" in upload
          assert '_uploadArmsx2File' in upload
          assert '_resolveArmsx2FileForCloud' in resolver
          assert '_resolveArmsx2CloudFileToLocal' in resolver
          assert 'ARMSX2 Memory Cards' in resolver and 'ARMSX2 Save States' in resolver
          assert "parsed?.emulatorSlug == 'armsx2'" in core
          assert 'class _OnlineSaveGroup' in ui
          assert 'final List<NeoSyncFile> files;' in ui
          assert 'final List<_OnlineSaveGroup> groups;' in ui
          assert '_groupedOnlineSaves' in ui
          assert 'for (final file in selectedGroup.files)' in ui
          assert "key = 'melonx:${label.toLowerCase()}'" in ui
          print('ARMSX2 + grouped UI contract verified')
          PY

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos \
            lib/providers/neosync/neosync_upload.dart \
            lib/providers/neosync/neosync_path_resolver.dart \
            lib/providers/neosync/neosync_core.dart \
            lib/screens/neo_sync_screen/login_screen/neo_sync_content.dart

      - name: Test
        run: flutter test test/game_repository_test.dart

      - name: Commit validated source
        run: |
          set -euo pipefail
          git config user.name 'NeoStation Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/providers/neosync/neosync_upload.dart \
            lib/providers/neosync/neosync_path_resolver.dart \
            lib/providers/neosync/neosync_core.dart \
            lib/screens/neo_sync_screen/login_screen/neo_sync_content.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Fix ARMSX2 NeoSync and group multi-file saves'
            git push origin HEAD:fix/neosync-armsx2-grouping-work
          fi

      - name: ScreenScraper env
        run: |
          test -n "$SCREENSCRAPER_DEV_ID"
          test -n "$SCREENSCRAPER_DEV_PASSWORD"
          printf 'SCREENSCRAPER_DEV_ID=%s\nSCREENSCRAPER_DEV_PASSWORD=%s\n' "$SCREENSCRAPER_DEV_ID" "$SCREENSCRAPER_DEV_PASSWORD" > .env
          chmod 600 .env

      - name: Patch flutter_localization
        run: |
          FL=$(find "$HOME/.pub-cache" -path '*flutter_localization-0.4.1/ios/flutter_localization/Sources/flutter_localization/FlutterLocalizationPlugin.swift' -print -quit)
          test -n "$FL"
          python3 - "$FL" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='      binaryMessenger: registrar.messenger(),\n    )'; new='      binaryMessenger: registrar.messenger()\n    )'
          if old in s: p.write_text(s.replace(old,new,1))
          elif new not in s: raise SystemExit('Unexpected flutter_localization source')
          PY

      - name: Preserve audio policy
        run: |
          python3 build-utils/patch_ios_video_player_audio_session.py
          python3 build-utils/patch_ios_video_player_audio_session.py --check

      - name: Scaffold iOS
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          fi

      - name: Configure iOS
        run: |
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path '*device_info_plus*/FPPDeviceInfoPlusPlugin.m' -print -quit)
          if [ -n "$DEVICE_INFO_FILE" ]; then sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"; fi
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh
          cd ios && pod install --repo-update

      - name: Configure Flutter build
        run: flutter build ios --release --no-codesign --config-only --dart-define-from-file=.env

      - name: Build IPA
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" COMPILER_INDEX_STORE_ENABLE=NO build | tee build/ios/xcodebuild-armsx2-grouping-v3.log
          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -r ../../../NeoStation-NeoSync-ARMSX2-grouping-v3.ipa Payload)

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-NeoSync-ARMSX2-grouping-v3
          path: |
            NeoStation-NeoSync-ARMSX2-grouping-v3.ipa
            build/ios/xcodebuild-armsx2-grouping-v3.log
          if-no-files-found: warn

      - if: always()
        run: rm -f .env
