name: Apply compact iOS setup button labels

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    name: Apply and validate compact labels
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Apply compact localized button labels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          locale_path = Path('lib/l10n/ios_setup_locale.dart')
          locale = locale_path.read_text(encoding='utf-8')

          marker = "  static const Map<String, String> _continueLabels = {\n"
          if '_linkActionLabels' not in locale:
              labels = """  static const Map<String, String> _linkActionLabels = {
            'de': 'Verknüpfen',
            'en': 'Link',
            'es': 'Vincular',
            'fr': 'Lier',
            'id': 'Tautkan',
            'it': 'Collega',
            'ja': 'リンク',
            'ko': '연결',
            'pt': 'Vincular',
            'ru': 'Связать',
            'zh': '连接',
            'zh_Hant': '連結',
          };

          static const Map<String, String> _installActionLabels = {
            'de': 'Installieren',
            'en': 'Install',
            'es': 'Instalar',
            'fr': 'Installer',
            'id': 'Instal',
            'it': 'Installa',
            'ja': 'インストール',
            'ko': '설치',
            'pt': 'Instalar',
            'ru': 'Установить',
            'zh': '安装',
            'zh_Hant': '安裝',
          };

          """
              if marker not in locale:
                  raise SystemExit('Could not find continue-label insertion point')
              locale = locale.replace(marker, labels + marker, 1)

          method_marker = "  static String continueLabel(BuildContext context) =>\n      _lookup(_continueLabels, context);\n"
          if 'static String linkAction(BuildContext context)' not in locale:
              methods = """  static String linkAction(BuildContext context) =>
              _lookup(_linkActionLabels, context);
          static String installAction(BuildContext context) =>
              _lookup(_installActionLabels, context);
          """
              if method_marker not in locale:
                  raise SystemExit('Could not find locale method insertion point')
              locale = locale.replace(method_marker, methods + method_marker, 1)

          locale_path.write_text(locale, encoding='utf-8')

          wizard_path = Path('lib/widgets/setup_wizard.dart')
          wizard = wizard_path.read_text(encoding='utf-8')

          old_link = ': IosSetupLocale.linkTitle(context))'
          new_link = ': IosSetupLocale.linkAction(context))'
          if old_link in wizard:
              wizard = wizard.replace(old_link, new_link, 1)
          elif new_link not in wizard:
              raise SystemExit('Could not find iOS link button label')

          old_install = """      return canDownload
              ? AppLocale.wizardDownloadArtPack.getString(context)
              : AppLocale.finish.getString(context);
          """
          new_install = """      return canDownload
              ? (Platform.isIOS
                    ? IosSetupLocale.installAction(context)
                    : AppLocale.wizardDownloadArtPack.getString(context))
              : AppLocale.finish.getString(context);
          """
          if old_install in wizard:
              wizard = wizard.replace(old_install, new_install, 1)
          elif 'IosSetupLocale.installAction(context)' not in wizard:
              raise SystemExit('Could not find art-pack button label')

          wizard_path.write_text(wizard, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-compact-setup-labels-once.yml
          dart format lib/l10n/ios_setup_locale.dart lib/widgets/setup_wizard.dart

      - name: Verify exact French labels and locale coverage
        run: |
          set -euo pipefail
          grep -Fq "'fr': 'Lier'" lib/l10n/ios_setup_locale.dart
          grep -Fq "'fr': 'Installer'" lib/l10n/ios_setup_locale.dart
          grep -Fq "IosSetupLocale.linkAction(context)" lib/widgets/setup_wizard.dart
          grep -Fq "IosSetupLocale.installAction(context)" lib/widgets/setup_wizard.dart
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('lib/l10n/ios_setup_locale.dart').read_text(encoding='utf-8')
          expected = {'de', 'en', 'es', 'fr', 'id', 'it', 'ja', 'ko', 'pt', 'ru', 'zh', 'zh_Hant'}
          for map_name in ('_linkActionLabels', '_installActionLabels'):
              match = re.search(rf"{map_name} = \{{(.*?)\n  \}};", text, re.S)
              assert match, f'Missing {map_name}'
              keys = set(re.findall(r"^    '([^']+)':", match.group(1), re.M))
              assert keys == expected, f'{map_name}: unexpected locale set {keys}'
          print('Verified compact button labels in all 12 supported locales.')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/l10n/ios_setup_locale.dart lib/widgets/setup_wizard.dart .github/workflows/apply-compact-setup-labels-once.yml
          git diff --cached --check
          git commit -m "fix: shorten iOS setup action labels"
          git push origin HEAD:main
