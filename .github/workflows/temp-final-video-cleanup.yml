name: Final video backend cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run final video backend cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove legacy video backend residues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_required(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Dart entry point: remove the legacy backend import and registration.
          replace_required(
              'lib/main.dart',
              "import 'package:fvp/fvp.dart';\n",
              '',
          )
          replace_required(
              'lib/main.dart',
              "  // Inicializar fvp para soporte extendido de video (Windows, Linux, etc.)\n  registerWith();\n\n",
              '',
          )

          # Dependency manifest: keep Flutter video_player/AVFoundation only.
          replace_required(
              'pubspec.yaml',
              '  fvp: ^0.37.3\n',
              '',
          )

          # Remove stale backend wording from media format documentation.
          replace_required(
              'lib/utils/image_utils.dart',
              '  /// video_player/fvp and cover the MPEG-4 use case without accepting arbitrary\n',
              '  /// video_player and cover the MPEG-4 use case without accepting arbitrary\n',
          )

          # Linux x86_64 script only carried a stale GPU/backend comment.
          linux = Path('build-utils/build-linux.sh')
          text = linux.read_text(encoding='utf-8')
          text = text.replace(
              '# The app and mdk/fvp must use the same GPU. Forcing PRIME offload can cause\n'
              '# mdk to render on a different GPU than Flutter, resulting in black video.\n',
              '# The app and Flutter renderer should use the same GPU. Forcing PRIME offload\n'
              '# can move media rendering to a different GPU and cause black video.\n',
          )
          linux.write_text(text, encoding='utf-8')

          # Linux ARM64 had a complete manual MDK SDK workaround that is obsolete
          # once the old backend dependency is removed.
          arm = Path('build-utils/build-linuxarm.sh')
          text = arm.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n# WORKAROUND: Download and extract mdk-sdk manually.*?\n(?=# Build release)',
              re.DOTALL,
          )
          text, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit('Legacy ARM64 MDK workaround block was not found')
          text = text.replace(
              '# The app and mdk/fvp must use the same GPU. Forcing PRIME offload can cause\n'
              '# mdk to render on a different GPU than Flutter, resulting in black video.\n',
              '# The app and Flutter renderer should use the same GPU. Forcing PRIME offload\n'
              '# can move media rendering to a different GPU and cause black video.\n',
          )
          arm.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate dependency lockfile
        run: flutter pub get

      - name: Format touched Dart files
        run: dart format lib/main.dart lib/utils/image_utils.dart

      - name: Run focused iOS regressions
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/home_music_silent_mode_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/ios_gamepad_navigation_test.dart \
            test/rpcs3_stage7_test.dart \
            test/rpcs3_library_service_test.dart

      - name: Remove temporary cleanup workflow and verify tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-final-video-cleanup.yml

          if grep -RIniE --exclude-dir=.git --exclude='*.lock.json' \
            '(^|[^[:alnum:]_])(fvp|mdk|libmdk|media_kit)([^[:alnum:]_]|$)' .; then
            echo 'Legacy video backend residue still exists in the working tree.'
            exit 1
          fi

          if grep -RIn --exclude-dir=.git 'registerWith();' lib/main.dart; then
            echo 'Legacy global video backend registration still exists.'
            exit 1
          fi

          git diff --check
          git status --short

      - name: Commit cleaned tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tarble FR'
          git config user.email 'f9wynyv9qy@privaterelay.appleid.com'
          git add -A
          git commit -m 'Remove legacy FVP video backend'
          git push origin HEAD:main
