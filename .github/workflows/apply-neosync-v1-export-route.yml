name: Apply NeoSync V1 Export Route

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_neosync_v1_export_route.py
      - .github/workflows/apply-neosync-v1-export-route.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply patch
        run: python3 tooling/patch_neosync_v1_export_route.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/providers/neo_sync_provider.dart pubspec.yaml
          git diff --cached --quiet && exit 0
          git commit -m "fix(neosync): export legacy v1 saves through legacy API"
          git push origin HEAD:feature/library-native
