name: Validate NeoStation audio RPCS3 and video Stage 7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-stage7-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test Stage 7
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout Stage 7 branch
        uses: actions/checkout@v7
        with:
          ref: fix/audio-rpcs3-video-stage7-20260818
          fetch-depth: 0

      - name: Remove fixed preview debounce and keep generation cancellation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          host_path = Path('lib/screens/game_screen/my_games_list.dart')
          host = host_path.read_text(encoding='utf-8')
          host, removed = re.subn(
              r"\n\s*static const Duration _videoDelay = Duration\(\s*"
              r"milliseconds:\s*1500,\s*\);\s*"
              r"// Debounce for video playback\.\s*\n",
              '\n',
              host,
              count=1,
          )
          if removed != 1 and '_videoDelay' in host:
              raise SystemExit('Could not remove fixed video delay field')
          host_path.write_text(host, encoding='utf-8')

          part_path = Path('lib/screens/game_screen/my_games_list/secondary_display.dart')
          part = part_path.read_text(encoding='utf-8')
          start_marker = '  void _startVideoTimer() {'
          end_marker = '  /// Initializes one preview generation.'
          start = part.find(start_marker)
          end = part.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Video start function markers not found')

          replacement = """  void _startVideoTimer() {
            _videoTimer?.cancel();
            _videoTimer = null;
            if (!mounted || _isGameLaunching) return;

            final generation = _videoGeneration;
            final scheduledGame = _selectedGame;
            if (scheduledGame == null) return;

            unawaited(
              _startVideoPreviewForSelection(
                scheduledGame,
                generation: generation,
              ),
            );
          }

          Future<void> _startVideoPreviewForSelection(
            GameModel scheduledGame, {
            required int generation,
          }) async {
            if (!mounted ||
                generation != _videoGeneration ||
                _selectedGame != scheduledGame) {
              return;
            }

            await _updateSecondaryDisplayVideo(scheduledGame);
            if (!mounted ||
                generation != _videoGeneration ||
                _selectedGame != scheduledGame) {
              return;
            }

            final showGameInfo = context
                .read<SqliteConfigProvider>()
                .config
                .showGameInfo;
            if (showGameInfo) {
              await _initializeVideo(scheduledGame, generation: generation);
            }
          }

          """
          part = part[:start] + replacement + part[end:]
          part_path.write_text(part, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/main.dart \
            lib/models/game_model.dart \
            lib/services/audio_policy_service.dart \
            lib/services/sfx_service.dart \
            lib/services/home_music_service.dart \
            lib/services/music_player_service.dart \
            lib/services/game/game_list_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/services/rpcs3_library_service.dart \
            lib/services/rpcs3_launch_service.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/my_games_list/secondary_display.dart \
            lib/screens/secondary_screen/secondary_screen.dart \
            lib/widgets/shaders/shader_gif_widget.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            test/audio_policy_service_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_stage7_test.dart

      - name: Verify implementation markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              'version': ('pubspec.yaml', 'version: 0.9.9+137'),
              'audio policy': ('lib/services/audio_policy_service.dart', 'class AudioPolicyService'),
              'active SFX handles': ('lib/services/sfx_service.dart', '_activeHandles'),
              'home music policy': ('lib/services/home_music_service.dart', 'AudioPolicyService'),
              'music player policy': ('lib/services/music_player_service.dart', 'AudioPolicyService'),
              'canonical game conversion': ('lib/services/game/game_list_service.dart', 'GameModel.fromDatabaseModel'),
              'RPCS3 metadata repair': ('lib/services/rpcs3_library_service.dart', '_repairPersistedRpcs3Names'),
              'foreground JIT script': ('lib/services/rpcs3_launch_service.dart', 'openJitScriptOnly'),
              'native foreground preflight': ('packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift', 'launchAfterPreflight'),
              'RPCS3 boot result log': ('assets/data/rpcs3_stikdebug_launch.js', 'NEOSTATION_RPC_BOOT_RESULT'),
              'video generation': ('lib/screens/game_screen/my_games_list.dart', '_videoGeneration'),
              'video transition queue': ('lib/screens/game_screen/my_games_list.dart', '_videoTransition'),
              'immediate generation-guarded preview': ('lib/screens/game_screen/my_games_list/secondary_display.dart', '_startVideoPreviewForSelection'),
          }
          for label, (path, marker) in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              if marker not in text:
                  raise SystemExit(f'Missing {label}: {marker} in {path}')
          host = Path('lib/screens/game_screen/my_games_list.dart').read_text(encoding='utf-8')
          if '_videoDelay' in host or 'milliseconds: 1500' in host:
              raise SystemExit('Fixed 1500 ms preview delay is still present')
          print('All Stage 7 implementation markers are present.')
          PY

      - name: Validate generated RPCS3 JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('assets/data/rpcs3_stikdebug_launch.js').read_text(encoding='utf-8')
          request = {
              'sessionId': 'validation',
              'titleId': 'BLES00412',
              'displayTitle': 'The Lord of the Rings: Conquest™',
              'sourcePath': '/Data/games/discImgs/BLES00412',
              'sourceKind': 'disc-image',
          }
          functions = {
              'CFE15492152B331E83959A3CF9AC8A9F': {'boot': 0x2FA18},
              '5C4D64FFB79930AD879C13009838F136': {
                  'boot': 0x36224,
                  'state': 0x36A8C,
                  'progress': 0x36AFC,
              },
          }
          source = source.replace('__NEOSTATION_REQUEST_JSON__', json.dumps(request))
          source = source.replace('__NEOSTATION_TITLE_ID_JSON__', '"BLES00412"')
          source = source.replace('__NEOSTATION_SUPPORTED_FUNCTIONS_JSON__', json.dumps(functions))
          source = source.replace('__NEOSTATION_SUPPORTED_CORES_JSON__', '{}')
          source = source.replace('__NEOSTATION_CORE_UUID_JSON__', '""')
          source = source.replace('__NEOSTATION_BOOT_OFFSET_HEX__', '0')
          if '__NEOSTATION_' in source:
              raise SystemExit('Unresolved RPCS3 placeholder')
          Path('/tmp/neostation-rpcs3-stage7.js').write_text(source, encoding='utf-8')
          PY
          node --check /tmp/neostation-rpcs3-stage7.js

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run focused Stage 7 tests
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_stage7_test.dart \
            test/rpcs3_library_service_test.dart \
            test/rpcs3_stage3_test.dart \
            test/rpcs3_stage6_test.dart \
            test/home_music_silent_mode_test.dart \
            test/theme_provider_background_persistence_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Commit validated implementation and remove temporary automation
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/workflows/validate-stage7-once.yml
          rm -f tools/apply_stage7.py tools/finalize_stage7.py
          rm -f _stage7_trigger*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): centralize audio and harden RPCS3 video flows"
          git push origin HEAD:fix/audio-rpcs3-video-stage7-20260818
