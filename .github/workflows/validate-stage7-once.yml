name: Validate NeoStation audio RPCS3 and video Stage 7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-stage7-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Apply, analyze and test Stage 7
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout Stage 7 branch
        uses: actions/checkout@v7
        with:
          ref: fix/audio-rpcs3-video-stage7-20260818
          fetch-depth: 0

      - name: Verify patcher syntax
        run: python3 -m py_compile tools/apply_stage7.py

      - name: Apply Stage 7 patch
        run: python3 tools/apply_stage7.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/main.dart \
            lib/models/game_model.dart \
            lib/services/audio_policy_service.dart \
            lib/services/sfx_service.dart \
            lib/services/home_music_service.dart \
            lib/services/music_player_service.dart \
            lib/services/game/game_list_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/services/rpcs3_library_service.dart \
            lib/services/rpcs3_launch_service.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/my_games_list/secondary_display.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            test/audio_policy_service_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_existing_metadata_repair_test.dart \
            test/rpcs3_launch_protocol_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify implementation markers
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+137" pubspec.yaml
          grep -Fq "class AudioPolicyService" lib/services/audio_policy_service.dart
          grep -Fq "_activeHandles" lib/services/sfx_service.dart
          grep -Fq "AudioPolicyService" lib/services/home_music_service.dart
          grep -Fq "AudioPolicyService" lib/services/music_player_service.dart
          grep -Fq "GameModel.fromDatabaseModel" lib/services/game/game_list_service.dart
          grep -Fq "_repairPersistedRpcs3Names" lib/services/rpcs3_library_service.dart
          grep -Fq "openJitScriptOnly" lib/services/rpcs3_launch_service.dart
          grep -Fq "launchAfterPreflight" packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift
          grep -Fq "NEOSTATION_RPC_BOOT_RESULT" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "_videoGeneration" lib/screens/game_screen/my_games_list.dart
          grep -Fq "_videoTransition" lib/screens/game_screen/my_games_list.dart
          ! grep -Fq "Duration(milliseconds: 1500)" lib/screens/game_screen/my_games_list.dart

      - name: Validate generated RPCS3 JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('assets/data/rpcs3_stikdebug_launch.js').read_text(encoding='utf-8')
          request = {
              'sessionId': 'validation',
              'titleId': 'BLES00412',
              'displayTitle': 'The Lord of the Rings: Conquest™',
              'sourcePath': '/Data/games/discImgs/BLES00412',
              'sourceKind': 'disc-image',
          }
          functions = {
              'CFE15492152B331E83959A3CF9AC8A9F': {'boot': 0x2FA18},
              '5C4D64FFB79930AD879C13009838F136': {
                  'boot': 0x36224,
                  'state': 0x36A8C,
                  'progress': 0x36AFC,
              },
          }
          source = source.replace('__NEOSTATION_REQUEST_JSON__', json.dumps(request))
          source = source.replace('__NEOSTATION_TITLE_ID_JSON__', '"BLES00412"')
          source = source.replace('__NEOSTATION_SUPPORTED_FUNCTIONS_JSON__', json.dumps(functions))
          source = source.replace('__NEOSTATION_SUPPORTED_CORES_JSON__', '{}')
          source = source.replace('__NEOSTATION_CORE_UUID_JSON__', '""')
          source = source.replace('__NEOSTATION_BOOT_OFFSET_HEX__', '0')
          if '__NEOSTATION_' in source:
              raise SystemExit('Unresolved RPCS3 placeholder')
          Path('/tmp/neostation-rpcs3-stage7.js').write_text(source, encoding='utf-8')
          PY
          node --check /tmp/neostation-rpcs3-stage7.js

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run focused Stage 7 tests
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_existing_metadata_repair_test.dart \
            test/rpcs3_launch_protocol_test.dart \
            test/rpcs3_library_service_test.dart \
            test/rpcs3_stage3_test.dart \
            test/rpcs3_stage6_test.dart \
            test/home_music_silent_mode_test.dart \
            test/theme_provider_background_persistence_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Commit validated implementation and remove temporary automation
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/workflows/validate-stage7-once.yml
          rm -f tools/apply_stage7.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): centralize audio and harden RPCS3 video flows"
          git push origin HEAD:fix/audio-rpcs3-video-stage7-20260818
