name: Validate Stage 7 audio RPCS3 and video fixes

on:
  push:
    branches:
      - fix/audio-rpcs3-video-stage7-20260818
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-stage7-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Patch, analyze and test Build 137
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout Stage 7 branch
        uses: actions/checkout@v7
        with:
          ref: fix/audio-rpcs3-video-stage7-20260818
          fetch-depth: 0

      - name: Repair patch anchors for the current main source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_stage7.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("log.i('NeoStation starting...');", "log.i('Starting NeoStation...');")
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply Stage 7 source patch
        run: python3 tools/apply_stage7.py

      - name: Migrate older RPCS3 regression expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          stage3 = Path('test/rpcs3_stage3_test.dart')
          text = stage3.read_text(encoding='utf-8')
          old = """    test('RPCS3 direct script is fingerprinted and title-specific', () {
                final template = File('assets/data/rpcs3_stikdebug_launch.js')
                    .readAsStringSync();
                final script = Rpcs3LaunchService.buildScriptForTesting(
                  template,
                  'bles00412',
                );
                expect(script, contains('\\\"BLES00412\\\"'));
                expect(script, contains('5C4D64FFB79930AD879C13009838F136'));
                expect(script, contains('221732'));
                expect(script, contains('CFE15492152B331E83959A3CF9AC8A9F'));
                expect(script, contains('NEOSTATION_RPC_DIRECT_CORE_NOT_READY'));
                expect(script, contains('NEOSTATION_RPC_DIRECT_BOOT_COMPLETED'));
                expect(script, isNot(contains('__NEOSTATION_')));
              });
          """
          new = """    test('RPCS3 direct script is fingerprinted and state-aware', () {
                final template = File('assets/data/rpcs3_stikdebug_launch.js')
                    .readAsStringSync();
                final script = Rpcs3LaunchService.buildScriptForTesting(
                  template,
                  'bles00412',
                );
                expect(script, contains('\\\"BLES00412\\\"'));
                expect(script, contains('5C4D64FFB79930AD879C13009838F136'));
                expect(script, contains('221732'));
                expect(script, contains('CFE15492152B331E83959A3CF9AC8A9F'));
                expect(script, contains('NEOSTATION_RPC_STATE_BEFORE'));
                expect(script, contains('NEOSTATION_RPC_BOOT_RESULT'));
                expect(script, contains('NEOSTATION_RPC_LAST_ERROR'));
                expect(script, isNot(contains('__NEOSTATION_')));
              });
          """
          if old not in text:
              raise SystemExit('Stage 3 launch-test marker missing')
          stage3.write_text(text.replace(old, new, 1), encoding='utf-8')

          stage6 = Path('test/rpcs3_stage6_test.dart')
          text = stage6.read_text(encoding='utf-8')
          text = text.replace(
              "test('resume pass only arms after a real background interval'",
              "test('resume pass arms from a real background transition without a timer'",
          )
          text = text.replace(
              "now: started.add(const Duration(seconds: 3)),\n          startedAt: started,\n          launchWasBackgrounded: true,\n        ),\n        isFalse,",
              "now: started.add(const Duration(seconds: 3)),\n          startedAt: started,\n          launchWasBackgrounded: true,\n        ),\n        isTrue,",
              1,
          )
          old_template = """        const template =
                    'title=__NEOSTATION_TITLE_ID_JSON__ '
                    'uuid=__NEOSTATION_CORE_UUID_JSON__ '
                    'offset=__NEOSTATION_BOOT_OFFSET_HEX__';
                final rendered = Rpcs3LaunchService.buildScriptForTesting(
                  template,
                  'bles00412',
                );
                expect(rendered, contains(jsonEncode('BLES00412')));
                expect(rendered, contains(Rpcs3LaunchService.expectedCoreUuid));
                expect(rendered, isNot(contains('__NEOSTATION_')));
          """
          new_template = """        const template =
                    'request=__NEOSTATION_REQUEST_JSON__ '
                    'cores=__NEOSTATION_SUPPORTED_CORES_JSON__';
                final rendered = Rpcs3LaunchService.buildScriptForTesting(
                  template,
                  'bles00412',
                );
                expect(rendered, contains(jsonEncode('BLES00412')));
                expect(rendered, contains('5C4D64FFB79930AD879C13009838F136'));
                expect(rendered, isNot(contains('__NEOSTATION_')));
          """
          if old_template not in text:
              raise SystemExit('Stage 6 template marker missing')
          stage6.write_text(text.replace(old_template, new_template, 1), encoding='utf-8')
          PY

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/main.dart \
            lib/services/audio_policy_service.dart \
            lib/services/sfx_service.dart \
            lib/services/home_music_service.dart \
            lib/services/music_player_service.dart \
            lib/widgets/shaders/shader_gif_widget.dart \
            lib/models/game_model.dart \
            lib/services/game/game_list_service.dart \
            lib/data/datasources/sqlite_service.dart \
            lib/services/rpcs3_library_service.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            lib/services/rpcs3_launch_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/my_games_list/secondary_display.dart \
            lib/screens/secondary_screen/secondary_screen.dart \
            test/audio_policy_service_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_stage3_test.dart \
            test/rpcs3_stage6_test.dart \
            test/rpcs3_stage7_test.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Stage 7 implementation markers
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+137" pubspec.yaml
          grep -Fq "class AudioPolicyService" lib/services/audio_policy_service.dart
          grep -Fq "stopAllSounds" lib/services/sfx_service.dart
          grep -Fq "resolveDatabaseNamesForDisplay" lib/services/game/game_list_service.dart
          grep -Fq "UPDATE user_screenscraper_metadata" lib/services/rpcs3_library_service.dart
          grep -Fq "openJitRequest" packages/external_folder_access/lib/external_folder_access.dart
          grep -Fq "private func openJitRequest" packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift
          grep -Fq "NEOSTATION_RPC_BOOT_RESULT" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "NEOSTATION_RPC_LAST_ERROR" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "_videoGeneration" lib/screens/game_screen/my_games_list.dart
          grep -Fq "_videoTransition" lib/screens/game_screen/my_games_list.dart
          grep -Fq "stale-initialize" lib/screens/game_screen/my_games_list/secondary_display.dart

      - name: Validate generated RPCS3 JavaScript syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('assets/data/rpcs3_stikdebug_launch.js').read_text(encoding='utf-8')
          source = source.replace('__NEOSTATION_REQUEST_JSON__', json.dumps({
              'titleId': 'BLES00412',
              'displayTitle': 'The Lord of the Rings: Conquest',
              'sourcePath': '/Data/games/discImgs/BLES00412',
              'sourceKind': 'disc-image',
              'sessionId': 'syntax-test',
          }))
          source = source.replace('__NEOSTATION_SUPPORTED_CORES_JSON__', json.dumps({
              'CFE15492152B331E83959A3CF9AC8A9F': {'boot': 0x2FA18},
              '5C4D64FFB79930AD879C13009838F136': {
                  'boot': 0x36224,
                  'emulationState': 0x36A8C,
                  'bootProgress': 0x36AFC,
                  'globalState': 0x37A80,
                  'lastError': 0x37F34,
              },
          }))
          if '__NEOSTATION_' in source:
              raise SystemExit('Unresolved RPCS3 script placeholder')
          Path('/tmp/neostation-rpcs3-stage7.js').write_text(source, encoding='utf-8')
          PY
          node --check /tmp/neostation-rpcs3-stage7.js

      - name: Analyze Dart and Flutter source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run dedicated Stage 7 regression tests
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_library_service_test.dart \
            test/rpcs3_stage3_test.dart \
            test/rpcs3_stage6_test.dart \
            test/rpcs3_stage7_test.dart \
            test/home_music_silent_mode_test.dart \
            test/theme_provider_background_persistence_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Commit validated source and remove one-time automation
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/workflows/validate-stage7-once.yml
          rm -f tools/apply_stage7.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): centralize audio and harden RPCS3 video flows"
          git push origin HEAD:fix/audio-rpcs3-video-stage7-20260818
