name: Validate Stage 7 audio RPCS3 and video fixes

on:
  push:
    branches: [fix/audio-rpcs3-video-stage7-20260818]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-stage7-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Patch, analyze and test Build 137
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Stage 7 branch
        uses: actions/checkout@v7
        with:
          ref: fix/audio-rpcs3-video-stage7-20260818
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Repair current-source patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_stage7.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              'lib/main.dart',
              """  final log = LoggerService.instance;
            log.i('NeoStation starting...');

            if (Platform.isIOS) {
          """,
              """  final log = LoggerService.instance;
            log.i('NeoStation starting...');

            await AudioPolicyService().initialize();

            if (Platform.isIOS) {
          """,
          )'''
          new = '''replace_once(
              'lib/main.dart',
              "  log.i('Starting NeoStation...');\\n",
              "  log.i('Starting NeoStation...');\\n\\n  await AudioPolicyService().initialize();\\n",
          )'''
          if old not in text:
              old = old.replace('NeoStation starting...', 'Starting NeoStation...')
          if old not in text:
              raise SystemExit('Stage 7 main patch block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply Stage 7 source patch
        run: python3 tools/apply_stage7.py

      - name: Adapt patch to current source and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          host = Path('lib/screens/game_screen/my_games_list.dart')
          host_text = host.read_text(encoding='utf-8')
          if 'int _videoGeneration = 0;' not in host_text:
              marker = '  bool _isVideoLoading = false;\n'
              if marker not in host_text:
                  raise SystemExit('Primary video state marker missing')
              host_text = host_text.replace(
                  marker,
                  marker +
                  '  int _videoGeneration = 0;\n'
                  '  Future<void> _videoTransition = Future<void>.value();\n',
                  1,
              )
              host.write_text(host_text, encoding='utf-8')

          # setEnabled(false) is used by widget tests without loading the native
          # SoLoud library. Check the empty handle list before touching the FFI
          # singleton so the no-audio path remains platform independent.
          sfx = Path('lib/services/sfx_service.dart')
          sfx_text = sfx.read_text(encoding='utf-8')
          old_guard = 'if (!SoLoud.instance.isInitialized || _activeHandles.isEmpty) {'
          new_guard = 'if (_activeHandles.isEmpty || !SoLoud.instance.isInitialized) {'
          if old_guard not in sfx_text:
              raise SystemExit('SFX active-handle guard missing')
          sfx.write_text(sfx_text.replace(old_guard, new_guard, 1), encoding='utf-8')

          stage3 = Path('test/rpcs3_stage3_test.dart')
          text = stage3.read_text(encoding='utf-8')
          text = text.replace("title-specific'", "state-aware'")
          text = text.replace(
              "expect(script, contains('NEOSTATION_RPC_DIRECT_CORE_NOT_READY'));",
              "expect(script, contains('NEOSTATION_RPC_STATE_BEFORE'));",
          )
          text = text.replace(
              "expect(script, contains('NEOSTATION_RPC_DIRECT_BOOT_COMPLETED'));",
              "expect(script, contains('NEOSTATION_RPC_BOOT_RESULT'));\n      expect(script, contains('NEOSTATION_RPC_LAST_ERROR'));",
          )
          stage3.write_text(text, encoding='utf-8')

          stage6 = Path('test/rpcs3_stage6_test.dart')
          text = stage6.read_text(encoding='utf-8')
          text = text.replace(
              'resume pass only arms after a real background interval',
              'resume pass arms from a real background transition without a timer',
          )
          text = text.replace(
              "now: started.add(const Duration(seconds: 3)),\n          startedAt: started,\n          launchWasBackgrounded: true,\n        ),\n        isFalse,",
              "now: started.add(const Duration(seconds: 3)),\n          startedAt: started,\n          launchWasBackgrounded: true,\n        ),\n        isTrue,",
              1,
          )
          start = text.index("    test(\n      'direct-launch template still receives exact title and fingerprint'")
          end = text.index("    );\n  });", start) + len("    );\n")
          replacement = '''    test(
              'direct-launch template receives exact request and function map',
              () {
                const template =
                    'request=__NEOSTATION_REQUEST_JSON__ '
                    'cores=__NEOSTATION_SUPPORTED_CORES_JSON__';
                final rendered = Rpcs3LaunchService.buildScriptForTesting(
                  template,
                  'bles00412',
                );
                expect(rendered, contains(jsonEncode('BLES00412')));
                expect(rendered, contains('5C4D64FFB79930AD879C13009838F136'));
                expect(rendered, isNot(contains('__NEOSTATION_')));
              },
            );
          '''
          stage6.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          silent = Path('test/home_music_silent_mode_test.dart')
          text = silent.read_text(encoding='utf-8')
          old_home = "expect(homeMusic, contains('await _restoreSilentModeAudioSession();'));"
          new_home = """expect(homeMusic, contains('AudioPolicyService'));
              expect(homeMusic, contains('ensureSilentCompatibleSession'));"""
          if old_home not in text:
              raise SystemExit('Legacy HomeMusic silent-mode expectation missing')
          text = text.replace(old_home, new_home, 1)
          old_sfx = "expect(sfx, contains('await _restoreSilentModeAudioSession();'));"
          new_sfx = """expect(sfx, contains('AudioPolicyService'));
              expect(sfx, contains('stopAllSounds'));"""
          if old_sfx not in text:
              raise SystemExit('Legacy SFX silent-mode expectation missing')
          silent.write_text(text.replace(old_sfx, new_sfx, 1), encoding='utf-8')
          PY

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/main.dart lib/services/audio_policy_service.dart \
            lib/services/sfx_service.dart lib/services/home_music_service.dart \
            lib/services/music_player_service.dart \
            lib/widgets/shaders/shader_gif_widget.dart lib/models/game_model.dart \
            lib/services/game/game_list_service.dart \
            lib/data/datasources/sqlite_service.dart \
            lib/services/rpcs3_library_service.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            lib/services/rpcs3_launch_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/my_games_list/secondary_display.dart \
            lib/screens/secondary_screen/secondary_screen.dart \
            test/audio_policy_service_test.dart test/video_preview_lifecycle_test.dart \
            test/rpcs3_stage3_test.dart test/rpcs3_stage6_test.dart \
            test/rpcs3_stage7_test.dart test/home_music_silent_mode_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate generated RPCS3 JavaScript syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('assets/data/rpcs3_stikdebug_launch.js').read_text(encoding='utf-8')
          source = source.replace('__NEOSTATION_REQUEST_JSON__', json.dumps({
              'titleId': 'BLES00412', 'displayTitle': 'The Lord of the Rings: Conquest',
              'sourcePath': '/Data/games/discImgs/BLES00412',
              'sourceKind': 'disc-image', 'sessionId': 'syntax-test',
          }))
          source = source.replace('__NEOSTATION_SUPPORTED_CORES_JSON__', json.dumps({
              'CFE15492152B331E83959A3CF9AC8A9F': {'boot': 0x2FA18},
              '5C4D64FFB79930AD879C13009838F136': {
                  'boot': 0x36224, 'emulationState': 0x36A8C,
                  'bootProgress': 0x36AFC, 'globalState': 0x37A80,
                  'lastError': 0x37F34,
              },
          }))
          if '__NEOSTATION_' in source:
              raise SystemExit('Unresolved RPCS3 script placeholder')
          Path('/tmp/neostation-rpcs3-stage7.js').write_text(source, encoding='utf-8')
          PY
          node --check /tmp/neostation-rpcs3-stage7.js

      - name: Analyze Dart and Flutter source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run dedicated Stage 7 regression tests
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_library_service_test.dart \
            test/rpcs3_stage3_test.dart \
            test/rpcs3_stage6_test.dart \
            test/rpcs3_stage7_test.dart \
            test/home_music_silent_mode_test.dart \
            test/theme_provider_background_persistence_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Commit validated source and remove one-time automation
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/workflows/validate-stage7-once.yml tools/apply_stage7.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): centralize audio and harden RPCS3 video flows"
          git push origin HEAD:fix/audio-rpcs3-video-stage7-20260818
