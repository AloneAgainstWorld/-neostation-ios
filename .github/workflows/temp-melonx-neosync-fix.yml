name: Temporary MeloNX NeoSync iOS fix validation

on:
  push:
    branches:
      - fix/neosync-melonx-titleid

permissions:
  contents: write
  statuses: write

env:
  SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
  SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

jobs:
  build:
    if: github.event.head_commit.message == 'Run MeloNX NeoSync iOS fix'
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/neosync-melonx-titleid
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'pending',
              'context': 'neostation/melonx-neosync-titleid-fix',
              'description': f"run_id={os.environ['RUN_ID']}",
              'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
              },
          )
          urllib.request.urlopen(req, timeout=30).read()
          PY

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply MeloNX NeoSync fix
        run: |
          python3 build-utils/patch_neosync_melonx_titleid.py
          python3 build-utils/patch_neosync_melonx_titleid_fixup.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/providers/neosync/neosync_upload.dart \
            lib/providers/neosync/neosync_path_resolver.dart \
            lib/providers/neosync/neosync_core.dart \
            lib/providers/neosync/neosync_download.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify MeloNX mapping contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          upload = Path('lib/providers/neosync/neosync_upload.dart').read_text()
          resolver = Path('lib/providers/neosync/neosync_path_resolver.dart').read_text()
          core = Path('lib/providers/neosync/neosync_core.dart').read_text()
          download = Path('lib/providers/neosync/neosync_download.dart').read_text()
          assert '_uploadMeloNXFile' in upload
          assert "emulatorId: 'melonx'" in upload
          assert "scope: 'game'" in upload
          assert 'resolved.gameName' in upload
          assert '_parseMeloNXSaveLocation' in resolver
          assert "RegExp(r'^[0-9a-fA-F]{16}$')" in resolver
          assert "gameName: gameName" in resolver
          assert '_resolveMeloNXGameSaveDirectory' in resolver
          assert 'preferredGame: game' in core
          assert "parsed?.emulatorSlug == 'melonx'" in core
          assert "v2Path.emulatorSlug == 'melonx'" in download
          assert 'findSwitchGameByName(displayName)' in download
          print('MeloNX Title-ID local mapping / readable cloud-name contract verified')
          PY

      - name: Analyze changed source
        run: |
          flutter analyze --no-fatal-infos \
            lib/providers/neosync/neosync_upload.dart \
            lib/providers/neosync/neosync_path_resolver.dart \
            lib/providers/neosync/neosync_core.dart \
            lib/providers/neosync/neosync_download.dart

      - name: Run focused tests
        run: flutter test test/game_repository_test.dart

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeoStation Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/providers/neosync/neosync_upload.dart \
            lib/providers/neosync/neosync_path_resolver.dart \
            lib/providers/neosync/neosync_core.dart \
            lib/providers/neosync/neosync_download.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Fix MeloNX NeoSync save mapping'
            git push origin HEAD:fix/neosync-melonx-titleid
          fi

      - name: Validate ScreenScraper environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCREENSCRAPER_DEV_ID"
          test -n "$SCREENSCRAPER_DEV_PASSWORD"
          printf 'SCREENSCRAPER_DEV_ID=%s\nSCREENSCRAPER_DEV_PASSWORD=%s\n' \
            "$SCREENSCRAPER_DEV_ID" "$SCREENSCRAPER_DEV_PASSWORD" > .env
          chmod 600 .env

      - name: Patch flutter_localization for Xcode 16.2
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_LOCALIZATION_FILE=$(find "$HOME/.pub-cache" \
            -path '*flutter_localization-0.4.1/ios/flutter_localization/Sources/flutter_localization/FlutterLocalizationPlugin.swift' \
            -print -quit)
          test -n "$FLUTTER_LOCALIZATION_FILE"
          python3 - "$FLUTTER_LOCALIZATION_FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          old = '      binaryMessenger: registrar.messenger(),\n    )'
          new = '      binaryMessenger: registrar.messenger()\n    )'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          elif new not in s:
              raise SystemExit('Unexpected flutter_localization Swift source')
          PY

      - name: Keep iOS video audio-session policy intact
        run: |
          python3 build-utils/patch_ios_video_player_audio_session.py
          python3 build-utils/patch_ios_video_player_audio_session.py --check

      - name: Scaffold iOS platform if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi

      - name: Configure iOS project
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true
          plutil -lint "$PLIST"

      - name: Patch device_info_plus for runner SDK compatibility
        shell: bash
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path '*device_info_plus*/FPPDeviceInfoPlusPlugin.m' -print -quit)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate and force fork icon
        run: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Configure Flutter build
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-melonx-neosync.log

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -r ../../../NeoStation-MeloNX-NeoSync-fix.ipa Payload)

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-MeloNX-NeoSync-fix
          path: |
            NeoStation-MeloNX-NeoSync-fix.ipa
            build/ios/xcodebuild-melonx-neosync.log
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: rm -f .env
