name: Temporary gamepad menu scroll IPA

on:
  push:
    branches:
      - agent/gamepad-menu-scroll

permissions:
  contents: write
  statuses: write

concurrency:
  group: gamepad-menu-scroll-${{ github.ref }}
  cancel-in-progress: true

env:
  SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
  SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

jobs:
  build:
    if: github.event.head_commit.message == 'Run observable gamepad menu scroll build'
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/gamepad-menu-scroll
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'pending',
              'context': 'neostation/gamepad-menu-scroll',
              'description': f"run_id={os.environ['RUN_ID']}",
              'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply controller menu pacing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/utils/gamepad_nav.dart')
          s = p.read_text(encoding='utf-8')

          old_decl = """  /// Interval between the first few repeat events when a button is held.\n  static const Duration _repeatInterval = Duration(milliseconds: 80);\n"""
          new_decl = """  /// Fast repeat base used only by views that explicitly opt into\n  /// [accelerateRepeats], such as large game libraries.\n  static const Duration _repeatInterval = Duration(milliseconds: 80);\n\n  /// Steady cadence for ordinary menus. Most menu scroll animations take\n  /// 120-300 ms; repeating every 80 ms made the logical selection outrun the\n  /// viewport and repeatedly interrupted animateTo/ensureVisible calls.\n  /// Keeping menu repeats at 300 ms lets each move settle before the next one\n  /// while accelerated library browsing keeps the original fast ramp.\n  static const Duration _menuRepeatInterval = Duration(milliseconds: 300);\n"""
          if old_decl not in s:
              raise SystemExit('Expected repeat interval declaration not found')
          s = s.replace(old_decl, new_decl, 1)

          old_schedule = """          accelerateRepeats ? _rampedRepeatInterval(repeats) : _repeatInterval,\n"""
          new_schedule = """          accelerateRepeats\n              ? _rampedRepeatInterval(repeats)\n              : _menuRepeatInterval,\n"""
          if old_schedule not in s:
              raise SystemExit('Expected repeat scheduling expression not found')
          s = s.replace(old_schedule, new_schedule, 1)

          p.write_text(s, encoding='utf-8')
          PY
          dart format lib/utils/gamepad_nav.dart
          grep -n -A10 -B4 '_menuRepeatInterval' lib/utils/gamepad_nav.dart

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify menu pacing regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/utils/gamepad_nav.dart').read_text(encoding='utf-8')
          assert '_menuRepeatInterval = Duration(milliseconds: 300)' in s
          assert 'accelerateRepeats\n              ? _rampedRepeatInterval(repeats)\n              : _menuRepeatInterval' in s
          assert '_repeatInterval = Duration(milliseconds: 80)' in s
          print('Verified: ordinary menus use 300 ms repeats; accelerated libraries retain the 80 ms ramp base.')
          PY

      - name: Run focused controller tests
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for candidate in \
            test/ios_gamepad_navigation_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/gamepad_navigation_test.dart; do
            if [ -f "$candidate" ]; then tests+=("$candidate"); fi
          done
          if [ ${#tests[@]} -gt 0 ]; then
            flutter test "${tests[@]}"
          else
            flutter analyze lib/utils/gamepad_nav.dart
          fi

      - name: Commit validated source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeoStation Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/utils/gamepad_nav.dart
          if git diff --cached --quiet; then
            echo 'No source change to commit.'
          else
            git commit -m 'Fix controller menu repeat pacing'
            git push origin HEAD:agent/gamepad-menu-scroll
          fi

      - name: Validate ScreenScraper environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCREENSCRAPER_DEV_ID"
          test -n "$SCREENSCRAPER_DEV_PASSWORD"
          printf 'SCREENSCRAPER_DEV_ID=%s\nSCREENSCRAPER_DEV_PASSWORD=%s\n' \
            "$SCREENSCRAPER_DEV_ID" "$SCREENSCRAPER_DEV_PASSWORD" > .env
          chmod 600 .env

      - name: Scaffold iOS platform if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi

      - name: Configure generated iOS project
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' \
            ios/Runner.xcodeproj/project.pbxproj

          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"

      - name: Patch device_info_plus for runner SDK compatibility
        shell: bash
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" \
            -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" \
            2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Keep AVFoundation audio session owned by NeoStation
        shell: bash
        run: |
          python3 build-utils/patch_ios_video_player_audio_session.py
          python3 build-utils/patch_ios_video_player_audio_session.py --check

      - name: Generate app icons
        shell: bash
        run: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Configure Flutter build with ScreenScraper defines
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-unsigned.log

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -r ../../../NeoStation-gamepad-menu-fix.ipa Payload)

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-gamepad-menu-fix
          path: |
            NeoStation-gamepad-menu-fix.ipa
            build/ios/xcodebuild-unsigned.log
          if-no-files-found: warn

      - name: Cleanup secret file
        if: always()
        run: rm -f .env
