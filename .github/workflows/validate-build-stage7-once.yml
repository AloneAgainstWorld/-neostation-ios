name: Validate and build NeoStation Stage 7 once

on:
  push:
    branches:
      - fix/stage7-audio-rpcs3-video-20260818

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-stage7-audio-rpcs3-video
  cancel-in-progress: true

jobs:
  validate-build:
    name: Patch, test and build unsigned IPA 137
    runs-on: macos-latest
    environment: Production
    timeout-minutes: 130

    steps:
      - name: Checkout Stage 7 branch
        uses: actions/checkout@v7
        with:
          ref: fix/stage7-audio-rpcs3-video-20260818

      - name: Apply Stage 7 source patch
        run: python3 tools/apply_stage7.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/main.dart \
            lib/models/game_model.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/my_games_list/secondary_display.dart \
            lib/services/audio_policy_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/services/game/game_list_service.dart \
            lib/services/home_music_service.dart \
            lib/services/music_player_service.dart \
            lib/services/rpcs3_launch_service.dart \
            lib/services/rpcs3_library_service.dart \
            lib/services/sfx_service.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            test/audio_policy_service_test.dart \
            test/rpcs3_stage3_test.dart \
            test/rpcs3_stage6_test.dart \
            test/rpcs3_stage7_test.dart \
            test/video_preview_lifecycle_test.dart

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify Stage 7 invariants
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+137" pubspec.yaml
          grep -Fq "class AudioPolicyService" lib/services/audio_policy_service.dart
          grep -Fq "volume: 0.0" lib/services/audio_policy_service.dart
          grep -Fq "AudioPolicyService().playSoLoud" lib/services/sfx_service.dart
          grep -Fq "AudioPolicyService().playSoLoud" lib/services/home_music_service.dart
          grep -Fq "AudioPolicyService().playSoLoud" lib/services/music_player_service.dart
          grep -Fq "AVAudioSession.routeChangeNotification" packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift
          grep -Fq "case \"openJitRequest\"" packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift
          grep -Fq "openJitRequest" packages/external_folder_access/lib/external_folder_access.dart
          grep -Fq "GameModel.fromDatabaseModel(dbGame)" lib/services/game/game_list_service.dart
          grep -Fq "Do not create entries from games.yml" lib/services/rpcs3_library_service.dart
          grep -Fq "UPDATE user_screenscraper_metadata" lib/services/rpcs3_library_service.dart
          grep -Fq "0x36a8c" lib/services/rpcs3_launch_service.dart
          grep -Fq "0x36afc" lib/services/rpcs3_launch_service.dart
          grep -Fq "0x37f34" lib/services/rpcs3_launch_service.dart
          grep -Fq "NEOSTATION_RPC_BOOT_RESULT" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "NEOSTATION_RPC_LAST_ERROR" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "_videoGeneration" lib/screens/game_screen/my_games_list.dart
          grep -Fq "_queueVideoTransition" lib/screens/game_screen/my_games_list/secondary_display.dart
          grep -Fq "_waitForPreparedVideoFrame" lib/screens/game_screen/my_games_list/secondary_display.dart

      - name: Check generated RPCS3 JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('assets/data/rpcs3_stikdebug_launch.js').read_text(encoding='utf-8')
          replacements = {
              '__NEOSTATION_TITLE_ID_JSON__': json.dumps('BLES00412'),
              '__NEOSTATION_DISPLAY_TITLE_JSON__': json.dumps('The Lord of the Rings: Conquest'),
              '__NEOSTATION_SOURCE_PATH_JSON__': json.dumps('/Data/games/DiscImages/BLES00412'),
              '__NEOSTATION_SOURCE_KIND_JSON__': json.dumps('disc-image'),
              '__NEOSTATION_SESSION_ID_JSON__': json.dumps('ci-session'),
              '__NEOSTATION_SUPPORTED_CORES_JSON__': json.dumps({
                  'CFE15492152B331E83959A3CF9AC8A9F': {
                      'boot': 0x2FA18,
                      'state': 0x30254,
                      'progress': 0x302C4,
                      'lastError': 0x316B4,
                  },
                  '5C4D64FFB79930AD879C13009838F136': {
                      'boot': 0x36224,
                      'state': 0x36A8C,
                      'progress': 0x36AFC,
                      'lastError': 0x37F34,
                  },
              }),
          }
          for marker, value in replacements.items():
              source = source.replace(marker, value)
          if '__NEOSTATION_' in source:
              raise SystemExit('Unresolved RPCS3 script placeholder')
          Path('/tmp/neostation-rpcs3-stage7.js').write_text(source, encoding='utf-8')
          PY
          node --check /tmp/neostation-rpcs3-stage7.js

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run dedicated Stage 7 tests
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_library_service_test.dart \
            test/rpcs3_stage3_test.dart \
            test/rpcs3_stage6_test.dart \
            test/rpcs3_stage7_test.dart \
            test/theme_provider_background_persistence_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Create ScreenScraper build environment
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          : > .env
          [ -n "$SCREENSCRAPER_DEV_ID" ] && echo "SCREENSCRAPER_DEV_ID=$SCREENSCRAPER_DEV_ID" >> .env
          [ -n "$SCREENSCRAPER_DEV_PASSWORD" ] && echo "SCREENSCRAPER_DEV_PASSWORD=$SCREENSCRAPER_DEV_PASSWORD" >> .env
          test "$(wc -l < .env | tr -d ' ')" -eq 2
          chmod 600 .env

      - name: Scaffold iOS platform
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          fi
          # Flutter scaffolding creates a placeholder test incompatible with the
          # real MyApp constructor; it is not project source.
          rm -f test/widget_test.dart

      - name: Set iOS deployment target to 18.0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path('ios/Podfile')
          text = podfile.read_text(encoding='utf-8')
          if re.search(r"^\s*#?\s*platform\s+:ios,\s*'[^']+'", text, flags=re.MULTILINE):
              text = re.sub(
                  r"^\s*#?\s*platform\s+:ios,\s*'[^']+'",
                  "platform :ios, '18.0'",
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
          else:
              text = "platform :ios, '18.0'\n" + text
          podfile.write_text(text, encoding='utf-8')

          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          project_text = project.read_text(encoding='utf-8')
          project_text, count = re.subn(
              r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 18.0;',
              project_text,
          )
          if count == 0:
              raise SystemExit('Missing iOS deployment target')
          project.write_text(project_text, encoding='utf-8')
          PY

      - name: Configure iOS Info.plist
        run: |
          set -euo pipefail
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSSupportsOpeningDocumentsInPlace" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:4 string atariemulator" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:5 string stikdebug" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:6 string stikjit" "$PLIST"

      - name: Patch device_info_plus runner compatibility
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" 2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate fork app icons
        run: |
          set -euo pipefail
          SRC="assets/images/fork-icon-valid.jpg"
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          test -f "$SRC"
          make_icon() { sips -s format png -z "$1" "$1" "$SRC" --out "$ICON_DIR/$2" >/dev/null; }
          make_icon 20 "Icon-App-20x20@1x.png"
          make_icon 40 "Icon-App-20x20@2x.png"
          make_icon 60 "Icon-App-20x20@3x.png"
          make_icon 29 "Icon-App-29x29@1x.png"
          make_icon 58 "Icon-App-29x29@2x.png"
          make_icon 87 "Icon-App-29x29@3x.png"
          make_icon 40 "Icon-App-40x40@1x.png"
          make_icon 80 "Icon-App-40x40@2x.png"
          make_icon 120 "Icon-App-40x40@3x.png"
          make_icon 120 "Icon-App-60x60@2x.png"
          make_icon 180 "Icon-App-60x60@3x.png"
          make_icon 76 "Icon-App-76x76@1x.png"
          make_icon 152 "Icon-App-76x76@2x.png"
          make_icon 167 "Icon-App-83.5x83.5@2x.png"
          make_icon 1024 "Icon-App-1024x1024@1x.png"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Configure Flutter release build
        run: flutter build ios --release --no-codesign --config-only --dart-define-from-file=.env

      - name: Verify generated Dart defines
        run: grep -Fq "DART_DEFINES" ios/Flutter/Generated.xcconfig

      - name: Build unsigned application and package IPA 137
        run: |
          set -euo pipefail
          IPA="NeoStation-Fork-0.9.9-build137-stage7-audio-rpcs3-video.ipa"
          rm -rf build/ios/DerivedData build/ios/unsigned "$IPA"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")" = "18.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "0.9.9"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "137"
          SCRIPT="$APP_PATH/Frameworks/App.framework/flutter_assets/assets/data/rpcs3_stikdebug_launch.js"
          test -f "$SCRIPT"
          grep -Fq "NEOSTATION_RPC_BOOT_RESULT" "$SCRIPT"

          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -qry ../../../"$IPA" Payload)
          test -s "$IPA"
          unzip -tq "$IPA"

      - name: Verify ScreenScraper values in compiled binary
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          IPA="NeoStation-Fork-0.9.9-build137-stage7-audio-rpcs3-video.ipa"
          VERIFY_DIR="$RUNNER_TEMP/neostation-verify-137"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA" -d "$VERIFY_DIR"
          AOT_BINARY=$(find "$VERIFY_DIR/Payload" -path '*/Frameworks/App.framework/App' -type f -print -quit)
          test -n "$AOT_BINARY"
          python3 - "$AOT_BINARY" <<'PY'
          import os
          from pathlib import Path
          import sys

          binary = Path(sys.argv[1]).read_bytes()
          for name in ('SCREENSCRAPER_DEV_ID', 'SCREENSCRAPER_DEV_PASSWORD'):
              value = os.environ[name].encode()
              if not value or value not in binary:
                  raise SystemExit(f'Missing {name} in compiled binary')
          PY

      - name: Create checksum
        run: shasum -a 256 NeoStation-Fork-0.9.9-build137-stage7-audio-rpcs3-video.ipa > NeoStation-Fork-0.9.9-build137-stage7-audio-rpcs3-video.ipa.sha256

      - name: Upload IPA 137
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-Fork-0.9.9-build137-stage7-audio-rpcs3-video-ios
          path: |
            NeoStation-Fork-0.9.9-build137-stage7-audio-rpcs3-video.ipa
            NeoStation-Fork-0.9.9-build137-stage7-audio-rpcs3-video.ipa.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Commit validated source and remove one-time automation
        run: |
          set -euo pipefail
          rm -f .env
          rm -rf ios
          rm -f NeoStation-Fork-0.9.9-build137-stage7-audio-rpcs3-video.ipa
          rm -f NeoStation-Fork-0.9.9-build137-stage7-audio-rpcs3-video.ipa.sha256
          rm -f .github/workflows/validate-build-stage7-once.yml
          rm -f tools/apply_stage7.py
          rm -f test/widget_test.dart
          git checkout -- pubspec.lock analysis_options.yaml 2>/dev/null || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml 2>/dev/null || true
          git checkout -- packages/gamepads/analysis_options.yaml 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): centralize audio and harden RPCS3 video flows"
          git push origin HEAD:fix/stage7-audio-rpcs3-video-20260818

      - name: Remove environment file
        if: always()
        run: rm -f .env
