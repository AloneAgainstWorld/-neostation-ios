name: Apply and validate RPCS3 stage 3 v2

on:
  push:
    branches:
      - feature/rpcs3-stage3

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rpcs3-stage3-v2
  cancel-in-progress: true

jobs:
  validate:
    name: Apply, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/rpcs3-stage3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply RPCS3 persistence, scraping and launch patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          file = Path('lib/services/screenscraper_service.dart')
          text = file.read_text(encoding='utf-8')
          start = text.find('  static Future<Map<String, dynamic>> downloadGameManual({')
          end = text.find('\n  ///', start + 20)
          if start < 0 or end < 0:
              raise SystemExit('Could not isolate downloadGameManual')
          section = text[start:end]
          current = """          gameName: (systemFolder == 'android' || isMeloNxVirtual)
              ? gameName
              : null,
"""
          expected = """          gameName: isMeloNxVirtual ? gameName : null,
"""
          if current not in section:
              raise SystemExit('Current manual gameName marker not found')
          section = section.replace(current, expected, 1)
          file.write_text(text[:start] + section + text[end:], encoding='utf-8')
          PY

          python3 .github/scripts/apply_rpcs3_stage3.py

          python3 - <<'PY'
          from pathlib import Path

          file = Path('lib/services/screenscraper_service.dart')
          text = file.read_text(encoding='utf-8')
          start = text.find('  static Future<Map<String, dynamic>> downloadGameManual({')
          end = text.find('\n  ///', start + 20)
          if start < 0 or end < 0:
              raise SystemExit('Could not isolate patched downloadGameManual')
          section = text[start:end]
          generated = """          gameName: (isMeloNxVirtual || isRpcs3Virtual) ? gameName : null,
          serialNumber: isRpcs3Virtual ? serialNumber : null,
"""
          corrected = """          gameName:
              (systemFolder == 'android' ||
                  isMeloNxVirtual ||
                  isRpcs3Virtual)
              ? gameName
              : null,
          serialNumber: isRpcs3Virtual ? serialNumber : null,
"""
          if generated not in section:
              raise SystemExit('Generated manual RPCS3 block not found')
          section = section.replace(generated, corrected, 1)
          file.write_text(text[:start] + section + text[end:], encoding='utf-8')
          PY

      - name: Format changed Dart files
        run: |
          dart format \
            lib/main.dart \
            lib/data/datasources/sqlite_service.dart \
            lib/models/game_model.dart \
            lib/repositories/scraper_repository.dart \
            lib/services/screenscraper_service.dart \
            lib/services/rpcs3_library_service.dart \
            lib/services/rpcs3_launch_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/l10n/rpcs3_library_locale.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/game_details_card/game_details_card_list.dart \
            lib/screens/game_screen/game_settings_dialog/game_settings_scrapping_tab.dart \
            lib/screens/game_screen/game_settings_dialog/game_settings_manual_tab.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            test/rpcs3_stage3_test.dart

      - name: Verify integration source
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+131" pubspec.yaml
          grep -Fq "restoreAfterDatabaseReady" lib/services/rpcs3_library_service.dart
          grep -Fq "virtualDetections" lib/data/datasources/sqlite_service.dart
          grep -Fq "serialnum" lib/services/screenscraper_service.dart
          grep -Fq "serialNumber: game.titleId" lib/screens/game_screen/my_games_list.dart
          grep -Fq "openAppAfterJitPreflight" packages/external_folder_access/lib/external_folder_access.dart
          grep -Fq "openTargetApp" packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift
          grep -Fq "Rpcs3LaunchService.launchTitle" lib/services/game/game_launch_service.dart
          grep -Fq "CFE15492-152B-331E-8395-9A3CF9AC8A9F" lib/services/rpcs3_launch_service.dart
          grep -Fq "NEOSTATION_RPC_BOOT_REQUEST" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "final syntheticFilename = game.titleId" lib/services/rpcs3_library_service.dart

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run RPCS3 stage 3 tests
        run: flutter test test/rpcs3_library_service_test.dart test/rpcs3_stage3_test.dart

      - name: Run full Flutter test suite
        run: flutter test

      - name: Commit validated implementation and remove temporary automation
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/scripts/apply_rpcs3_stage3.py
          rm -f .github/workflows/rpcs3-stage3-once.yml
          rm -f .github/workflows/rpcs3-stage3-v2-once.yml
          rm -f _rpcs3_stage3_pr_marker
          rm -f .github/ISSUE_TEMPLATE/_noop_should_not_exist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ios): persist scrape and launch RPCS3 titles"
          git push origin HEAD:feature/rpcs3-stage3
