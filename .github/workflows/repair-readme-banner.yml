name: Repair README banner once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-readme-banner.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate current PNG
        run: |
          set -euxo pipefail
          file assets/readme/neostation-ios-preview.png
          ls -lh assets/readme/neostation-ios-preview.png
          xxd -l 32 assets/readme/neostation-ios-preview.png
          sips -g pixelWidth -g pixelHeight -g format assets/readme/neostation-ios-preview.png

      - name: Re-encode banner as JPEG
        run: |
          set -euxo pipefail
          sips -s format jpeg -s formatOptions 90 assets/readme/neostation-ios-preview.png --out assets/readme/neostation-ios-preview.jpg
          file assets/readme/neostation-ios-preview.jpg
          sips -g pixelWidth -g pixelHeight -g format assets/readme/neostation-ios-preview.jpg
          test -s assets/readme/neostation-ios-preview.jpg

      - name: Point README to repaired banner
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = '<img src="https://raw.githubusercontent.com/TarbleFR/neostation-ios/main/assets/readme/neostation-ios-preview.png" alt="NeoStation iOS menu preview" width="100%" />'
          new = '<img src="assets/readme/neostation-ios-preview.jpg" alt="NeoStation iOS menu preview" width="100%" />'
          if old not in text:
              raise SystemExit('Expected banner markup not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repaired banner
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/readme/neostation-ios-preview.jpg
          git commit -m "Repair README menu preview banner"
          git push origin HEAD:main
