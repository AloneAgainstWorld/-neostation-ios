name: Apply ScreenScraper iOS Safe Area

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_screenscraper_ios_safearea.py
      - .github/workflows/apply-screenscraper-ios-safearea.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply patch
        run: python3 tooling/patch_screenscraper_ios_safearea.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/screens/scraper_screen/new_scraper_options_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(ios): keep ScreenScraper clear of display cutouts"
          git push origin HEAD:feature/library-native
