name: Temporary pure AVFoundation iOS preview test

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

env:
  SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
  SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

jobs:
  build:
    if: github.event.head_commit.message == 'Build pure AVFoundation iOS test IPA'
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'pending',
              'context': 'neostation/pure-avfoundation-ios-test',
              'description': f"run_id={os.environ['RUN_ID']}",
              'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload, method='POST',
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
          )
          urllib.request.urlopen(req, timeout=30).read()
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove FVP completely from this iOS diagnostic build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          old = '  fvp: ^0.37.3\n'
          if old not in text:
              raise SystemExit('Expected fvp dependency line not found')
          pubspec.write_text(text.replace(old, '', 1), encoding='utf-8')

          main = Path('lib/main.dart')
          source = main.read_text(encoding='utf-8')
          source = source.replace("import 'package:fvp/fvp.dart';\n", '')
          if 'registerWith(' in source:
              raise SystemExit('Unexpected FVP registerWith call still present in main.dart')
          main.write_text(source, encoding='utf-8')
          PY
          dart format lib/main.dart
          grep -n "fvp" pubspec.yaml lib/main.dart && exit 1 || true

      - name: Resolve dependencies without FVP
        run: flutter pub get

      - name: Verify FVP is absent from resolved iOS build graph
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('.dart_tool/package_config.json').read_text())
          names = {p['name'] for p in cfg['packages']}
          if 'fvp' in names:
              raise SystemExit('FVP is still present in package_config')
          if 'video_player_avfoundation' not in names:
              raise SystemExit('video_player_avfoundation is missing')
          print('Pure AVFoundation graph verified: fvp absent, video_player_avfoundation present.')
          PY

      - name: Patch video_player_avfoundation silent-mode ownership
        run: |
          python3 build-utils/patch_ios_video_player_audio_session.py
          python3 build-utils/patch_ios_video_player_audio_session.py --check

      - name: Run targeted regression tests
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/home_music_silent_mode_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/ios_gamepad_navigation_test.dart

      - name: Prepare ScreenScraper build defines
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCREENSCRAPER_DEV_ID"
          test -n "$SCREENSCRAPER_DEV_PASSWORD"
          printf 'SCREENSCRAPER_DEV_ID=%s\nSCREENSCRAPER_DEV_PASSWORD=%s\n' "$SCREENSCRAPER_DEV_ID" "$SCREENSCRAPER_DEV_PASSWORD" > .env
          chmod 600 .env

      - name: Scaffold iOS if needed
        shell: bash
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          fi

      - name: Configure generated iOS project
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"

      - name: Patch device_info_plus for runner SDK compatibility
        shell: bash
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" 2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"; fi

      - name: Generate and force fork icon
        shell: bash
        run: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          pod install --repo-update

      - name: Configure Flutter with ScreenScraper defines
        run: |
          flutter build ios --release --no-codesign --config-only --dart-define-from-file=.env

      - name: Verify FVP native plugin is not registered
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "FvpPlugin\|package:fvp" ios/Runner ios/Flutter .dart_tool/flutter_build 2>/dev/null; then
            echo 'FVP registration unexpectedly found in generated iOS build.'
            exit 1
          fi
          python3 build-utils/patch_ios_video_player_audio_session.py --check
          echo 'Generated iOS runner contains no FVP registration.'

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-pure-avfoundation.log
          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -r ../../../NeoStation-pure-AVFoundation-iOS-test-unsigned.ipa Payload)
          rm -f .env

      - name: Create test report
        shell: bash
        run: |
          IPA_SHA=$(shasum -a 256 NeoStation-pure-AVFoundation-iOS-test-unsigned.ipa | awk '{print $1}')
          IPA_SIZE=$(stat -f %z NeoStation-pure-AVFoundation-iOS-test-unsigned.ipa)
          cat > NeoStation-pure-AVFoundation-iOS-test-report.txt <<EOF
          NeoStation pure AVFoundation iOS diagnostic build
          Source commit: ${{ github.sha }}
          Workflow run: ${{ github.run_id }}
          IPA SHA-256: $IPA_SHA
          IPA bytes: $IPA_SIZE

          Diagnostic delta:
          - fvp dependency removed from this build entirely
          - fvp Dart import absent
          - no FvpPlugin registration in generated iOS runner
          - video_player_avfoundation present and patched to leave NeoStation's .ambient session alone
          - existing 2-second preview delay, generation invalidation and serialized disposal retained
          EOF

      - name: Upload IPA and report
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-pure-AVFoundation-iOS-test-unsigned-ipa
          path: |
            NeoStation-pure-AVFoundation-iOS-test-unsigned.ipa
            NeoStation-pure-AVFoundation-iOS-test-report.txt
            build/ios/xcodebuild-pure-avfoundation.log
          if-no-files-found: error

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({'state': 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure', 'context': 'neostation/pure-avfoundation-ios-test', 'description': f"run_id={os.environ['RUN_ID']}", 'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}).encode()
          req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}", data=payload, method='POST', headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
          urllib.request.urlopen(req, timeout=30).read()
          PY
