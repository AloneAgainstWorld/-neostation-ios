name: Apply Library Full Catalog And Search

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_library_full_catalog_search.py
      - .github/workflows/apply-library-full-catalog-search.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply full catalog and title search patch
        run: python3 tooling/patch_library_full_catalog_search.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/services/library_aidoku_native_service.dart \
            lib/services/library_mangadex_service.dart \
            lib/screens/library_screen/library_screen.dart \
            test/library_aidoku_native_service_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat(library): stream full catalogs and search titles"
          git push origin HEAD:feature/library-native
