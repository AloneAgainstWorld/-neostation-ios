name: Validate NeoStation video preview Build 138

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-video-preview-build138
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test video preview stabilization
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout Build 138 branch
        uses: actions/checkout@v7
        with:
          ref: fix/video-preview-2s-stabilization-build138
          fetch-depth: 0

      - name: Apply 2 second cancellable stabilization window
        run: python3 tools/apply_video_preview_stabilization_build138.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/my_games_list/secondary_display.dart \
            test/video_preview_lifecycle_test.dart

      - name: Verify stabilization implementation
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+138" pubspec.yaml
          grep -Fq "Duration(seconds: 2)" lib/screens/game_screen/my_games_list.dart
          grep -Fq "Timer(_SystemGamesListState._videoStartDelay" lib/screens/game_screen/my_games_list/secondary_display.dart
          grep -Fq "generation != _videoGeneration" lib/screens/game_screen/my_games_list/secondary_display.dart
          grep -Fq "_selectedGame != scheduledGame" lib/screens/game_screen/my_games_list/secondary_display.dart
          grep -Fq "_videoTimer?.cancel()" lib/screens/game_screen/my_games_list/secondary_display.dart
          grep -Fq "await controller.dispose()" lib/screens/game_screen/my_games_list/secondary_display.dart

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run focused video and audio regression tests
        run: |
          flutter test \
            test/video_preview_lifecycle_test.dart \
            test/audio_policy_service_test.dart \
            test/home_music_silent_mode_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Commit validated Build 138 source and remove temporary automation
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/workflows/validate-video-preview-build138-once.yml
          rm -f tools/apply_video_preview_stabilization_build138.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(video): stabilize preview startup for two seconds"
          git push origin HEAD:fix/video-preview-2s-stabilization-build138
