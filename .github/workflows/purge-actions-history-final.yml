name: Purge remaining GitHub Actions history

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  purge:
    if: github.event.head_commit.message == 'Purge remaining GitHub Actions history'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel and delete every other workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'NeoStation complete Actions purge',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as error:
                  if error.code in (404, 409, 422):
                      return error.code, None
                  raise

          def list_runs():
              _, payload = request(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page=1')
              return (payload or {}).get('workflow_runs', [])

          deleted = 0
          cancelled = 0
          for _ in range(200):
              runs = [r for r in list_runs() if int(r['id']) != current]
              if not runs:
                  break

              progress = False
              for run in runs:
                  run_id = int(run['id'])
                  status = run.get('status')
                  if status == 'completed':
                      code, _ = request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}', 'DELETE')
                      if code in (204, 404):
                          deleted += code == 204
                          progress = True
                      continue

                  # Recent action_required/queued/waiting/in_progress runs cannot
                  # be deleted until they are completed. Force-cancel them first.
                  code, _ = request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/force-cancel', 'POST')
                  if code in (202, 409, 422, 404):
                      if code == 202:
                          cancelled += 1
                      progress = True

              time.sleep(2)
              if not progress:
                  break
          else:
              raise SystemExit('Purge loop exceeded safety limit')

          # Final deletion sweep after cancellations settle.
          for _ in range(60):
              runs = [r for r in list_runs() if int(r['id']) != current]
              if not runs:
                  break
              for run in runs:
                  run_id = int(run['id'])
                  if run.get('status') != 'completed':
                      request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/force-cancel', 'POST')
                      continue
                  code, _ = request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}', 'DELETE')
                  if code == 204:
                      deleted += 1
              time.sleep(2)

          leftovers = [
              (int(r['id']), r.get('status'), r.get('name'))
              for r in list_runs() if int(r['id']) != current
          ]
          if leftovers:
              raise SystemExit(f'Runs still present after purge: {leftovers}')
          print(f'Cancelled {cancelled} run(s); deleted {deleted} run(s).')
          PY

      - name: Remove temporary purge workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/purge-actions-history-final.yml'
          sha=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/contents/$path?ref=main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          payload=$(python3 - <<PY
          import json
          print(json.dumps({"message":"Remove temporary Actions purge workflow [skip actions]","sha":"$sha","branch":"main"}))
          PY
          )
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            "https://api.github.com/repos/$REPO/contents/$path" >/dev/null

      - name: Best-effort delete this purge run after completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          cat >/tmp/self-delete-run.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          for _ in $(seq 1 90); do
            sleep 2
            status=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$CURRENT_RUN_ID" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null)
            if [ "$status" = "completed" ]; then
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/actions/runs/$CURRENT_RUN_ID" >/dev/null 2>&1
              exit 0
            fi
          done
          SH
          chmod +x /tmp/self-delete-run.sh
          RUNNER_TRACKING_ID='' setsid nohup /tmp/self-delete-run.sh >/tmp/self-delete-run.log 2>&1 </dev/null &
