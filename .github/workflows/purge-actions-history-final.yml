name: Purge all GitHub Actions history

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  purge:
    if: github.event.head_commit.message == 'Purge all GitHub Actions history'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every completed workflow run except this one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'NeoStation final Actions purge',
          }

          deleted = 0
          while True:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page=1',
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  runs = json.load(response).get('workflow_runs', [])

              candidates = [
                  int(run['id']) for run in runs
                  if int(run['id']) != current and run.get('status') == 'completed'
              ]
              if not candidates:
                  break

              progress = 0
              for run_id in candidates:
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                      method='DELETE',
                      headers=headers,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30):
                          pass
                      deleted += 1
                      progress += 1
                  except urllib.error.HTTPError as error:
                      if error.code not in (404, 409):
                          raise
              if progress == 0:
                  break

          # Final check: only this run or non-completed runs may remain.
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page=1',
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              remaining = json.load(response).get('workflow_runs', [])
          leftovers = [
              (int(run['id']), run.get('status'), run.get('name'))
              for run in remaining if int(run['id']) != current
          ]
          if leftovers:
              raise SystemExit(f'Unexpected runs still present: {leftovers}')
          print(f'Deleted {deleted} workflow run(s).')
          PY

      - name: Remove this temporary workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/purge-actions-history-final.yml'
          encoded_path='.github/workflows/purge-actions-history-final.yml'
          sha=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/contents/$encoded_path?ref=main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          payload=$(python3 - <<PY
          import json
          print(json.dumps({"message":"Remove temporary Actions purge workflow [skip actions]","sha":"$sha","branch":"main"}))
          PY
          )
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            "https://api.github.com/repos/$REPO/contents/$encoded_path" >/dev/null
