name: Purge remaining Actions now

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  purge:
    if: github.event.head_commit.message == 'Purge remaining Actions now'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel and purge every other run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'NeoStation final Actions purge',
          }

          def call(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return response.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as error:
                  if error.code in (404, 409, 422):
                      return error.code, None
                  raise

          def list_runs():
              _, payload = call(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page=1')
              return (payload or {}).get('workflow_runs', [])

          def handle(run):
              run_id = int(run['id'])
              status = run.get('status')
              base = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
              if status == 'completed':
                  code, _ = call(base, 'DELETE')
                  return ('deleted', run_id, code)

              code, _ = call(base + '/force-cancel', 'POST')
              if code != 202:
                  code2, _ = call(base + '/cancel', 'POST')
                  if code2 == 202:
                      return ('cancelled', run_id, code2)
                  # A DELETE is harmless to attempt; GitHub accepts it only when allowed.
                  code3, _ = call(base, 'DELETE')
                  return ('blocked', run_id, (code, code2, code3))
              return ('cancelled', run_id, code)

          deleted = set()
          cancelled = set()
          blocked = {}

          for cycle in range(80):
              runs = [r for r in list_runs() if int(r['id']) != current]
              if not runs:
                  break

              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
                  results = list(pool.map(handle, runs))

              made_progress = False
              for kind, run_id, code in results:
                  if kind == 'deleted' and code in (204, 404):
                      deleted.add(run_id)
                      made_progress = True
                  elif kind == 'cancelled' and code == 202:
                      cancelled.add(run_id)
                      made_progress = True
                  elif kind == 'blocked':
                      blocked[run_id] = code

              if cycle % 5 == 0:
                  print(f'cycle={cycle} remaining={len(runs)} deleted={len(deleted)} cancelled={len(cancelled)}')
              time.sleep(2)

              # Even if one cycle reports no progress, statuses may still be
              # settling from cancellations issued in the previous cycle.
              if not made_progress and cycle >= 5:
                  time.sleep(5)

          remaining = [r for r in list_runs() if int(r['id']) != current]
          if remaining:
              summary = [(int(r['id']), r.get('status'), r.get('name')) for r in remaining]
              raise SystemExit(f'Unable to remove these runs: {summary}; blocked={blocked}')

          print(f'Purged all other runs. deleted={len(deleted)} cancelled={len(cancelled)}')
          PY

      - name: Remove this temporary workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/purge-actions-history-final.yml'
          sha=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/contents/$path?ref=main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          payload=$(python3 - <<PY
          import json
          print(json.dumps({"message":"Remove final Actions purge workflow [skip actions]","sha":"$sha","branch":"main"}))
          PY
          )
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            "https://api.github.com/repos/$REPO/contents/$path" >/dev/null

      - name: Best-effort self-delete this final run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          cat >/tmp/self-delete-run.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          for _ in $(seq 1 120); do
            sleep 1
            status=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$CURRENT_RUN_ID" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null)
            if [ "$status" = "completed" ]; then
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/actions/runs/$CURRENT_RUN_ID" >/dev/null 2>&1
              exit 0
            fi
          done
          SH
          chmod +x /tmp/self-delete-run.sh
          RUNNER_TRACKING_ID='' setsid nohup /tmp/self-delete-run.sh >/tmp/self-delete-run.log 2>&1 </dev/null &
