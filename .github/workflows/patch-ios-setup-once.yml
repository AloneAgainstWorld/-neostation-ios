name: Apply iOS setup localization and button patch

on:
  push:
    branches:
      - fix/retroarch-localization-art-button

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/retroarch-localization-art-button

      - name: Patch iOS setup wizard
        run: python3 .github/scripts/patch_ios_setup_locale_button.py

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/setup_wizard.dart
          git diff --cached --quiet && exit 0
          git commit -m "Localize RetroArch setup and restore readable art button"
          git push origin HEAD:fix/retroarch-localization-art-button
