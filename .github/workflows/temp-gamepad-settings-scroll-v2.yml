name: Temporary gamepad settings scroll v2
on:
  push:
    branches: [main]
permissions:
  contents: write
  statuses: write
jobs:
  test-build:
    if: github.event.head_commit.message == 'Run gamepad settings scroll fix v2'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"pending\",\"context\":\"neostation/gamepad-settings-scroll-v2\",\"description\":\"run_id=$RUN_ID\"}"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply targeted patch
        run: python3 build-utils/temp_patch_gamepad_settings_scroll.py
      - name: Format and validate diff
        run: |
          dart format \
            lib/widgets/system_emulator_settings_dialog.dart \
            lib/widgets/system_emulator_settings_dialog/system_info.dart \
            lib/widgets/system_emulator_settings_dialog/gamepad_nav.dart \
            lib/screens/scraper_screen/scraper_contents/media_content.dart \
            lib/screens/scraper_screen/new_scraper_options_screen.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/gamepad_settings_scrolling_test.dart
          git diff --check
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply AVFoundation audio-session patch
        run: |
          python3 build-utils/patch_ios_video_player_audio_session.py
          python3 build-utils/patch_ios_video_player_audio_session.py --check
      - name: Run focused regression tests
        run: |
          flutter test \
            test/gamepad_settings_scrolling_test.dart \
            test/ios_gamepad_navigation_test.dart \
            test/audio_policy_service_test.dart \
            test/home_music_silent_mode_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_stage7_test.dart \
            test/rpcs3_library_service_test.dart
      - name: Prepare ScreenScraper defines
        run: |
          test -n "$SCREENSCRAPER_DEV_ID"
          test -n "$SCREENSCRAPER_DEV_PASSWORD"
          printf 'SCREENSCRAPER_DEV_ID=%s\nSCREENSCRAPER_DEV_PASSWORD=%s\n' "$SCREENSCRAPER_DEV_ID" "$SCREENSCRAPER_DEV_PASSWORD" > .env
          chmod 600 .env
      - name: Scaffold iOS platform
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          fi
      - name: Configure generated iOS project
        run: |
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"
      - name: Patch device_info_plus for runner SDK compatibility
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" 2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi
      - name: Generate and force fork icon
        run: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh
      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update
      - name: Verify AVFoundation patch after CocoaPods
        run: python3 build-utils/patch_ios_video_player_audio_session.py --check
      - name: Configure Flutter iOS build
        run: flutter build ios --release --no-codesign --config-only --dart-define-from-file=.env
      - name: Build unsigned IPA
        run: |
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-gamepad-scroll.log
          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -r ../../../NeoStation-gamepad-settings-scroll-unsigned.ipa Payload)
          shasum -a 256 NeoStation-gamepad-settings-scroll-unsigned.ipa > NeoStation-gamepad-settings-scroll-unsigned.ipa.sha256
      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-gamepad-settings-scroll-test
          path: |
            NeoStation-gamepad-settings-scroll-unsigned.ipa
            NeoStation-gamepad-settings-scroll-unsigned.ipa.sha256
            build/ios/xcodebuild-gamepad-scroll.log
          if-no-files-found: error
      - name: Commit validated source fixes
        run: |
          rm -f .env
          git config user.name 'Tarble FR'
          git config user.email 'f9wynyv9qy@privaterelay.appleid.com'
          git add \
            lib/widgets/system_emulator_settings_dialog.dart \
            lib/widgets/system_emulator_settings_dialog/system_info.dart \
            lib/widgets/system_emulator_settings_dialog/gamepad_nav.dart \
            lib/screens/scraper_screen/scraper_contents/media_content.dart \
            lib/screens/scraper_screen/new_scraper_options_screen.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/gamepad_settings_scrolling_test.dart
          git diff --cached --check
          git commit -m 'Fix gamepad scrolling in settings'
          git push origin HEAD:main
      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"neostation/gamepad-settings-scroll-v2\",\"description\":\"run_id=$RUN_ID\"}"
