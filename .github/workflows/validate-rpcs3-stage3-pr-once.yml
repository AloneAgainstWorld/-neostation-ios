name: Validate RPCS3 stage 3 PR once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: validate-rpcs3-stage3-pr
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.number == 42
    name: Analyze and test RPCS3 stage 3
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/rpcs3-stage3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify implementation markers
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+131" pubspec.yaml
          grep -Fq "restoreAfterDatabaseReady" lib/services/rpcs3_library_service.dart
          grep -Fq "virtualDetections" lib/data/datasources/sqlite_service.dart
          grep -Fq "serialnum" lib/services/screenscraper_service.dart
          grep -Fq "screenscraperRealName" lib/models/game_model.dart
          grep -Fq "Rpcs3LaunchService.launchTitle" lib/services/game/game_launch_service.dart
          grep -Fq "CFE15492-152B-331E-8395-9A3CF9AC8A9F" lib/services/rpcs3_launch_service.dart
          grep -Fq "NEOSTATION_RPC_BOOT_REQUEST" assets/data/rpcs3_stikdebug_launch.js

      - name: Check generated RPCS3 JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('assets/data/rpcs3_stikdebug_launch.js').read_text(encoding='utf-8')
          source = source.replace('__NEOSTATION_TITLE_ID_JSON__', '"BLES00113"')
          source = source.replace('__NEOSTATION_CORE_UUID_JSON__', '"CFE15492-152B-331E-8395-9A3CF9AC8A9F"')
          source = source.replace('__NEOSTATION_BOOT_OFFSET_HEX__', '2fa18')
          Path('/tmp/rpcs3_stikdebug_launch.js').write_text(source, encoding='utf-8')
          PY
          node --check /tmp/rpcs3_stikdebug_launch.js

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run dedicated RPCS3 tests
        run: flutter test test/rpcs3_library_service_test.dart test/rpcs3_stage3_test.dart

      - name: Run full Flutter test suite
        run: flutter test
