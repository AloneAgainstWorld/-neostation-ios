name: Apply iOS Safe Area Remaining Tabs

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_ios_safearea_remaining_tabs.py
      - .github/workflows/apply-ios-safearea-remaining-tabs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply patch
        run: python3 tooling/patch_ios_safearea_remaining_tabs.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/screens/retro_achievements_screen/ra_content.dart \
            lib/screens/search_screen/search_screen.dart \
            lib/screens/neo_sync_screen/login_screen/neo_sync_content.dart \
            lib/screens/systems_screen/system_content.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(ios): keep remaining tabs clear of display cutouts"
          git push origin HEAD:feature/library-native
