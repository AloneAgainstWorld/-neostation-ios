name: Apply Library Direct Aidoku Integration

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_library_direct_aidoku.py
      - .github/workflows/apply-library-direct-aidoku.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply patch
        run: python3 tooling/patch_library_direct_aidoku.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/screens/library_screen/library_screen.dart lib/screens/library_screen/library_reader_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat(library): merge Aidoku manga into native catalog"
          git push origin HEAD:feature/library-native

# Explicit trigger after native source bridge landed.
