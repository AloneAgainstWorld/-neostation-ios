name: Apply Library Adaptive Pages Safety Filters

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_library_adaptive_pages_safety_filters.py
      - .github/workflows/apply-library-adaptive-pages-safety-filters.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply patch
        run: python3 tooling/patch_library_adaptive_pages_safety_filters.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/screens/library_screen/library_screen.dart \
            lib/screens/library_screen/library_reader_screen.dart \
            lib/services/library_aidoku_native_service.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(library): adapt long pages strengthen filtering and align filters"
          git push origin HEAD:feature/library-native
