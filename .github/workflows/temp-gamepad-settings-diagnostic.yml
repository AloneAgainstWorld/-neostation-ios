name: Temporary gamepad settings diagnostic
on:
  push:
    branches: [main]
permissions:
  statuses: write
  contents: read
jobs:
  diagnostic:
    if: github.event.head_commit.message == 'Run gamepad settings diagnostic'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"pending\",\"context\":\"neostation/gamepad-settings-diagnostic\",\"target_url\":\"https://github.com/$REPO/actions/runs/$RUN_ID\"}"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply targeted patch
        run: python3 build-utils/temp_patch_gamepad_settings_scroll.py
      - name: Format and validate diff
        run: |
          dart format \
            lib/widgets/system_emulator_settings_dialog.dart \
            lib/widgets/system_emulator_settings_dialog/system_info.dart \
            lib/widgets/system_emulator_settings_dialog/gamepad_nav.dart \
            lib/screens/scraper_screen/scraper_contents/media_content.dart \
            lib/screens/scraper_screen/new_scraper_options_screen.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/gamepad_settings_scrolling_test.dart
          git diff --check
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run focused tests
        run: |
          flutter test \
            test/gamepad_settings_scrolling_test.dart \
            test/ios_gamepad_navigation_test.dart \
            test/audio_policy_service_test.dart \
            test/home_music_silent_mode_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_stage7_test.dart \
            test/rpcs3_library_service_test.dart
      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"neostation/gamepad-settings-diagnostic\",\"target_url\":\"https://github.com/$REPO/actions/runs/$RUN_ID\"}"
