name: Apply lawful Library download support

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tools/enable_legal_library_downloads.py
      - .github/workflows/apply-legal-library-downloads.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
          fetch-depth: 0
      - name: Apply lawful download integration
        run: python3 tools/enable_legal_library_downloads.py
      - name: Format changed Dart files
        run: dart format lib/services/library_catalog_service.dart lib/services/library_metadata_provider_service.dart lib/screens/library_screen/library_screen.dart
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/library_catalog_service.dart \
            lib/services/library_metadata_provider_service.dart \
            lib/screens/library_screen/library_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: preserve lawful Library download links"
          git push origin HEAD:feature/library-native
