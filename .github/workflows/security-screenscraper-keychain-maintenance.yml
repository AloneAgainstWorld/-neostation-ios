name: ScreenScraper credential security migration

on:
  push:
    branches:
      - security/screenscraper-keychain

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/screenscraper-keychain
          fetch-depth: 0

      - name: Apply secure ScreenScraper credential storage
        run: python3 tools/security_screenscraper_keychain.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/repositories/scraper_repository.dart lib/services/screenscraper/screenscraper_credential_store.dart test/scraper_repository_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run ScreenScraper repository tests
        run: flutter test test/scraper_repository_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit validated security change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/repositories/scraper_repository.dart lib/services/screenscraper/screenscraper_credential_store.dart test/scraper_repository_test.dart
          if git diff --cached --quiet; then
            echo "Security changes already committed."
            exit 0
          fi
          git commit -m "Store ScreenScraper passwords in secure storage"
          git push origin security/screenscraper-keychain
