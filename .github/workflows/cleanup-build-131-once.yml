name: Clean temporary Build 131 automation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ github.token }}

jobs:
  cleanup:
    name: Remove workflows and close build PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          ref: build/ios-131-rpcs3-stage3-final

      - name: Remove temporary workflows and prerelease
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-131-rpcs3-stage3-once.yml
          rm -f .github/workflows/publish-build-131-rpcs3-stage3-once.yml
          rm -f .github/workflows/cleanup-build-131-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary Build 131 automation"
          git push origin HEAD:build/ios-131-rpcs3-stage3-final

          TAG="neostation-0.9.9-build131-rpcs3-stage3-test"
          gh release delete "$TAG" --repo TarbleFR/neostation-ios --yes --cleanup-tag 2>/dev/null || true

          PR_NUMBER=$(gh pr list \
            --repo TarbleFR/neostation-ios \
            --head build/ios-131-rpcs3-stage3-final \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr close "$PR_NUMBER" \
              --repo TarbleFR/neostation-ios \
              --comment "Build 131 succeeded, the IPA was collected, and the temporary workflows were removed. This build-only PR is closed without merging."
          fi
