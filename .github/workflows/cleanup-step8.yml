name: Step 8 conservative cleanup

on:
  push:
    branches:
      - cleanup/remove-proven-dead-code
    paths:
      - '.github/workflows/cleanup-step8.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v7
        with:
          ref: cleanup/remove-proven-dead-code

      - name: Remove analyzer-proven unused imports only
        shell: python
        run: |
          from pathlib import Path

          edits = {
              'lib/services/armsx2_library_service.dart': "import 'package:flutter/widgets.dart';\n",
              'lib/services/home_music_service.dart': "import 'package:flutter/foundation.dart';\n",
              'lib/services/melonx_library_service.dart': "import 'package:flutter/widgets.dart';\n",
              'lib/services/retroarch_library_service.dart': "import 'package:flutter/widgets.dart';\n",
          }

          for filename, target in edits.items():
              path = Path(filename)
              text = path.read_text()
              count = text.count(target)
              if count != 1:
                  raise SystemExit(f'{filename}: expected exactly one target import, found {count}')
              path.write_text(text.replace(target, '', 1))

      - name: Verify only expected source files changed
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            lib/services/armsx2_library_service.dart \
            lib/services/home_music_service.dart \
            lib/services/melonx_library_service.dart \
            lib/services/retroarch_library_service.dart | sort)"
          test "$changed" = "$expected"

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/armsx2_library_service.dart \
                  lib/services/home_music_service.dart \
                  lib/services/melonx_library_service.dart \
                  lib/services/retroarch_library_service.dart
          git commit -m "Remove analyzer-proven unused imports"
          git push origin HEAD:cleanup/remove-proven-dead-code
