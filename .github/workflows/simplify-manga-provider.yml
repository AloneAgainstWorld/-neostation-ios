name: Simplify Manga Provider sources

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tools/simplify_manga_provider_sources.py
      - .github/workflows/simplify-manga-provider.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
          fetch-depth: 0
      - name: Apply Manga Provider simplification
        run: python3 tools/simplify_manga_provider_sources.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "refactor: keep Manga Provider sources simple"
          git push origin HEAD:feature/library-native
