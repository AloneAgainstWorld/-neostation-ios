name: Apply Library Search Keyboard Layout

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_library_search_keyboard_layout.py
      - .github/workflows/apply-library-search-keyboard-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply search keyboard layout patch
        run: python3 tooling/patch_library_search_keyboard_layout.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/screens/library_screen/library_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(library): keep search field above iOS keyboard"
          git push origin HEAD:feature/library-native
