name: Build one-time NeoStation validation IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-one-time-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    environment: Production
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify planned fork features are present
        run: |
          set -euo pipefail
          test -f lib/screens/systems_screen/fork_first_run_onboarding.dart
          test -f lib/l10n/fork_onboarding_locale.dart
          grep -Fq "ForkFirstRunOnboarding" lib/screens/systems_screen/system_content.dart
          grep -Fq "'zh_Hant'" lib/l10n/fork_onboarding_locale.dart
          grep -Fq "'NeoStation Fork'" lib/screens/settings_screen/new_settings_options/about_settings_content.dart
          grep -Fq "https://www.patreon.com/cw/TarbleFR" lib/screens/settings_screen/new_settings_options/about_settings_content.dart
          grep -Fq "FilePicker.pickFiles" lib/services/home_music_service.dart
          grep -Fq "_syncHomeMusic(showContent && routeIsCurrent);" lib/screens/systems_screen/system_content.dart
          echo "Onboarding, About and custom main-menu music sources verified."

      - name: Create ScreenScraper environment
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          : > .env
          [ -n "$SCREENSCRAPER_DEV_ID" ] && echo "SCREENSCRAPER_DEV_ID=$SCREENSCRAPER_DEV_ID" >> .env
          [ -n "$SCREENSCRAPER_DEV_PASSWORD" ] && echo "SCREENSCRAPER_DEV_PASSWORD=$SCREENSCRAPER_DEV_PASSWORD" >> .env
          if [ "$(wc -l < .env | tr -d ' ')" -ne 2 ]; then
            echo "::error::ScreenScraper Production secrets are missing."
            exit 1
          fi
          chmod 600 .env

      - name: Verify ScreenScraper developer credentials
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({
              "devid": os.environ["SCREENSCRAPER_DEV_ID"],
              "devpassword": os.environ["SCREENSCRAPER_DEV_PASSWORD"],
              "softname": "neostation-ios-ci",
              "output": "json",
          })
          request = urllib.request.Request(
              "https://api.screenscraper.fr/api2/ssinfraInfos.php?" + query,
              headers={"User-Agent": "NeoStation/1.0", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=40) as response:
                  status = response.status
                  body = response.read()
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read()

          print(f"ScreenScraper preflight HTTP status: {status}")
          if status != 200:
              sys.exit(1)
          payload = json.loads(body.decode("utf-8"))
          if str(payload.get("header", {}).get("success")).lower() not in {"true", "1"}:
              sys.exit(1)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          xcodebuild -version

      - name: Scaffold iOS platform if missing
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          fi
          test -d ios

      - name: Set iOS deployment target to 18.0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          podfile = pathlib.Path('ios/Podfile')
          pod_text = podfile.read_text(encoding='utf-8')
          if re.search(r"^\s*#?\s*platform\s+:ios,\s*'[^']+'", pod_text, flags=re.MULTILINE):
              pod_text = re.sub(
                  r"^\s*#?\s*platform\s+:ios,\s*'[^']+'",
                  "platform :ios, '18.0'",
                  pod_text,
                  count=1,
                  flags=re.MULTILINE,
              )
          else:
              pod_text = "platform :ios, '18.0'\n" + pod_text
          podfile.write_text(pod_text, encoding='utf-8')

          project = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          project_text = project.read_text(encoding='utf-8')
          project_text, count = re.subn(
              r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 18.0;',
              project_text,
          )
          if count == 0:
              raise SystemExit('No IPHONEOS_DEPLOYMENT_TARGET entry found')
          project.write_text(project_text, encoding='utf-8')
          PY
          grep -F "platform :ios, '18.0'" ios/Podfile
          grep -F "IPHONEOS_DEPLOYMENT_TARGET = 18.0;" ios/Runner.xcodeproj/project.pbxproj

      - name: Patch Info.plist for NeoStation iOS
        run: |
          set -euo pipefail
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSSupportsOpeningDocumentsInPlace" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Patch device_info_plus for runner SDK compatibility
        run: |
          set -euo pipefail
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" 2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate iOS fork app icons
        run: |
          set -euo pipefail
          SRC="assets/images/fork-icon-valid.jpg"
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          test -f "$SRC"
          test -d "$ICON_DIR"
          file "$SRC"
          sips -g pixelWidth -g pixelHeight "$SRC"
          make_icon() {
            local size="$1"
            local name="$2"
            sips -s format png -z "$size" "$size" "$SRC" --out "$ICON_DIR/$name" >/dev/null
          }
          make_icon 20 "Icon-App-20x20@1x.png"
          make_icon 40 "Icon-App-20x20@2x.png"
          make_icon 60 "Icon-App-20x20@3x.png"
          make_icon 29 "Icon-App-29x29@1x.png"
          make_icon 58 "Icon-App-29x29@2x.png"
          make_icon 87 "Icon-App-29x29@3x.png"
          make_icon 40 "Icon-App-40x40@1x.png"
          make_icon 80 "Icon-App-40x40@2x.png"
          make_icon 120 "Icon-App-40x40@3x.png"
          make_icon 120 "Icon-App-60x60@2x.png"
          make_icon 180 "Icon-App-60x60@3x.png"
          make_icon 76 "Icon-App-76x76@1x.png"
          make_icon 152 "Icon-App-76x76@2x.png"
          make_icon 167 "Icon-App-83.5x83.5@2x.png"
          make_icon 1024 "Icon-App-1024x1024@1x.png"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Configure Flutter release build
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only --dart-define-from-file=.env

      - name: Verify generated DART_DEFINES
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import pathlib

          config = pathlib.Path('ios/Flutter/Generated.xcconfig')
          encoded = None
          for line in config.read_text(encoding='utf-8').splitlines():
              if line.startswith('DART_DEFINES='):
                  encoded = line.split('=', 1)[1]
                  break
          if not encoded:
              raise SystemExit('DART_DEFINES is missing from Generated.xcconfig')
          decoded = {
              base64.b64decode(item).decode('utf-8')
              for item in encoded.split(',')
              if item
          }
          expected = {
              'SCREENSCRAPER_DEV_ID=' + os.environ['SCREENSCRAPER_DEV_ID'],
              'SCREENSCRAPER_DEV_PASSWORD=' + os.environ['SCREENSCRAPER_DEV_PASSWORD'],
          }
          if not expected.issubset(decoded):
              raise SystemExit('ScreenScraper defines are missing from Generated.xcconfig')
          print('ScreenScraper defines verified in Generated.xcconfig.')
          PY

      - name: Build unsigned app and package IPA
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned NeoStation-Fork.ipa
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-test.log

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          MINIMUM_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist")
          test "$MINIMUM_OS" = "18.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$APP_PATH/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$APP_PATH/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP_PATH/Info.plist")" = "neostation"

          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -qry ../../../NeoStation-Fork.ipa Payload)
          test -s NeoStation-Fork.ipa

      - name: Verify ScreenScraper values in compiled binary
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/neostation-test-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q NeoStation-Fork.ipa -d "$VERIFY_DIR"
          AOT_BINARY=$(find "$VERIFY_DIR/Payload" -path '*/Frameworks/App.framework/App' -type f -print -quit)
          test -n "$AOT_BINARY"
          python3 - "$AOT_BINARY" <<'PY'
          import os
          import pathlib
          import sys

          binary = pathlib.Path(sys.argv[1]).read_bytes()
          expected = {
              'SCREENSCRAPER_DEV_ID': os.environ['SCREENSCRAPER_DEV_ID'].encode(),
              'SCREENSCRAPER_DEV_PASSWORD': os.environ['SCREENSCRAPER_DEV_PASSWORD'].encode(),
          }
          missing = [name for name, value in expected.items() if value not in binary]
          if missing:
              raise SystemExit('Compiled binary is missing: ' + ', '.join(missing))
          print('Compiled ScreenScraper values verified.')
          PY

      - name: Create IPA checksums
        run: |
          set -euo pipefail
          shasum -a 256 NeoStation-Fork.ipa | tee NeoStation-Fork.ipa.sha256
          stat -f 'IPA size: %z bytes' NeoStation-Fork.ipa | tee NeoStation-Fork.ipa.size.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-Fork-ios-test
          path: |
            NeoStation-Fork.ipa
            NeoStation-Fork.ipa.sha256
            NeoStation-Fork.ipa.size.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-Fork-ios-build-log
          path: build/ios/xcodebuild-test.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove ScreenScraper environment file
        if: always()
        run: rm -f .env
