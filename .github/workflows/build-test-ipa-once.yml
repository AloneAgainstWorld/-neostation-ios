name: Build one-time NeoStation test IPA

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create ScreenScraper environment
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          : > .env
          [ -n "$SCREENSCRAPER_DEV_ID" ] && echo "SCREENSCRAPER_DEV_ID=$SCREENSCRAPER_DEV_ID" >> .env
          [ -n "$SCREENSCRAPER_DEV_PASSWORD" ] && echo "SCREENSCRAPER_DEV_PASSWORD=$SCREENSCRAPER_DEV_PASSWORD" >> .env
          if [ "$(wc -l < .env | tr -d ' ')" -ne 2 ]; then
            echo "::error::ScreenScraper Production secrets are missing."
            exit 1
          fi
          chmod 600 .env

      - name: Verify ScreenScraper developer credentials
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          query = urllib.parse.urlencode({
              "devid": os.environ["SCREENSCRAPER_DEV_ID"],
              "devpassword": os.environ["SCREENSCRAPER_DEV_PASSWORD"],
              "softname": "neostation-ios-ci",
              "output": "json",
          })
          request = urllib.request.Request(
              "https://api.screenscraper.fr/api2/ssinfraInfos.php?" + query,
              headers={"User-Agent": "NeoStation/1.0", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=40) as response:
                  status = response.status
                  body = response.read()
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read()
          print(f"ScreenScraper preflight HTTP status: {status}")
          if status != 200:
              sys.exit(1)
          payload = json.loads(body.decode("utf-8"))
          if str(payload.get("header", {}).get("success")).lower() not in {"true", "1"}:
              sys.exit(1)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          xcodebuild -version

      - name: Scaffold iOS platform if missing
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          fi

      - name: Set iOS deployment target to 18.0
        run: |
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Patch Info.plist
        run: |
          set -euo pipefail
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Patch device_info_plus for runner SDK compatibility
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" 2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate iOS fork app icons
        run: |
          set -euo pipefail
          SRC_JPG="$RUNNER_TEMP/neostation-fork-logo.jpg"
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          export SRC_JPG
          python3 - <<'PY'
          import base64, os, pathlib
          text = pathlib.Path('assets/images/fork-icon-small.b64').read_text(encoding='ascii').strip()
          raw = base64.b64decode(text, validate=True)
          if len(text) != 7448 or len(raw) != 5586:
              raise SystemExit(f'Fork icon source corrupted: base64={len(text)} bytes={len(raw)}')
          pathlib.Path(os.environ['SRC_JPG']).write_bytes(raw)
          print(f'Fork icon source verified: {len(raw)} bytes')
          PY
          file "$SRC_JPG"
          sips -g pixelWidth -g pixelHeight "$SRC_JPG"
          make_icon() {
            local size="$1"
            local name="$2"
            sips -s format png -z "$size" "$size" "$SRC_JPG" --out "$ICON_DIR/$name" >/dev/null
          }
          make_icon 20 "Icon-App-20x20@1x.png"
          make_icon 40 "Icon-App-20x20@2x.png"
          make_icon 60 "Icon-App-20x20@3x.png"
          make_icon 29 "Icon-App-29x29@1x.png"
          make_icon 58 "Icon-App-29x29@2x.png"
          make_icon 87 "Icon-App-29x29@3x.png"
          make_icon 40 "Icon-App-40x40@1x.png"
          make_icon 80 "Icon-App-40x40@2x.png"
          make_icon 120 "Icon-App-40x40@3x.png"
          make_icon 120 "Icon-App-60x60@2x.png"
          make_icon 180 "Icon-App-60x60@3x.png"
          make_icon 76 "Icon-App-76x76@1x.png"
          make_icon 152 "Icon-App-76x76@2x.png"
          make_icon 167 "Icon-App-83.5x83.5@2x.png"
          make_icon 1024 "Icon-App-1024x1024@1x.png"
          file "$ICON_DIR/Icon-App-1024x1024@1x.png"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Configure Flutter like validated build 153
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only --dart-define-from-file=.env

      - name: Verify generated DART_DEFINES
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, sys
          config = pathlib.Path('ios/Flutter/Generated.xcconfig')
          encoded = None
          for line in config.read_text(encoding='utf-8').splitlines():
              if line.startswith('DART_DEFINES='):
                  encoded = line.split('=', 1)[1]
                  break
          if not encoded:
              sys.exit(1)
          decoded = {base64.b64decode(item).decode('utf-8') for item in encoded.split(',') if item}
          expected = {
              'SCREENSCRAPER_DEV_ID=' + os.environ['SCREENSCRAPER_DEV_ID'],
              'SCREENSCRAPER_DEV_PASSWORD=' + os.environ['SCREENSCRAPER_DEV_PASSWORD'],
          }
          if not expected.issubset(decoded):
              sys.exit(1)
          print('ScreenScraper defines verified.')
          PY

      - name: Build unsigned app with validated xcodebuild path
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned NeoStation-test.ipa
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-test.log
          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Unsigned app was not produced."
            exit 1
          fi
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -qry ../../../NeoStation-test.ipa Payload)

      - name: Verify ScreenScraper values in compiled binary
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/neostation-test-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q NeoStation-test.ipa -d "$VERIFY_DIR"
          AOT_BINARY=$(find "$VERIFY_DIR/Payload" -path '*/Frameworks/App.framework/App' -type f -print -quit)
          [ -n "$AOT_BINARY" ]
          python3 - "$AOT_BINARY" <<'PY'
          import os, pathlib, sys
          binary = pathlib.Path(sys.argv[1]).read_bytes()
          expected = {
              'SCREENSCRAPER_DEV_ID': os.environ['SCREENSCRAPER_DEV_ID'].encode(),
              'SCREENSCRAPER_DEV_PASSWORD': os.environ['SCREENSCRAPER_DEV_PASSWORD'].encode(),
          }
          missing = [name for name, value in expected.items() if value not in binary]
          if missing:
              print('::error::Compiled binary is missing: ' + ', '.join(missing))
              sys.exit(1)
          print('Compiled ScreenScraper values verified.')
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-ios-test
          path: NeoStation-test.ipa
          retention-days: 7

      - name: Remove ScreenScraper environment file
        if: always()
        run: rm -f .env
