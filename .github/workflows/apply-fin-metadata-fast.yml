name: Fast apply Fin integration

# Trigger pass after the workflow already exists on the feature branch.
on:
  push:
    branches:
      - feature/library-native
    paths:
      - .github/workflows/apply-fin-metadata-fast.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fast-apply-fin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
          fetch-depth: 0
      - name: Apply source integration
        run: |
          python3 tools/apply_fin_metadata_integration.py
          python3 tools/fix_fin_system_id.py
      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/services/game/game_launch_service.dart \
            lib/services/fin_library_service.dart \
            lib/services/library_catalog_service.dart \
            lib/services/library_metadata_provider_service.dart \
            lib/screens/library_screen/library_screen.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: wire Fin and metadata providers into NeoStation"
          git push origin HEAD:feature/library-native
