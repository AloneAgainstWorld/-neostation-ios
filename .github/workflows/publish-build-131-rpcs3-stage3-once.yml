name: Publish NeoStation build 131 RPCS3 test IPA

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    name: Publish successful build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7

      - name: Wait for successful Build 131 artifact
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo TarbleFR/neostation-ios \
              --branch build/ios-131-rpcs3-stage3-final \
              --workflow "Build NeoStation iOS build 131 RPCS3 stage 3" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              echo "Found successful build run: $RUN_ID"
              echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "No successful build yet (attempt $attempt/60); waiting..."
            sleep 30
          done
          echo "No successful Build 131 run was found." >&2
          exit 1

      - name: Download IPA artifact
        run: |
          set -euo pipefail
          mkdir -p release-files
          cd release-files
          gh run download "$RUN_ID" \
            --repo TarbleFR/neostation-ios \
            --name NeoStation-Fork-0.9.9-build131-RPCS3-stage3-ios
          test -s NeoStation-Fork-0.9.9-build131-RPCS3-stage3.ipa
          test -s NeoStation-Fork-0.9.9-build131-RPCS3-stage3.ipa.sha256

      - name: Publish temporary prerelease
        run: |
          set -euo pipefail
          TAG="neostation-0.9.9-build131-rpcs3-stage3-test"
          gh release delete "$TAG" --repo TarbleFR/neostation-ios --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            release-files/NeoStation-Fork-0.9.9-build131-RPCS3-stage3.ipa \
            release-files/NeoStation-Fork-0.9.9-build131-RPCS3-stage3.ipa.sha256 \
            --repo TarbleFR/neostation-ios \
            --title "NeoStation 0.9.9 Build 131 — RPCS3 stage 3 test" \
            --notes "Experimental on-device build for RPCS3 library persistence, ScreenScraper Title-ID lookup, scraped display names and the build-fingerprinted StikDebug specific-title launch bridge. The RPCS3 launch path is experimental and currently targets RPCS3 iOS 0.1 (1)." \
            --prerelease
