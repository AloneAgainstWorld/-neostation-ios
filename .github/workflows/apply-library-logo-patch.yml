name: Apply Library Monochrome Logo Patch

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_library_monochrome_logo.py
      - .github/workflows/apply-library-logo-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply patch
        run: |
          python3 tooling/patch_library_monochrome_logo.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/screens/library_screen/library_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat(library): use monochrome book logo"
          git push origin HEAD:feature/library-native
