name: Validate NeoStation Stage 7 once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-stage7-audio-rpcs3-video
  cancel-in-progress: true

jobs:
  validate:
    name: Apply, analyze and test Stage 7
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout Stage 7 branch
        uses: actions/checkout@v7
        with:
          ref: fix/stage7-audio-rpcs3-video-20260818

      - name: Apply Stage 7 source patch
        run: python3 tools/apply_stage7.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/main.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/my_games_list/secondary_display.dart \
            lib/services/audio_policy_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/services/game/game_list_service.dart \
            lib/services/home_music_service.dart \
            lib/services/music_player_service.dart \
            lib/services/rpcs3_launch_service.dart \
            lib/services/rpcs3_library_service.dart \
            lib/services/sfx_service.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            test/audio_policy_service_test.dart \
            test/rpcs3_stage3_test.dart \
            test/rpcs3_stage6_test.dart \
            test/rpcs3_stage7_test.dart \
            test/video_preview_lifecycle_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify source invariants
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+137" pubspec.yaml
          grep -Fq "class AudioPolicyService" lib/services/audio_policy_service.dart
          grep -Fq "AudioPolicyService().playSoLoud" lib/services/sfx_service.dart
          grep -Fq "AudioPolicyService().playSoLoud" lib/services/home_music_service.dart
          grep -Fq "AudioPolicyService().playSoLoud" lib/services/music_player_service.dart
          grep -Fq "AVAudioSession.routeChangeNotification" packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift
          grep -Fq "case \"openJitRequest\"" packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift
          grep -Fq "GameModel.fromDatabaseModel(dbGame)" lib/services/game/game_list_service.dart
          grep -Fq "Do not create entries from games.yml" lib/services/rpcs3_library_service.dart
          grep -Fq "NEOSTATION_RPC_BOOT_RESULT" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "NEOSTATION_RPC_LAST_ERROR" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "_videoGeneration" lib/screens/game_screen/my_games_list.dart
          grep -Fq "_waitForPreparedVideoFrame" lib/screens/game_screen/my_games_list/secondary_display.dart

      - name: Check RPCS3 JavaScript syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('assets/data/rpcs3_stikdebug_launch.js').read_text(encoding='utf-8')
          values = {
              '__NEOSTATION_TITLE_ID_JSON__': json.dumps('BLES00412'),
              '__NEOSTATION_DISPLAY_TITLE_JSON__': json.dumps('The Lord of the Rings: Conquest'),
              '__NEOSTATION_SOURCE_PATH_JSON__': json.dumps('/Data/games/DiscImages/BLES00412'),
              '__NEOSTATION_SOURCE_KIND_JSON__': json.dumps('disc-image'),
              '__NEOSTATION_SESSION_ID_JSON__': json.dumps('ci-session'),
              '__NEOSTATION_SUPPORTED_CORES_JSON__': json.dumps({
                  'CFE15492152B331E83959A3CF9AC8A9F': {'boot': 0x2FA18, 'state': 0x30254, 'progress': 0x302C4, 'lastError': 0x316B4},
                  '5C4D64FFB79930AD879C13009838F136': {'boot': 0x36224, 'state': 0x36A8C, 'progress': 0x36AFC, 'lastError': 0x37F34},
              }),
          }
          for marker, value in values.items():
              source = source.replace(marker, value)
          if '__NEOSTATION_' in source:
              raise SystemExit('Unresolved RPCS3 script placeholder')
          Path('/tmp/neostation-rpcs3-stage7.js').write_text(source, encoding='utf-8')
          PY
          node --check /tmp/neostation-rpcs3-stage7.js

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run dedicated Stage 7 tests
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_library_service_test.dart \
            test/rpcs3_stage3_test.dart \
            test/rpcs3_stage6_test.dart \
            test/rpcs3_stage7_test.dart \
            test/theme_provider_background_persistence_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Commit validated source and remove temporary automation
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/workflows/validate-build-stage7-once.yml
          rm -f .github/workflows/validate-stage7-pr-once.yml
          rm -f tools/apply_stage7.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): centralize audio and harden RPCS3 video flows"
          git push origin HEAD:fix/stage7-audio-rpcs3-video-20260818
