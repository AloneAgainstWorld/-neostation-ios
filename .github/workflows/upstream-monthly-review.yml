name: Monthly NeoStation upstream surveillance

on:
  schedule:
    # First day of every month at 07:23 UTC.
    - cron: '23 7 1 * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days to review for a manual run'
        required: false
        default: '31'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upstream-monthly-review.yml'
      - '.github/scripts/upstream_monthly_review.py'

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-upstream-monthly-review
  cancel-in-progress: false

jobs:
  review:
    name: Review official NeoStation changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout iOS port
        uses: actions/checkout@v7

      - name: Validate review script
        run: python3 -m py_compile .github/scripts/upstream_monthly_review.py

      - name: Generate upstream review report
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          UPSTREAM_REPO: misobadev/neostation-frontend
          EVENT_NAME: ${{ github.event_name }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '31' }}
          MAX_COMMITS: '120'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/upstream_monthly_review.py
