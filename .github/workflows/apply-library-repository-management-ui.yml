name: Apply Library Repository Management UI

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_library_repository_management_ui.py
      - .github/workflows/apply-library-repository-management-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply patch
        run: python3 tooling/patch_library_repository_management_ui.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/screens/library_screen/library_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat(library): make repository and source removal explicit"
          git push origin HEAD:feature/library-native
