name: Temporary ScreenScraper menu scroll IPA

on:
  push:
    branches:
      - fix/screenscraper-menu-scroll

permissions:
  contents: write
  statuses: write

concurrency:
  group: screenscraper-menu-scroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.head_commit.message == 'Build ScreenScraper menu scroll IPA'
    runs-on: macos-14
    timeout-minutes: 120
    env:
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/screenscraper-menu-scroll
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'pending',
              'context': 'neostation/screenscraper-menu-scroll',
              'description': f"run_id={os.environ['RUN_ID']}",
              'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply ScreenScraper side-menu scroll fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/scraper_screen/new_scraper_options_screen.dart')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import 'package:neostation/repositories/scraper_repository.dart';\n",
                  "import 'package:neostation/repositories/scraper_repository.dart';\nimport 'package:neostation/utils/adaptive_scroll.dart';\n",
              ),
              (
                  "  final List<ScraperMenuItem> _menuItems = [];\n\n  // GlobalKeys for content widgets\n",
                  "  final List<ScraperMenuItem> _menuItems = [];\n\n  /// Key attached to the selected ScreenScraper category so gamepad\n  /// navigation can keep it visible on shorter displays.\n  final GlobalKey _selectedMenuItemKey = GlobalKey();\n\n  /// Uses the same adaptive scrolling behavior as the main Settings menu.\n  final AdaptiveScroller _menuScroller = AdaptiveScroller();\n\n  void _scrollMenuToSelected() {\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      final selectedContext = _selectedMenuItemKey.currentContext;\n      if (selectedContext == null) return;\n      _menuScroller.ensureVisible(selectedContext);\n    });\n  }\n\n  // GlobalKeys for content widgets\n",
              ),
              (
                  "    setState(() {\n      _selectedMenuIndex = index;\n      _focusOnMenu = true;\n      _selectedContentIndex = 0;\n    });\n  }\n\n  // Navigation methods for gamepad\n",
                  "    setState(() {\n      _selectedMenuIndex = index;\n      _focusOnMenu = true;\n      _selectedContentIndex = 0;\n    });\n    _scrollMenuToSelected();\n  }\n\n  // Navigation methods for gamepad\n",
              ),
              (
                  "      setState(() {\n        _selectedMenuIndex =\n            (_selectedMenuIndex - 1 + _menuItems.length) % _menuItems.length;\n      });\n    } else {\n",
                  "      setState(() {\n        _selectedMenuIndex =\n            (_selectedMenuIndex - 1 + _menuItems.length) % _menuItems.length;\n      });\n      _scrollMenuToSelected();\n    } else {\n",
              ),
              (
                  "      setState(() {\n        _selectedMenuIndex = (_selectedMenuIndex + 1) % _menuItems.length;\n      });\n    } else {\n",
                  "      setState(() {\n        _selectedMenuIndex = (_selectedMenuIndex + 1) % _menuItems.length;\n      });\n      _scrollMenuToSelected();\n    } else {\n",
              ),
              (
                  "      child: ListView.builder(\n        itemCount: _menuItems.length,\n",
                  "      child: ListView.builder(\n        // Only seven categories exist; caching the whole side menu guarantees\n        // the newly selected item has a context before ensureVisible runs.\n        cacheExtent: 1000.r,\n        itemCount: _menuItems.length,\n",
              ),
              (
                  "          return Material(\n            color: Colors.transparent,\n",
                  "          return Material(\n            key: isSelected ? _selectedMenuItemKey : null,\n            color: Colors.transparent,\n",
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected ScreenScraper source fragment not found:\n{old}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY
          dart format lib/screens/scraper_screen/new_scraper_options_screen.dart

      - name: Verify ScreenScraper menu scroll contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('lib/screens/scraper_screen/new_scraper_options_screen.dart').read_text(encoding='utf-8')
          required = [
              "import 'package:neostation/utils/adaptive_scroll.dart';",
              'final GlobalKey _selectedMenuItemKey = GlobalKey();',
              'final AdaptiveScroller _menuScroller = AdaptiveScroller();',
              '_scrollMenuToSelected();',
              'cacheExtent: 1000.r',
              'key: isSelected ? _selectedMenuItemKey : null',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('ScreenScraper menu scroll fix incomplete: ' + ', '.join(missing))
          if source.count('_scrollMenuToSelected();') < 3:
              raise SystemExit('Expected menu scroll trigger for tap, up and down navigation')
          print('ScreenScraper side-menu scrolling contract verified.')
          PY

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run focused navigation tests
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for candidate in \
            test/ios_gamepad_navigation_test.dart \
            test/gamepad_navigation_test.dart \
            test/video_preview_lifecycle_test.dart; do
            if [ -f "$candidate" ]; then tests+=("$candidate"); fi
          done
          if [ ${#tests[@]} -gt 0 ]; then
            flutter test "${tests[@]}"
          else
            flutter analyze lib/screens/scraper_screen/new_scraper_options_screen.dart
          fi

      - name: Commit validated source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeoStation Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/screens/scraper_screen/new_scraper_options_screen.dart
          git commit -m 'Fix ScreenScraper side menu scrolling'
          git push origin HEAD:fix/screenscraper-menu-scroll

      - name: Validate ScreenScraper environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCREENSCRAPER_DEV_ID"
          test -n "$SCREENSCRAPER_DEV_PASSWORD"
          printf 'SCREENSCRAPER_DEV_ID=%s\nSCREENSCRAPER_DEV_PASSWORD=%s\n' \
            "$SCREENSCRAPER_DEV_ID" "$SCREENSCRAPER_DEV_PASSWORD" > .env
          chmod 600 .env

      - name: Patch flutter_localization for Xcode 16.2
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_LOCALIZATION_FILE=$(find "$HOME/.pub-cache" \
            -path '*flutter_localization-0.4.1/ios/flutter_localization/Sources/flutter_localization/FlutterLocalizationPlugin.swift' \
            -print -quit)
          test -n "$FLUTTER_LOCALIZATION_FILE"
          python3 - "$FLUTTER_LOCALIZATION_FILE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text(encoding='utf-8')
          old = '      binaryMessenger: registrar.messenger(),\n    )'
          new = '      binaryMessenger: registrar.messenger()\n    )'
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Unexpected flutter_localization Swift source')
          PY

      - name: Keep iOS video audio-session policy intact
        shell: bash
        run: |
          python3 build-utils/patch_ios_video_player_audio_session.py
          python3 build-utils/patch_ios_video_player_audio_session.py --check

      - name: Scaffold iOS platform if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi

      - name: Configure iOS project
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj

          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"

      - name: Patch device_info_plus for runner SDK compatibility
        shell: bash
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path '*device_info_plus*/FPPDeviceInfoPlusPlugin.m' -print -quit)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate and force fork icon
        shell: bash
        run: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Configure Flutter build with ScreenScraper defines
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-unsigned.log

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -r ../../../NeoStation-screenscraper-menu-scroll.ipa Payload)

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-screenscraper-menu-scroll
          path: |
            NeoStation-screenscraper-menu-scroll.ipa
            build/ios/xcodebuild-unsigned.log
          if-no-files-found: warn

      - name: Cleanup secret file
        if: always()
        run: rm -f .env
