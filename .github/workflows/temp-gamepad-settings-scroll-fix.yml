name: Temporary gamepad settings scroll fix

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

env:
  SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
  SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

jobs:
  fix-test-build:
    if: github.event.head_commit.message == 'Apply gamepad settings scroll fixes'
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'pending',
              'context': 'neostation/gamepad-settings-scroll',
              'description': f"run_id={os.environ['RUN_ID']}",
              'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply targeted gamepad scrolling fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # System settings > System info: give the read-only tab its own
          # controller and let D-pad up/down scroll it by a comfortable page.
          host = 'lib/widgets/system_emulator_settings_dialog.dart'
          replace_once(
              host,
              '  late ScrollController _generalScrollController;\n',
              '  late ScrollController _generalScrollController;\n  late ScrollController _systemInfoScrollController;\n',
          )
          replace_once(
              host,
              '    _generalScrollController = ScrollController();\n',
              '    _generalScrollController = ScrollController();\n    _systemInfoScrollController = ScrollController();\n',
          )
          replace_once(
              host,
              '    _generalScrollController.dispose();\n',
              '    _generalScrollController.dispose();\n    _systemInfoScrollController.dispose();\n',
          )

          info = 'lib/widgets/system_emulator_settings_dialog/system_info.dart'
          replace_once(
              info,
              '    return SingleChildScrollView(\n      padding: EdgeInsets.fromLTRB(12.r, 10.r, 12.r, 12.r),\n',
              '    return SingleChildScrollView(\n      controller: _systemInfoScrollController,\n      padding: EdgeInsets.fromLTRB(12.r, 10.r, 12.r, 12.r),\n',
          )

          nav = 'lib/widgets/system_emulator_settings_dialog/gamepad_nav.dart'
          replace_once(
              nav,
              '  void _navigateUp() {\n',
              '''  void _scrollSystemInfo({required bool down}) {\n    if (!_systemInfoScrollController.hasClients) return;\n    final position = _systemInfoScrollController.position;\n    final delta = position.viewportDimension * 0.72;\n    final target = (\n      position.pixels + (down ? delta : -delta)\n    ).clamp(position.minScrollExtent, position.maxScrollExtent).toDouble();\n    if ((target - position.pixels).abs() < 0.5) return;\n    _systemInfoScrollController.animateTo(\n      target,\n      duration: const Duration(milliseconds: 220),\n      curve: Curves.easeOutCubic,\n    );\n  }\n\n  void _navigateUp() {\n''',
          )
          replace_once(
              nav,
              '''    } else if (_currentTab == 2) {\n      rebuild(() {\n        _appearanceIndex = (_appearanceIndex - 1 + 2) % 2;\n      });\n      _scrollToAppearanceSelected();\n    }\n  }\n\n  void _navigateDown() {\n''',
              '''    } else if (_currentTab == 2) {\n      rebuild(() {\n        _appearanceIndex = (_appearanceIndex - 1 + 2) % 2;\n      });\n      _scrollToAppearanceSelected();\n    } else if (_currentTab == 3) {\n      _scrollSystemInfo(down: false);\n    }\n  }\n\n  void _navigateDown() {\n''',
          )
          replace_once(
              nav,
              '''    } else if (_currentTab == 2) {\n      rebuild(() {\n        _appearanceIndex = (_appearanceIndex + 1) % 2;\n      });\n      _scrollToAppearanceSelected();\n    }\n  }\n\n  void _navigateLeft() {\n''',
              '''    } else if (_currentTab == 2) {\n      rebuild(() {\n        _appearanceIndex = (_appearanceIndex + 1) % 2;\n      });\n      _scrollToAppearanceSelected();\n    } else if (_currentTab == 3) {\n      _scrollSystemInfo(down: true);\n    }\n  }\n\n  void _navigateLeft() {\n''',
          )

          # Scraper > Media: keep the highlighted item visible as the D-pad
          # moves below Box 2D toward Video/Manual.
          media = 'lib/screens/scraper_screen/scraper_contents/media_content.dart'
          replace_once(
              media,
              "import 'package:neostation/widgets/custom_toggle_switch.dart';\n",
              "import 'package:neostation/widgets/custom_toggle_switch.dart';\nimport 'package:neostation/utils/adaptive_scroll.dart';\n",
          )
          replace_once(
              media,
              "class MediaContentState extends State<MediaContent> {\n  static const _orderedKeys = ['fanart', 'ss', 'wheel', 'box2D', 'video', 'manuel'];\n",
              "class MediaContentState extends State<MediaContent> {\n  static const _orderedKeys = ['fanart', 'ss', 'wheel', 'box2D', 'video', 'manuel'];\n  final AdaptiveScroller _scroller = AdaptiveScroller();\n  final List<GlobalKey> _itemKeys = List.generate(\n    _orderedKeys.length,\n    (_) => GlobalKey(),\n  );\n\n  @override\n  void didUpdateWidget(covariant MediaContent oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    if (widget.isContentFocused &&\n        (!oldWidget.isContentFocused ||\n            oldWidget.selectedContentIndex != widget.selectedContentIndex)) {\n      ensureVisible(widget.selectedContentIndex);\n    }\n  }\n\n  void ensureVisible(int index) {\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      if (!mounted || index < 0 || index >= _itemKeys.length) return;\n      final itemContext = _itemKeys[index].currentContext;\n      if (itemContext != null) {\n        _scroller.ensureVisible(itemContext);\n      }\n    });\n  }\n",
          )
          replace_once(
              media,
              '            return Container(\n              padding: EdgeInsets.only(\n',
              '            return Container(\n              key: _itemKeys[index],\n              padding: EdgeInsets.only(\n',
          )

          scraper = 'lib/screens/scraper_screen/new_scraper_options_screen.dart'
          text = Path(scraper).read_text(encoding='utf-8')
          old = '''        // Asegurar scroll para Language\n        if (selectedKey == AppLocale.language) {\n          _languageKey.currentState?.ensureVisible(_selectedContentIndex);\n        }\n'''
          new = '''        // Keep the gamepad cursor visible in scrollable content panels.\n        if (selectedKey == AppLocale.language) {\n          _languageKey.currentState?.ensureVisible(_selectedContentIndex);\n        } else if (selectedKey == AppLocale.media) {\n          _mediaKey.currentState?.ensureVisible(_selectedContentIndex);\n        }\n'''
          if text.count(old) != 2:
              raise SystemExit(f'{scraper}: expected two language scroll blocks, found {text.count(old)}')
          Path(scraper).write_text(text.replace(old, new), encoding='utf-8')

          # App settings > Directories: ListView.builder does not build distant
          # ROM-folder rows, so GlobalKey.ensureVisible alone can have no target.
          # Add a directional viewport fallback, then refine once the row exists.
          directories = 'lib/screens/settings_screen/new_settings_options/directories_settings_content.dart'
          replace_once(
              directories,
              '  final List<GlobalKey> _itemKeys = [];\n',
              '  final List<GlobalKey> _itemKeys = [];\n  int _lastScrollIndex = 0;\n',
          )
          old_scroll = '''  void scrollToIndex(int index) {\n    // Use the focused row's own key so scrolling tracks its real height —\n    // section headers and path-chip cards aren't a uniform height, so a\n    // fixed per-row estimate drifts and overshoots as the list scrolls.\n    if (index >= 0 && index < _itemKeys.length) {\n      final ctx = _itemKeys[index].currentContext;\n      if (ctx != null) {\n        _scroller.ensureVisible(ctx);\n      }\n    }\n  }\n'''
          new_scroll = '''  void scrollToIndex(int index) {\n    if (index < 0 || index >= _directoryItems.length) return;\n    _ensureKeys(_directoryItems.length);\n\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      if (!mounted) return;\n      final itemContext = _itemKeys[index].currentContext;\n      if (itemContext != null) {\n        _lastScrollIndex = index;\n        _scroller.ensureVisible(itemContext);\n        return;\n      }\n\n      // ListView.builder lazily omits off-screen ROM-folder rows. Move one\n      // viewport in the requested direction so the target gets built, then\n      // finish with ensureVisible using its real rendered height.\n      if (!_scrollController.hasClients) return;\n      final position = _scrollController.position;\n      final direction = index >= _lastScrollIndex ? 1.0 : -1.0;\n      _lastScrollIndex = index;\n      final target = (\n        position.pixels + direction * position.viewportDimension * 0.72\n      ).clamp(position.minScrollExtent, position.maxScrollExtent).toDouble();\n\n      _scrollController\n          .animateTo(\n            target,\n            duration: const Duration(milliseconds: 200),\n            curve: Curves.easeOutCubic,\n          )\n          .then((_) {\n            if (!mounted || index >= _itemKeys.length) return;\n            final builtContext = _itemKeys[index].currentContext;\n            if (builtContext != null) {\n              _scroller.ensureVisible(builtContext);\n            }\n          });\n    });\n  }\n'''
          replace_once(directories, old_scroll, new_scroll)

          test = Path('test/gamepad_settings_scrolling_test.dart')
          test.write_text(r'''import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('system info tab is scrollable with D-pad navigation', () {
    final host = File(
      'lib/widgets/system_emulator_settings_dialog.dart',
    ).readAsStringSync();
    final nav = File(
      'lib/widgets/system_emulator_settings_dialog/gamepad_nav.dart',
    ).readAsStringSync();
    final info = File(
      'lib/widgets/system_emulator_settings_dialog/system_info.dart',
    ).readAsStringSync();

    expect(host, contains('_systemInfoScrollController = ScrollController()'));
    expect(host, contains('_systemInfoScrollController.dispose()'));
    expect(info, contains('controller: _systemInfoScrollController'));
    expect(nav, contains('void _scrollSystemInfo({required bool down})'));
    expect(nav, contains('_currentTab == 3'));
    expect(nav, contains('_scrollSystemInfo(down: false)'));
    expect(nav, contains('_scrollSystemInfo(down: true)'));
  });

  test('scraper media keeps the selected option visible', () {
    final media = File(
      'lib/screens/scraper_screen/scraper_contents/media_content.dart',
    ).readAsStringSync();
    final screen = File(
      'lib/screens/scraper_screen/new_scraper_options_screen.dart',
    ).readAsStringSync();

    expect(media, contains('final List<GlobalKey> _itemKeys'));
    expect(media, contains('void ensureVisible(int index)'));
    expect(media, contains('key: _itemKeys[index]'));
    expect(screen, contains('_mediaKey.currentState?.ensureVisible'));
  });

  test('directory gamepad scrolling handles lazily built ROM rows', () {
    final directories = File(
      'lib/screens/settings_screen/new_settings_options/directories_settings_content.dart',
    ).readAsStringSync();

    expect(directories, contains('position.viewportDimension * 0.72'));
    expect(directories, contains('_lastScrollIndex'));
    expect(directories, contains('_scroller.ensureVisible(builtContext)'));
  });
}
''', encoding='utf-8')
          PY

          dart format \
            lib/widgets/system_emulator_settings_dialog.dart \
            lib/widgets/system_emulator_settings_dialog/system_info.dart \
            lib/widgets/system_emulator_settings_dialog/gamepad_nav.dart \
            lib/screens/scraper_screen/scraper_contents/media_content.dart \
            lib/screens/scraper_screen/new_scraper_options_screen.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/gamepad_settings_scrolling_test.dart

          git diff --check

      - name: Resolve dependencies
        run: flutter pub get

      - name: Keep AVFoundation audio session owned by NeoStation
        run: |
          python3 build-utils/patch_ios_video_player_audio_session.py
          python3 build-utils/patch_ios_video_player_audio_session.py --check

      - name: Run focused regression tests
        run: |
          flutter test \
            test/gamepad_settings_scrolling_test.dart \
            test/ios_gamepad_navigation_test.dart \
            test/audio_policy_service_test.dart \
            test/home_music_silent_mode_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_stage7_test.dart \
            test/rpcs3_library_service_test.dart

      - name: Prepare ScreenScraper build defines
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCREENSCRAPER_DEV_ID"
          test -n "$SCREENSCRAPER_DEV_PASSWORD"
          printf 'SCREENSCRAPER_DEV_ID=%s\nSCREENSCRAPER_DEV_PASSWORD=%s\n' \
            "$SCREENSCRAPER_DEV_ID" "$SCREENSCRAPER_DEV_PASSWORD" > .env
          chmod 600 .env

      - name: Scaffold iOS platform
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi

      - name: Configure generated iOS project
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' \
            ios/Runner.xcodeproj/project.pbxproj

          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"

      - name: Patch device_info_plus for runner SDK compatibility
        shell: bash
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" \
            -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" \
            2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate and force fork icon
        shell: bash
        run: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Verify AVFoundation patch after CocoaPods
        run: python3 build-utils/patch_ios_video_player_audio_session.py --check

      - name: Configure Flutter build
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-gamepad-scroll.log

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -r ../../../NeoStation-gamepad-settings-scroll-unsigned.ipa Payload)
          shasum -a 256 NeoStation-gamepad-settings-scroll-unsigned.ipa > NeoStation-gamepad-settings-scroll-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-gamepad-settings-scroll-test
          path: |
            NeoStation-gamepad-settings-scroll-unsigned.ipa
            NeoStation-gamepad-settings-scroll-unsigned.ipa.sha256
            build/ios/xcodebuild-gamepad-scroll.log
          if-no-files-found: error

      - name: Commit validated fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env .github/workflows/temp-gamepad-settings-scroll-fix.yml
          git config user.name 'Tarble FR'
          git config user.email 'f9wynyv9qy@privaterelay.appleid.com'
          git add \
            lib/widgets/system_emulator_settings_dialog.dart \
            lib/widgets/system_emulator_settings_dialog/system_info.dart \
            lib/widgets/system_emulator_settings_dialog/gamepad_nav.dart \
            lib/screens/scraper_screen/scraper_contents/media_content.dart \
            lib/screens/scraper_screen/new_scraper_options_screen.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/gamepad_settings_scrolling_test.dart \
            .github/workflows/temp-gamepad-settings-scroll-fix.yml
          git diff --cached --check
          git commit -m 'Fix gamepad scrolling in settings'
          git push origin HEAD:main

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          state = 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure'
          payload = json.dumps({
              'state': state,
              'context': 'neostation/gamepad-settings-scroll',
              'description': f"run_id={os.environ['RUN_ID']}",
              'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY
