name: Final Actions history purge

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  purge:
    if: github.event.head_commit.message == 'Final Actions history purge'
    runs-on: ubuntu-latest
    steps:
      - name: Purge every other run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, os, time, urllib.error, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'NeoStation final Actions purge',
          }

          def call(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return response.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as error:
                  if error.code in (404, 409, 422):
                      return error.code, None
                  print('HTTP error', error.code, url)
                  return error.code, None
              except Exception as error:
                  print('request error', type(error).__name__, url)
                  return 0, None

          def list_runs():
              _, payload = call(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page=1')
              return (payload or {}).get('workflow_runs', [])

          def handle(run):
              run_id = int(run['id'])
              base = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
              if run.get('status') == 'completed':
                  return run_id, 'delete', call(base, 'DELETE')[0]
              force = call(base + '/force-cancel', 'POST')[0]
              if force != 202:
                  normal = call(base + '/cancel', 'POST')[0]
                  return run_id, 'cancel', (force, normal)
              return run_id, 'cancel', force

          for cycle in range(90):
              runs = [r for r in list_runs() if int(r['id']) != current]
              if not runs:
                  print('No other workflow runs remain.')
                  break
              with concurrent.futures.ThreadPoolExecutor(max_workers=20) as pool:
                  results = list(pool.map(handle, runs))
              if cycle % 5 == 0:
                  print('cycle', cycle, 'remaining', len(runs), 'sample', results[:5])
              time.sleep(2)
          else:
              print('Safety limit reached; continuing to self-delete current run.')

          # One final page-1 delete sweep for cancellations that settled.
          for _ in range(10):
              runs = [r for r in list_runs() if int(r['id']) != current]
              if not runs:
                  break
              for run in runs:
                  run_id = int(run['id'])
                  base = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
                  if run.get('status') == 'completed':
                      call(base, 'DELETE')
                  else:
                      call(base + '/force-cancel', 'POST')
              time.sleep(2)

          remaining = [(int(r['id']), r.get('status'), r.get('name')) for r in list_runs() if int(r['id']) != current]
          print('Remaining other runs before self-delete:', remaining)
          PY

      - name: Schedule deletion of this final run after completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          cat >/tmp/delete-final-run.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          for _ in $(seq 1 180); do
            sleep 1
            status=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$CURRENT_RUN_ID" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null)
            if [ "$status" = "completed" ]; then
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/actions/runs/$CURRENT_RUN_ID" >/dev/null 2>&1
              exit 0
            fi
          done
          SH
          chmod +x /tmp/delete-final-run.sh
          RUNNER_TRACKING_ID='' setsid nohup /tmp/delete-final-run.sh >/tmp/delete-final-run.log 2>&1 </dev/null &
