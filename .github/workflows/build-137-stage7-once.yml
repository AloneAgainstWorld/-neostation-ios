name: Build NeoStation iOS 137 Stage 7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-build-137-stage7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA 137
    runs-on: macos-latest
    environment: Production
    timeout-minutes: 110

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v7

      - name: Verify Stage 7 source and build number
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+137" pubspec.yaml
          grep -Fq "class AudioPolicyService" lib/services/audio_policy_service.dart
          grep -Fq "_activeHandles" lib/services/sfx_service.dart
          grep -Fq "resolveDatabaseNamesForDisplay" lib/services/game/game_list_service.dart
          grep -Fq "preferFileName && !isRpcs3Virtual" lib/services/game/game_list_service.dart
          grep -Fq "_repairPersistedRpcs3Names" lib/services/rpcs3_library_service.dart
          grep -Fq "openJitRequest" lib/services/rpcs3_launch_service.dart
          grep -Fq "NEOSTATION_RPC_BOOT_RESULT" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "_videoGeneration" lib/screens/game_screen/my_games_list.dart
          grep -Fq "_videoTransition" lib/screens/game_screen/my_games_list.dart
          grep -Fq "_startVideoPreviewForSelection" lib/screens/game_screen/my_games_list/secondary_display.dart
          ! grep -Fq "Duration(milliseconds: 1500)" lib/screens/game_screen/my_games_list.dart
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1

      - name: Validate generated RPCS3 JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('assets/data/rpcs3_stikdebug_launch.js').read_text(encoding='utf-8')
          request = {
              'sessionId': 'build-validation',
              'titleId': 'BLES00412',
              'displayTitle': 'The Lord of the Rings: Conquest™',
              'sourcePath': '/Data/games/discImgs/BLES00412',
              'sourceKind': 'disc-image',
          }
          functions = {
              'CFE15492152B331E83959A3CF9AC8A9F': {'boot': 0x2FA18},
              '5C4D64FFB79930AD879C13009838F136': {
                  'boot': 0x36224,
                  'emulationState': 0x36A8C,
                  'bootProgress': 0x36AFC,
                  'globalState': 0x37A80,
                  'lastError': 0x37F34,
              },
          }
          source = source.replace('__NEOSTATION_REQUEST_JSON__', json.dumps(request))
          source = source.replace('__NEOSTATION_SUPPORTED_CORES_JSON__', json.dumps(functions))
          source = source.replace('__NEOSTATION_SUPPORTED_FUNCTIONS_JSON__', json.dumps(functions))
          source = source.replace('__NEOSTATION_TITLE_ID_JSON__', '"BLES00412"')
          source = source.replace('__NEOSTATION_CORE_UUID_JSON__', '""')
          source = source.replace('__NEOSTATION_BOOT_OFFSET_HEX__', '0')
          if '__NEOSTATION_' in source:
              raise SystemExit('Unresolved RPCS3 placeholder')
          Path('/tmp/neostation-rpcs3-stage7.js').write_text(source, encoding='utf-8')
          PY
          node --check /tmp/neostation-rpcs3-stage7.js

      - name: Create ScreenScraper build environment
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          : > .env
          [ -n "$SCREENSCRAPER_DEV_ID" ] && echo "SCREENSCRAPER_DEV_ID=$SCREENSCRAPER_DEV_ID" >> .env
          [ -n "$SCREENSCRAPER_DEV_PASSWORD" ] && echo "SCREENSCRAPER_DEV_PASSWORD=$SCREENSCRAPER_DEV_PASSWORD" >> .env
          test "$(wc -l < .env | tr -d ' ')" -eq 2
          chmod 600 .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Scaffold iOS platform
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          fi

      - name: Set iOS deployment target to 18.0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          podfile = pathlib.Path('ios/Podfile')
          text = podfile.read_text(encoding='utf-8')
          pattern = r"^\s*#?\s*platform\s+:ios,\s*'[^']+'"
          if re.search(pattern, text, flags=re.MULTILINE):
              text = re.sub(
                  pattern,
                  "platform :ios, '18.0'",
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
          else:
              text = "platform :ios, '18.0'\n" + text
          podfile.write_text(text, encoding='utf-8')

          project = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          project_text = project.read_text(encoding='utf-8')
          project_text, count = re.subn(
              r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 18.0;',
              project_text,
          )
          if count == 0:
              raise SystemExit('Missing iOS deployment target in Xcode project')
          project.write_text(project_text, encoding='utf-8')
          PY

      - name: Configure iOS Info.plist
        run: |
          set -euo pipefail
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSSupportsOpeningDocumentsInPlace" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:4 string atariemulator" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:5 string stikdebug" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:6 string stikjit" "$PLIST"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run focused Stage 7 tests
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/rpcs3_stage7_test.dart \
            test/rpcs3_library_service_test.dart \
            test/rpcs3_stage3_test.dart \
            test/rpcs3_stage6_test.dart \
            test/home_music_silent_mode_test.dart \
            test/theme_provider_background_persistence_test.dart

      - name: Patch device_info_plus runner compatibility
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" 2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate NeoStation fork app icons
        run: |
          set -euo pipefail
          SRC="assets/images/fork-icon-valid.jpg"
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          test -f "$SRC"
          make_icon() { sips -s format png -z "$1" "$1" "$SRC" --out "$ICON_DIR/$2" >/dev/null; }
          make_icon 20 "Icon-App-20x20@1x.png"
          make_icon 40 "Icon-App-20x20@2x.png"
          make_icon 60 "Icon-App-20x20@3x.png"
          make_icon 29 "Icon-App-29x29@1x.png"
          make_icon 58 "Icon-App-29x29@2x.png"
          make_icon 87 "Icon-App-29x29@3x.png"
          make_icon 40 "Icon-App-40x40@1x.png"
          make_icon 80 "Icon-App-40x40@2x.png"
          make_icon 120 "Icon-App-40x40@3x.png"
          make_icon 120 "Icon-App-60x60@2x.png"
          make_icon 180 "Icon-App-60x60@3x.png"
          make_icon 76 "Icon-App-76x76@1x.png"
          make_icon 152 "Icon-App-76x76@2x.png"
          make_icon 167 "Icon-App-83.5x83.5@2x.png"
          make_icon 1024 "Icon-App-1024x1024@1x.png"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Configure Flutter release build
        run: flutter build ios --release --no-codesign --config-only --dart-define-from-file=.env

      - name: Build unsigned app and package IPA 137
        run: |
          set -euo pipefail
          IPA="NeoStation-Fork-0.9.9-build137-Stage7.ipa"
          rm -rf build/ios/DerivedData build/ios/unsigned "$IPA"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")" = "18.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "0.9.9"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "137"
          test -f "$APP_PATH/Frameworks/App.framework/flutter_assets/assets/data/rpcs3_stikdebug_launch.js"

          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (cd build/ios/unsigned && zip -qry ../../../"$IPA" Payload)
          test -s "$IPA"
          unzip -tq "$IPA"

      - name: Verify ScreenScraper values in compiled binary
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          IPA="NeoStation-Fork-0.9.9-build137-Stage7.ipa"
          VERIFY_DIR="$RUNNER_TEMP/neostation-verify-137"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA" -d "$VERIFY_DIR"
          AOT_BINARY=$(find "$VERIFY_DIR/Payload" -path '*/Frameworks/App.framework/App' -type f -print -quit)
          test -n "$AOT_BINARY"
          python3 - "$AOT_BINARY" <<'PY'
          import os
          import pathlib
          import sys

          binary = pathlib.Path(sys.argv[1]).read_bytes()
          for name in ('SCREENSCRAPER_DEV_ID', 'SCREENSCRAPER_DEV_PASSWORD'):
              value = os.environ[name].encode()
              if not value or value not in binary:
                  raise SystemExit(f'Missing {name} in compiled binary')
          PY

      - name: Create checksum
        run: shasum -a 256 NeoStation-Fork-0.9.9-build137-Stage7.ipa > NeoStation-Fork-0.9.9-build137-Stage7.ipa.sha256

      - name: Upload IPA 137
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-Fork-0.9.9-build137-Stage7-ios
          path: |
            NeoStation-Fork-0.9.9-build137-Stage7.ipa
            NeoStation-Fork-0.9.9-build137-Stage7.ipa.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Remove ScreenScraper environment file
        if: always()
        run: rm -f .env
