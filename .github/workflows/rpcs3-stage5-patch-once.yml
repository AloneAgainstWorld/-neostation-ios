name: Validate RPCS3 Stage 5 patch once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rpcs3-stage5-patch
  cancel-in-progress: true

jobs:
  validate:
    name: Patch, analyze and test RPCS3 Stage 5
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/rpcs3-stage5-20260818

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Apply RPCS3 Stage 5 source patch
        run: python3 tools/rpcs3_stage5_patch.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/services/rpcs3_library_service.dart \
            lib/services/rpcs3_title_catalog_service.dart \
            lib/services/rpcs3_launch_service.dart \
            lib/services/screenscraper_service.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            test/rpcs3_library_service_test.dart \
            test/rpcs3_stage3_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify implementation markers
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+133" pubspec.yaml
          grep -Fq "reconciled" lib/services/rpcs3_library_service.dart
          grep -Fq "ignored stale games.yml entry" lib/services/rpcs3_library_service.dart
          grep -Fq "PS3.titles.json" lib/services/rpcs3_title_catalog_service.dart
          grep -Fq "The Lord of the Rings: Conquest" lib/services/rpcs3_title_catalog_service.dart
          grep -Fq "shouldRetryRpcs3ByNameForTesting" lib/services/screenscraper_service.dart
          grep -Fq "openAppWithTwoPassJit" packages/external_folder_access/lib/external_folder_access.dart
          grep -Fq "SECOND_PREFLIGHT_OPENED" packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift
          grep -Fq "NEOSTATION_RPC_DIRECT_BOOT_COMPLETED" assets/data/rpcs3_stikdebug_launch.js
          grep -Fq "GameDB-PS3 title catalog" NOTICE.md

      - name: Check generated RPCS3 JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('assets/data/rpcs3_stikdebug_launch.js').read_text(encoding='utf-8')
          source = source.replace('__NEOSTATION_TITLE_ID_JSON__', '"BLES00412"')
          source = source.replace('__NEOSTATION_CORE_UUID_JSON__', '"CFE15492-152B-331E-8395-9A3CF9AC8A9F"')
          source = source.replace('__NEOSTATION_BOOT_OFFSET_HEX__', '2fa18')
          Path('/tmp/rpcs3_stikdebug_launch.js').write_text(source, encoding='utf-8')
          PY
          node --check /tmp/rpcs3_stikdebug_launch.js

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run dedicated RPCS3 tests
        run: flutter test test/rpcs3_library_service_test.dart test/rpcs3_stage3_test.dart

      - name: Run full Flutter test suite
        run: flutter test

      - name: Commit validated patch and remove temporary automation
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/workflows/rpcs3-stage5-patch-once.yml
          rm -f tools/rpcs3_stage5_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): reconcile RPCS3 titles and launch in two passes"
          git push origin HEAD:fix/rpcs3-stage5-20260818
