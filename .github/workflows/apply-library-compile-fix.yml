name: Apply Library Compile Fix

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/fix_library_compile_residue.py
      - .github/workflows/apply-library-compile-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compile cleanup
        run: python3 tooling/fix_library_compile_residue.py

      - name: Commit generated source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/screens/library_screen/library_screen.dart \
            lib/screens/library_screen/library_reader_screen.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix(library): finish unified reader refactor"
          git push origin HEAD:feature/library-native
