name: Validate RPCS3 disc folder casing once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rpcs3-disc-folder-casing
  cancel-in-progress: true

jobs:
  validate:
    name: Detect RPCS3 disc folders case-insensitively
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: fix/rpcs3-0.2-discimages-silent-mode-20260818

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Patch case-insensitive disc-folder discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          library_path = Path('lib/services/rpcs3_library_service.dart')
          text = library_path.read_text(encoding='utf-8')
          old_loop = """    for (final discDirectoryName in const <String>['DiscImages', 'DiscImgs']) {
              await scan(
                path.join('games', discDirectoryName),
                sourceKind: 'disc-image',
                maxDepth: 5,
                hddRules: false,
              );
              await _addDiscImageFolderFallbacks(
                dataRoot: root.path,
                directoryName: discDirectoryName,
                target: byTitleId,
              );
            }
          """
          new_loop = """    final discDirectoryNames = await _discoverDiscImageDirectoryNames(
              root.path,
            );
            for (final discDirectoryName in discDirectoryNames) {
              await scan(
                path.join('games', discDirectoryName),
                sourceKind: 'disc-image',
                maxDepth: 5,
                hddRules: false,
              );
              await _addDiscImageFolderFallbacks(
                dataRoot: root.path,
                directoryName: discDirectoryName,
                target: byTitleId,
              );
            }
          """
          if new_loop not in text:
              if old_loop not in text:
                  raise SystemExit('RPCS3 disc-folder loop marker missing')
              text = text.replace(old_loop, new_loop, 1)

          helper_marker = """  static Future<void> _addDiscImageFolderFallbacks({
          """
          helper = """  static Future<List<String>> _discoverDiscImageDirectoryNames(
            String dataRoot,
          ) async {
            final gamesRoot = Directory(path.join(dataRoot, 'games'));
            if (!await gamesRoot.exists()) return const <String>[];

            final names = <String>[];
            try {
              await for (final entity in gamesRoot.list(followLinks: false)) {
                if (entity is! Directory) continue;
                final basename = path.basename(entity.path);
                final normalized = basename.toLowerCase();
                if (normalized == 'discimages' || normalized == 'discimgs') {
                  names.add(basename);
                }
              }
            } catch (error) {
              _log.w(
                'Rpcs3LibraryService: could not list disc-image roots: $error',
              );
            }
            names.sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));
            return names.toSet().toList(growable: false);
          }

          """
          if helper not in text:
              if helper_marker not in text:
                  raise SystemExit('RPCS3 disc-folder helper marker missing')
              text = text.replace(helper_marker, helper + helper_marker, 1)
          library_path.write_text(text, encoding='utf-8')

          test_path = Path('test/rpcs3_library_service_test.dart')
          tests = test_path.read_text(encoding='utf-8')
          start = tests.index(
              "    test('uses physical folders and ignores cross-linked games.yml history'"
          )
          end = tests.index(
              "    test('ignores stale games.yml registrations whose target is gone'",
              start,
          )
          section = tests[start:end].replace("'DiscImages'", "'discImgs'")
          tests = tests[:start] + section + tests[end:]
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Format changed files
        run: dart format lib/services/rpcs3_library_service.dart test/rpcs3_library_service_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify casing support
        run: |
          set -euo pipefail
          grep -Fq "_discoverDiscImageDirectoryNames" lib/services/rpcs3_library_service.dart
          grep -Fq "normalized == 'discimgs'" lib/services/rpcs3_library_service.dart
          grep -Fq "'discImgs'" test/rpcs3_library_service_test.dart

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run RPCS3 library tests
        run: flutter test test/rpcs3_library_service_test.dart test/rpcs3_stage3_test.dart test/rpcs3_stage6_test.dart

      - name: Run full Flutter test suite
        run: flutter test

      - name: Commit validated change and remove workflow
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/workflows/validate-rpcs3-disc-folder-casing-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): detect RPCS3 disc-image folders by actual casing"
          git push origin HEAD:fix/rpcs3-0.2-discimages-silent-mode-20260818
