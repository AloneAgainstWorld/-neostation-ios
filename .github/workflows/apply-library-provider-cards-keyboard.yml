name: Apply Library Provider Cards And Keyboard Fix

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_library_provider_cards_keyboard.py
      - .github/workflows/apply-library-provider-cards-keyboard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply patch
        run: python3 tooling/patch_library_provider_cards_keyboard.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/screens/library_screen/library_screen.dart lib/widgets/app_lifecycle_handler.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(library): show imported sources and dismiss stale keyboard"
          git push origin HEAD:feature/library-native
