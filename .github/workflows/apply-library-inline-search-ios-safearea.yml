name: Apply Library Inline Search iOS Safe Area

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/patch_library_inline_search_ios_safearea.py
      - .github/workflows/apply-library-inline-search-ios-safearea.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply patch
        run: python3 tooling/patch_library_inline_search_ios_safearea.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/screens/library_screen/library_screen.dart \
            lib/screens/settings_screen/new_settings_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(ios): inline library search and respect safe area"
          git push origin HEAD:feature/library-native
