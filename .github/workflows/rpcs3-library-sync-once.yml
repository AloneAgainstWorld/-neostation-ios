name: Validate RPCS3 library integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rpcs3-library-integration
  cancel-in-progress: true

jobs:
  validate:
    name: Apply, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/rpcs3-library-sync
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply RPCS3 integration wiring
        run: python3 .github/scripts/apply_rpcs3_library_integration.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/main.dart \
            lib/l10n/rpcs3_library_locale.dart \
            lib/services/rpcs3_library_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/rpcs3_library_service_test.dart

      - name: Verify integration source
        run: |
          set -euo pipefail
          grep -Fq "version: 0.9.9+130" pubspec.yaml
          grep -Fq "Rpcs3LibraryService.initialize" lib/main.dart
          grep -Fq "Widget _buildIOSRpcs3Section" lib/screens/settings_screen/new_settings_options/directories_settings_content.dart
          grep -Fq "rpcs3-library" lib/services/rpcs3_library_service.dart
          grep -Fq "Rpcs3LibraryLocale.launchUnavailable" lib/services/game/game_launch_service.dart
          grep -Fq "RPCS3 iOS" README.md

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run RPCS3 service tests
        run: flutter test test/rpcs3_library_service_test.dart

      - name: Run full Flutter test suite
        run: flutter test

      - name: Commit validated integration and remove temporary automation
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/rpcs3-library-sync-once.yml \
            .github/scripts/apply_rpcs3_library_integration.py \
            .github/PR_NOTE_RPC3.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ios): import RPCS3 library from Data folder"
          git push origin HEAD:feature/rpcs3-library-sync
