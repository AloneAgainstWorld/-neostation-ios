name: Apply Fin and metadata integration

# Bootstrap workflow for the Fin + seven-provider Library integration.
on:
  push:
    branches:
      - feature/library-native
    paths:
      - tools/apply_fin_metadata_integration.py
      - .github/workflows/apply-fin-metadata-integration.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-fin-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/library-native
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply integration patch
        run: python3 tools/apply_fin_metadata_integration.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/main.dart \
            lib/services/game/game_launch_service.dart \
            lib/services/fin_library_service.dart \
            lib/services/ios_shortcut_jit_launch_service.dart \
            lib/services/library_catalog_service.dart \
            lib/services/library_metadata_provider_service.dart \
            lib/screens/library_screen/library_screen.dart \
            lib/screens/library_screen/library_metadata_detail_dialog.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/fin_library_service_test.dart \
            test/library_metadata_provider_service_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run focused tests
        run: |
          flutter test test/fin_library_service_test.dart
          flutter test test/library_metadata_provider_service_test.dart

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/main.dart \
            lib/services/game/game_launch_service.dart \
            lib/services/fin_library_service.dart \
            lib/services/ios_shortcut_jit_launch_service.dart \
            lib/services/library_catalog_service.dart \
            lib/services/library_metadata_provider_service.dart \
            lib/screens/library_screen/library_screen.dart \
            lib/screens/library_screen/library_metadata_detail_dialog.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/fin_library_service_test.dart \
            test/library_metadata_provider_service_test.dart
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "feat: integrate Fin and Library metadata providers"
          git push origin HEAD:feature/library-native
