name: Temporary NeoSync v2 iOS source validation

on:
  push:
    branches:
      - feature/neosync-v2-ios

permissions:
  contents: write
  statuses: write

concurrency:
  group: neosync-v2-ios-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.head_commit.message == 'Run NeoSync v2 iOS source port'
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/neosync-v2-ios
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'pending',
              'context': 'neostation/neosync-v2-ios-source',
              'description': f"run_id={os.environ['RUN_ID']}",
              'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
              },
          )
          urllib.request.urlopen(req, timeout=30).read()
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply source port
        run: python3 build-utils/patch_neosync_v2_ios_preview.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/utils/cloud_path_builder.dart \
            lib/utils/app_config.dart \
            lib/screens/neo_sync_screen/neo_sync_tab.dart \
            lib/services/retroarch_config_service.dart \
            lib/services/neosync/neo_sync_service.dart \
            lib/providers/neo_sync_provider.dart \
            lib/providers/neosync/neosync_path_resolver.dart \
            lib/providers/neosync/neosync_upload.dart \
            lib/providers/neosync/neosync_core.dart \
            lib/providers/neosync/neosync_download.dart \
            lib/repositories/game_repository.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify v2 contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('lib/utils/app_config.dart').read_text()
          service = Path('lib/services/neosync/neo_sync_service.dart').read_text()
          paths = Path('lib/providers/neosync/neosync_path_resolver.dart').read_text()
          tab = Path('lib/screens/neo_sync_screen/neo_sync_tab.dart').read_text()
          retro = Path('lib/services/retroarch_config_service.dart').read_text()
          assert 'sync.neosync.cloud' in app
          assert '/api/v1/' not in service
          assert '/api/v2/' in service
          assert 'CloudPathBuilder.build' in paths
          assert '_neoSyncSelected' not in tab
          assert 'ConfigService.linkedExternalFolderPath' in retro
          print('NeoSync v2 iOS contract verified')
          PY

      - name: Analyze port
        run: |
          flutter analyze \
            lib/utils/cloud_path_builder.dart \
            lib/screens/neo_sync_screen/neo_sync_tab.dart \
            lib/services/retroarch_config_service.dart \
            lib/services/neosync/neo_sync_service.dart \
            lib/providers/neo_sync_provider.dart \
            lib/providers/neosync/neosync_path_resolver.dart \
            lib/providers/neosync/neosync_upload.dart \
            lib/providers/neosync/neosync_core.dart \
            lib/providers/neosync/neosync_download.dart \
            lib/repositories/game_repository.dart

      - name: Run focused tests
        run: |
          flutter test test/game_repository_test.dart

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeoStation Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib build-utils/patch_neosync_v2_ios_preview.py
          if ! git diff --cached --quiet; then
            git commit -m 'Port NeoSync v2 core to iOS'
            git push origin HEAD:feature/neosync-v2-ios
          fi
