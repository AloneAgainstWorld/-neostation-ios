name: One-shot branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  BACKUP_BRANCH: backup/pre-hard-reset-2026-08-17

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run one-shot branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main and backup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          keep = {'main', os.environ['BACKUP_BRANCH']}
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'NeoStation one-shot branch cleanup',
          }

          branches = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/branches?per_page=100&page={page}',
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              if not payload:
                  break
              branches.extend(item['name'] for item in payload)
              if len(payload) < 100:
                  break
              page += 1

          doomed = sorted(set(branches) - keep)
          print('Keeping:', ', '.join(sorted(keep)))
          print('Deleting:', ', '.join(doomed) if doomed else '(none)')

          for branch in doomed:
              ref = urllib.parse.quote(f'heads/{branch}', safe='')
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/refs/{ref}',
                  method='DELETE',
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      print(f'deleted {branch}: HTTP {response.status}')
              except urllib.error.HTTPError as error:
                  if error.code in (404, 422):
                      print(f'skipped {branch}: HTTP {error.code}')
                  else:
                      raise

          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/branches?per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              remaining = {item['name'] for item in json.load(response)}

          if remaining != keep:
              raise SystemExit(f'Unexpected remaining branches: {sorted(remaining)}')
          print('Final branch set:', ', '.join(sorted(remaining)))
          PY
