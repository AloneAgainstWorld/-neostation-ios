name: Temporary repository cleanup verification

on:
  push:
    branches:
      - maintenance/final-repository-cleanup

permissions:
  contents: write

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/final-repository-cleanup
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies and apply analyzer-safe fixes
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart fix --apply
          mapfile -t dart_files < <(git diff --name-only -- '*.dart')
          if [ "${#dart_files[@]}" -gt 0 ]; then
            dart format "${dart_files[@]}"
          fi

      - name: Verify retired RPCS3 automation residue is gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'NeoStation\+RPCS3\+Start|rpcs3ShortcutName|openRpcs3ShortcutInstaller|openUrlAfterJitPreflight|openAppWithTwoPassJit|remove_rpcs3_shortcut_ui|RPCS3Core' lib test packages build-utils docs codemagic.yaml 2>/dev/null; then
            echo 'Retired RPCS3 automation residue remains.' >&2
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Commit dependency lock and analyzer-safe fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Apply analyzer-safe cleanup fixes'
          else
            git commit --allow-empty -m 'Repository analysis and tests passed'
          fi
          git push origin HEAD:maintenance/final-repository-cleanup

  ios-build:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/final-repository-cleanup
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fast-forward to verified branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin maintenance/final-repository-cleanup
          git checkout maintenance/final-repository-cleanup
          git reset --hard origin/maintenance/final-repository-cleanup

      - name: Resolve dependencies
        run: flutter pub get

      - name: Scaffold iOS platform
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          fi
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: CocoaPods
        shell: bash
        run: |
          cd ios
          pod install --repo-update

      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Record successful iOS verification
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard origin/maintenance/final-repository-cleanup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'iOS compile verification passed'
          git push origin HEAD:maintenance/final-repository-cleanup
