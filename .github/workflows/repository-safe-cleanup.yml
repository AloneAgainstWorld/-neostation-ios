name: Temporary cleanup branch verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CLEANUP_BRANCH: maintenance/final-repository-cleanup

jobs:
  verify-cleanup:
    if: contains(github.event.pull_request.title, '[verify-cleanup-branch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/final-repository-cleanup
          fetch-depth: 0

      - name: Restore audited settings source and apply narrow RPCS3 UI fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout 79533b65373159aa09e6f8bdb2f581b5bc47ddbb -- \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart

          python3 - <<'PY'
          from pathlib import Path

          settings = Path('lib/screens/settings_screen/new_settings_options/directories_settings_content.dart')
          text = settings.read_text(encoding='utf-8')
          old = '''      trailingAction: SizedBox(
        height: 32,
        child: OutlinedButton.icon(
          onPressed: _linkingFolderKey == null ? _syncWithRpcs3 : null,
          icon: const Icon(Symbols.sync_rounded, size: 16),
          label: Text(Rpcs3LibraryLocale.sync(context)),
        ),
      ),
'''
          new = '''      trailingAction: SizedBox(
        height: 48.r,
        child: FilledButton.icon(
          onPressed: !isLinked || _linkingFolderKey != null
              ? null
              : _syncWithRpcs3,
          icon: Icon(Symbols.bolt_rounded, size: 20.r),
          label: Text(
            hasSynced
                ? AppLocale.iosEmuResync.getString(context)
                : AppLocale.iosEmuSync.getString(context),
            style: TextStyle(fontSize: 14.r),
          ),
        ),
      ),
'''
          if old not in text:
              raise SystemExit('Expected cleaned RPCS3 action block not found')
          settings.write_text(text.replace(old, new, 1), encoding='utf-8')

          for transient in (
              '.cleanup-verify-trigger', '.cleanup-verify-trigger-2',
              '.cleanup-verify-trigger-3', '.cleanup-verify-trigger-4',
              '.cleanup-trigger', '.cleanup-trigger-2', '.cleanup-trigger-3',
              'cleanup-executor-error.txt', 'cleanup-verification-error.txt',
              'cleanup-ios-build-error.txt',
          ):
              p = Path(transient)
              if p.exists():
                  p.unlink()
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies and apply safe analyzer fixes
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart fix --apply
          mapfile -t dart_files < <(git diff --name-only -- '*.dart')
          if [ "${#dart_files[@]}" -gt 0 ]; then
            dart format "${dart_files[@]}"
          fi

      - name: Verify retired RPCS3 experiment residue
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'NeoStation\+RPCS3\+Start|rpcs3ShortcutName|openRpcs3ShortcutInstaller|openUrlAfterJitPreflight|openAppWithTwoPassJit|remove_rpcs3_shortcut_ui|RPCS3Core' \
            lib test packages build-utils docs codemagic.yaml 2>/dev/null; then
            echo 'Retired RPCS3 experiment residue remains.' >&2
            exit 1
          fi

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test

      - name: Commit verified cleanup state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Apply verified repository cleanup fixes'
          else
            git commit --allow-empty -m 'Repository analysis and tests passed'
          fi
          git push origin HEAD:${CLEANUP_BRANCH}

  ios-build:
    needs: verify-cleanup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/final-repository-cleanup
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fast-forward to verified cleanup head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ${CLEANUP_BRANCH}
          git checkout ${CLEANUP_BRANCH}
          git reset --hard origin/${CLEANUP_BRANCH}

      - name: Resolve dependencies
        run: flutter pub get

      - name: Scaffold iOS platform and set iOS 18
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          fi
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: CocoaPods
        shell: bash
        run: |
          cd ios
          pod install --repo-update

      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Record successful iOS compile
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ${CLEANUP_BRANCH}
          git reset --hard origin/${CLEANUP_BRANCH}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'iOS compile verification passed'
          git push origin HEAD:${CLEANUP_BRANCH}
