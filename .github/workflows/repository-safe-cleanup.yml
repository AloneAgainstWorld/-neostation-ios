name: Final repository verification and branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  BACKUP_BRANCH: backup/pre-hard-reset-2026-08-17

jobs:
  verify:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test

  ios-build:
    name: Unsigned iOS compile verification
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Scaffold iOS and configure iOS 18
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          fi
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          pod install --repo-update
      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign

  branch-cleanup:
    name: Delete obsolete branches
    needs:
      - verify
      - ios-build
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main and backup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          keep = {'main', os.environ['BACKUP_BRANCH']}
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'NeoStation final repository cleanup',
          }

          branches = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/branches?per_page=100&page={page}',
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              if not payload:
                  break
              branches.extend(item['name'] for item in payload)
              if len(payload) < 100:
                  break
              page += 1

          doomed = sorted(set(branches) - keep)
          print('Keeping:', ', '.join(sorted(keep)))
          print('Deleting:', ', '.join(doomed) if doomed else '(none)')

          for branch in doomed:
              encoded = urllib.parse.quote(branch, safe='')
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/refs/heads/{encoded}',
                  method='DELETE',
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      print(f'deleted {branch}: HTTP {response.status}')
              except urllib.error.HTTPError as error:
                  if error.code in (404, 422):
                      print(f'skipped {branch}: HTTP {error.code}')
                  else:
                      raise

          # Verify the final branch set.
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/branches?per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              remaining = {item['name'] for item in json.load(response)}
          if remaining != keep:
              raise SystemExit(f'Unexpected remaining branches: {sorted(remaining)}')
          print('Final branch set:', ', '.join(sorted(remaining)))
          PY
