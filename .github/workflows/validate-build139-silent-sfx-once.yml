name: Validate NeoStation silent SFX Build 139

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neostation-build139-silent-sfx
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test silent SFX fix
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout Build 139 branch
        uses: actions/checkout@v7
        with:
          ref: fix/ios-silent-sfx-race-build139
          fetch-depth: 0

      - name: Apply zero-volume serialized SFX start
        run: python3 tools/apply_build139_silent_sfx.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/services/sfx_service.dart \
            test/audio_policy_service_test.dart

      - name: Verify silent-safe SFX implementation
        run: |
          set -euo pipefail
          grep -Fq 'version: 0.9.9+139' pubspec.yaml
          grep -Fq '_sfxStartSerial' lib/services/sfx_service.dart
          grep -Fq 'await stopAllSounds()' lib/services/sfx_service.dart
          grep -Fq 'volume: 0.0' lib/services/sfx_service.dart
          grep -Fq 'paused: true' lib/services/sfx_service.dart
          grep -Fq 'setPause(handle, false)' lib/services/sfx_service.dart
          grep -Fq "reason: 'sfx-unpaused-zero-volume'" lib/services/sfx_service.dart
          grep -Fq 'setVolume(handle, _volume)' lib/services/sfx_service.dart
          grep -Fq 'Duration(seconds: 2)' lib/screens/game_screen/my_games_list.dart
          grep -Fq 'Timer(_SystemGamesListState._videoStartDelay' lib/screens/game_screen/my_games_list/secondary_display.dart

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run focused audio and video regression tests
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/home_music_silent_mode_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/theme_provider_background_persistence_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Commit validated Build 139 source and remove temporary automation
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock analysis_options.yaml || true
          git checkout -- packages/flutter_7zip/analysis_options.yaml || true
          git checkout -- packages/gamepads/analysis_options.yaml || true
          rm -f .github/workflows/validate-build139-silent-sfx-once.yml
          rm -f tools/apply_build139_silent_sfx.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ios): eliminate silent-mode SFX start race'
          git push origin HEAD:fix/ios-silent-sfx-race-build139
