name: Validate RPCS3 Automation Build 140 once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feature/rpcs3-shortcut-switch-control-build140'
    runs-on: macos-15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Build 140 device-local automation migration
        run: python3 tools/apply_build140_v2.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/services/rpcs3_launch_service.dart \
            lib/services/ios_shortcut_jit_launch_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/rpcs3_stage6_test.dart \
            test/rpcs3_stage7_test.dart

      - name: Verify stable launch and Build 138/139 regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -R "version: 0.9.9+140" pubspec.yaml
          grep -R "Duration(seconds: 2)" lib/screens/game_screen/my_games_list.dart
          grep -R "paused: true" lib/services/sfx_service.dart
          grep -R "volume: 0.0" lib/services/sfx_service.dart
          test ! -e assets/data/rpcs3_stikdebug_launch.js
          grep -R "SINGLE_PASS_JIT" lib/services/rpcs3_launch_service.dart
          grep -R "openJitRequest" lib/services/rpcs3_launch_service.dart
          ! grep -R "supportedCoreFunctions" lib/services/rpcs3_launch_service.dart
          ! grep -R "SECOND_PASS" lib/services/rpcs3_launch_service.dart
          grep -R "isRpcs3AutomationConfigured" lib/services/ios_shortcut_jit_launch_service.dart
          grep -R "shortcuts://" lib/services/ios_shortcut_jit_launch_service.dart
          grep -R "Set Switch Control Switch State" lib/screens/settings_screen/new_settings_options/directories_settings_content.dart

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Focused RPCS3 and audio/video regression tests
        run: |
          flutter test test/rpcs3_stage3_test.dart test/rpcs3_stage6_test.dart test/rpcs3_stage7_test.dart
          if test -f test/video_preview_lifecycle_test.dart; then flutter test test/video_preview_lifecycle_test.dart; fi
          if test -f test/sfx_service_test.dart; then flutter test test/sfx_service_test.dart; fi
          if test -f test/audio_policy_service_test.dart; then flutter test test/audio_policy_service_test.dart; fi

      - name: Full Flutter test suite
        run: flutter test

      - name: Commit validated Build 140 source and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeoStation CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm tools/apply_build140.py tools/apply_build140_v2.py .github/workflows/validate-rpcs3-shortcut-build140-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'Replace RPCS3 private boot injection with device automation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
