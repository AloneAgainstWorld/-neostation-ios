name: Temporary NeoStation simplified iOS audio architecture IPA v2

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

env:
  SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
  SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

jobs:
  build:
    if: github.event.head_commit.message == 'Start simplified iOS audio architecture build v2'
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'pending',
              'context': 'neostation/simplified-audio-ipa-v2',
              'description': f"run_id={os.environ['RUN_ID']}",
              'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        shell: bash
        run: |
          flutter pub get
          git restore pubspec.lock analysis_options.yaml 2>/dev/null || true

      - name: Apply simplified iOS audio architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import textwrap

          ROOT = Path.cwd()

          def clean(value: str) -> str:
              return textwrap.dedent(value).lstrip('\n')

          def file_path(name: str) -> Path:
              return ROOT / name

          def read(name: str) -> str:
              return file_path(name).read_text(encoding='utf-8')

          def write(name: str, content: str) -> None:
              target = file_path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(name: str, old: str, new: str) -> None:
              source = read(name)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{name}: expected one exact match, found {count}: {old[:120]!r}'
                  )
              write(name, source.replace(old, new, 1))

          def regex_once(
              name: str,
              pattern: str,
              replacement: str,
              *,
              flags: int = 0,
          ) -> None:
              source = read(name)
              updated, count = re.subn(
                  pattern,
                  lambda _: replacement,
                  source,
                  count=1,
                  flags=flags,
              )
              if count != 1:
                  raise SystemExit(
                      f'{name}: expected one regex match, found {count}: {pattern}'
                  )
              write(name, updated)

          def remove_policy_calls(source: str) -> str:
              pattern = re.compile(
                  r'^[ \t]*(?:await[ \t]+)?AudioPolicyService\(\)\.'
                  r'(?:ensureSilentCompatibleSession|prepareForPlayback|'
                  r'afterPlaybackStarted|setVideoPlaybackActive)\('
                  r'.*?\);[ \t]*\n',
                  re.MULTILINE | re.DOTALL,
              )
              return pattern.sub('', source)

          # ------------------------------------------------------------------
          # One app-wide policy owner, called only at structural boundaries.
          # ------------------------------------------------------------------
          write(
              'lib/services/audio_policy_service.dart',
              clean(r'''
              import 'dart:async';
              import 'dart:io';

              import 'package:external_folder_access/external_folder_access.dart';
              import 'package:flutter/widgets.dart';

              import 'logger_service.dart';

              /// Owns NeoStation's single iOS audio-session policy.
              ///
              /// Playback clients do not call this service when they play, pause,
              /// change volume, or dispose. SoLoud and AVPlayer manage their playback
              /// lifecycles independently. This service restores the app-wide
              /// `.ambient` category only at structural boundaries:
              ///
              /// - application startup;
              /// - application resume;
              /// - after the shared SoLoud engine is created or recreated.
              ///
              /// The native plugin also restores the same category after iOS
              /// interruption and route-change notifications.
              class AudioPolicyService with WidgetsBindingObserver {
                AudioPolicyService._internal();

                static final AudioPolicyService _instance =
                    AudioPolicyService._internal();
                factory AudioPolicyService() => _instance;

                final LoggerService _log = LoggerService.instance;

                bool _initialized = false;
                Future<void> _serial = Future<void>.value();
                int _applicationCount = 0;

                bool get isInitialized => _initialized;
                int get applicationCountForTesting => _applicationCount;

                Future<void> initialize() async {
                  if (_initialized) return;
                  _initialized = true;
                  WidgetsBinding.instance.addObserver(this);
                  await _apply(reason: 'application-start');
                }

                /// Restores `.ambient` after a shared native audio engine is created.
                /// This is intentionally an engine-lifecycle hook, not a per-track or
                /// per-sound hook.
                Future<void> restoreAfterSharedAudioEngineInitialization({
                  required String reason,
                }) {
                  return _apply(reason: 'shared-engine-initialized:$reason');
                }

                Future<void> _apply({required String reason}) {
                  if (!Platform.isIOS) return Future<void>.value();

                  final completer = Completer<void>();
                  _serial = _serial.catchError((Object _) {}).then((_) async {
                    try {
                      final applied = await ExternalFolderAccess
                          .configureAudioSessionForSilentMode();
                      if (applied == true) {
                        _applicationCount++;
                      } else {
                        _log.w(
                          '[AudioPolicy] Native ambient session was not applied: '
                          '$reason',
                        );
                      }
                    } catch (error, stack) {
                      _log.e(
                        '[AudioPolicy] Failed to apply ambient session: $reason',
                        error: error,
                        stackTrace: stack,
                      );
                    } finally {
                      if (!completer.isCompleted) completer.complete();
                    }
                  });
                  return completer.future;
                }

                @override
                void didChangeAppLifecycleState(AppLifecycleState state) {
                  if (state == AppLifecycleState.resumed) {
                    unawaited(_apply(reason: 'application-resumed'));
                  }
                }
              }
              '''),
          )

          # ------------------------------------------------------------------
          # Official-style direct SFX playback. Session restore only after an
          # actual shared SoLoud engine creation.
          # ------------------------------------------------------------------
          write(
              'lib/services/sfx_service.dart',
              clean(r'''
              import 'dart:async';
              import 'dart:io';
              import 'dart:math';

              import 'package:flutter_soloud/flutter_soloud.dart';
              import 'package:neostation/services/audio_policy_service.dart';
              import 'package:neostation/services/logger_service.dart';
              import 'package:path_provider/path_provider.dart';

              /// Independent service for managing user-interface sound effects.
              ///
              /// Playback mirrors NeoStation's official implementation: preloaded
              /// sources are played directly through SoLoud with a short debounce.
              /// Individual navigation, confirm and back sounds never touch
              /// AVAudioSession.
              class SfxService {
                static final SfxService _instance = SfxService._internal();
                factory SfxService() => _instance;
                SfxService._internal();

                static const List<String> _navSounds = [
                  'assets/sounds/nav1.wav',
                  'assets/sounds/nav2.wav',
                  'assets/sounds/nav3.wav',
                ];
                static const String _enterSound = 'assets/sounds/enter.wav';
                static const String _backSound = 'assets/sounds/back.wav';
                static const int _debounceMs = 60;

                final LoggerService _log = LoggerService.instance;
                final Random _random = Random();
                final Map<String, AudioSource> _sources = <String, AudioSource>{};

                bool _isInitialized = false;
                bool _isInitializing = false;
                int _lastNavIndex = -1;
                DateTime? _lastPlayTime;
                bool _enabled = true;
                double _volume = 0.75;
                Completer<void>? _initCompleter;

                double get volume => _volume;
                bool get isInitialized => _isInitialized;
                bool get isEnabled => _enabled;

                Future<void> init() async {
                  if (_isInitialized) return;
                  if (_isInitializing) return _initCompleter?.future;

                  _isInitializing = true;
                  _initCompleter = Completer<void>();

                  try {
                    _log.i('[SfxService] Initializing...');

                    var createdSharedEngine = false;
                    if (!SoLoud.instance.isInitialized) {
                      try {
                        final tempDir = await getTemporaryDirectory();
                        await Directory(
                          '${tempDir.path}/SoLoudLoader-Temp-Files',
                        ).create(recursive: true);
                      } catch (_) {}

                      await SoLoud.instance.init();
                      createdSharedEngine = true;
                    }

                    if (createdSharedEngine) {
                      await AudioPolicyService()
                          .restoreAfterSharedAudioEngineInitialization(
                            reason: 'soloud-sfx',
                          );
                    }

                    final allPaths = <String>[
                      ..._navSounds,
                      _enterSound,
                      _backSound,
                    ];
                    for (final soundPath in allPaths) {
                      try {
                        AudioSource? source;
                        var retries = 0;
                        while (source == null && retries < 2) {
                          try {
                            source = await SoLoud.instance.loadAsset(soundPath);
                          } catch (error) {
                            retries++;
                            if (retries < 2) {
                              _log.w(
                                '[SfxService] Retrying load for $soundPath '
                                '($retries/2)...',
                              );
                              await Future<void>.delayed(
                                const Duration(milliseconds: 200),
                              );
                            } else {
                              rethrow;
                            }
                          }
                        }

                        if (source != null) {
                          _sources[soundPath] = source;
                          _log.d('[SfxService] Loaded: $soundPath');
                        }
                      } catch (error) {
                        _log.w(
                          '[SfxService] Could not load $soundPath: $error',
                        );
                      }
                    }

                    _isInitialized = true;
                    _log.i(
                      '[SfxService] Ready. ${_sources.length}/'
                      '${allPaths.length} sounds loaded.',
                    );
                    _initCompleter?.complete();
                  } catch (error, stack) {
                    _log.e(
                      '[SfxService] Init error: $error',
                      error: error,
                      stackTrace: stack,
                    );
                    _initCompleter?.completeError(error, stack);
                  } finally {
                    _isInitializing = false;
                  }
                }

                void handleEngineTornDown() {
                  _sources.clear();
                  _isInitialized = false;
                  _isInitializing = false;
                  _initCompleter = null;
                  _log.i(
                    '[SfxService] Engine released; SFX will reload on resume.',
                  );
                }

                Future<void> reinitializeAfterEngineRestart() async {
                  if (_isInitialized) return;
                  await init();
                }

                Future<void> dispose() async {
                  if (SoLoud.instance.isInitialized) {
                    for (final source in _sources.values) {
                      try {
                        await SoLoud.instance.disposeSource(source);
                      } catch (_) {}
                    }
                  }
                  _sources.clear();
                  _isInitialized = false;
                  _log.i('[SfxService] Disposed.');
                }

                Future<void> playNavSound() async {
                  if (!_enabled || !_debounce()) return;
                  await _ensureInitialized();
                  if (!_isInitialized || _sources.isEmpty) return;

                  final index = _pickRandomNavIndex();
                  final soundPath = _navSounds[index];
                  await _play(soundPath);
                  _log.d('[SfxService] nav[$index]: $soundPath');
                }

                Future<void> playEnterSound() async {
                  if (!_enabled || !_debounce()) return;
                  await _ensureInitialized();
                  if (!_isInitialized) return;
                  await _play(_enterSound);
                  _log.d('[SfxService] enter');
                }

                Future<void> playBackSound() async {
                  if (!_enabled || !_debounce()) return;
                  await _ensureInitialized();
                  if (!_isInitialized) return;
                  await _play(_backSound);
                  _log.d('[SfxService] back');
                }

                void setVolume(double value) {
                  _volume = value.clamp(0.0, 0.75);
                  _log.d('[SfxService] Volume set to $_volume');
                }

                void setEnabled(bool value) {
                  _enabled = value;
                  _log.d(
                    '[SfxService] SFX ${value ? 'enabled' : 'disabled'}',
                  );
                }

                bool _debounce() {
                  final now = DateTime.now();
                  if (_lastPlayTime != null &&
                      now.difference(_lastPlayTime!).inMilliseconds <
                          _debounceMs) {
                    return false;
                  }
                  _lastPlayTime = now;
                  return true;
                }

                Future<void> _ensureInitialized() async {
                  if (!_isInitialized) await init();
                }

                Future<void> _play(String soundPath) async {
                  final source = _sources[soundPath];
                  if (source == null) {
                    _log.w('[SfxService] Source not found for: $soundPath');
                    return;
                  }
                  if (!_enabled || !SoLoud.instance.isInitialized) return;

                  try {
                    SoLoud.instance.play(source, volume: _volume);
                  } catch (error) {
                    _log.w(
                      '[SfxService] Playback error for $soundPath: $error',
                    );
                  }
                }

                int _pickRandomNavIndex() {
                  if (_navSounds.length == 1) return 0;

                  int index;
                  do {
                    index = _random.nextInt(_navSounds.length);
                  } while (index == _lastNavIndex);

                  _lastNavIndex = index;
                  return index;
                }
              }
              '''),
          )

          # ------------------------------------------------------------------
          # Home-menu music: keep independent source/handle ownership.
          # ------------------------------------------------------------------
          replace_once(
              'lib/services/home_music_service.dart',
              "import 'package:neostation/services/audio_policy_service.dart';\n",
              '',
          )
          regex_once(
              'lib/services/home_music_service.dart',
              r'  Future<void> _resumeWithAudioPolicy\(\) async \{.*?\n  \}\n\n',
              '',
              flags=re.DOTALL,
          )
          regex_once(
              'lib/services/home_music_service.dart',
              r'  Future<void> _startPlayback\(\) async \{.*?\n  \}\n\n'
              r'  Future<void> _stopPlayback',
              clean(r'''
                Future<void> _startPlayback() async {
                  if (_starting ||
                      _handle != null ||
                      !_shouldPlay ||
                      _musicPath == null) {
                    return;
                  }
                  _starting = true;

                  try {
                    // SFX owns the shared SoLoud initialization path. Once the
                    // engine is ready, this reader manages only its own source,
                    // handle and volume.
                    await SfxService().init();
                    if (!_shouldPlay || _musicPath == null) return;

                    final source = await SoLoud.instance.loadFile(_musicPath!);
                    if (!_shouldPlay) {
                      await SoLoud.instance.disposeSource(source);
                      return;
                    }

                    _source = source;
                    _handle = SoLoud.instance.play(
                      source,
                      volume: _volume,
                      looping: true,
                    );
                    _log.i('[HomeMusic] Main-menu music started.');
                  } catch (e) {
                    _source = null;
                    _handle = null;
                    _log.w('[HomeMusic] Could not start selected music: $e');
                  } finally {
                    _starting = false;
                  }
                }

                Future<void> _stopPlayback
              '''),
              flags=re.DOTALL,
          )
          replace_once(
              'lib/services/home_music_service.dart',
              '      unawaited(_resumeWithAudioPolicy());',
              '      unawaited(_syncPlayback());',
          )

          # ------------------------------------------------------------------
          # Music player: one policy restore only when it creates SoLoud.
          # ------------------------------------------------------------------
          music_name = 'lib/services/music_player_service.dart'
          music = remove_policy_calls(read(music_name))
          music, count = re.subn(
              r'  Future<void> init\(\) async \{.*?\n  \}\n\n'
              r'  /// Updates the current playlist',
              lambda _: clean(r'''
                Future<void> init() async {
                  if (_isInitialized) return;
                  if (_initCompleter != null) return _initCompleter!.future;

                  _initCompleter = Completer<void>();
                  try {
                    _logger.i('Initializing Music Player Service (SoLoud)');
                    _soloud = SoLoud.instance;

                    if (!_soloud!.isInitialized) {
                      await _soloud!.init();
                      await AudioPolicyService()
                          .restoreAfterSharedAudioEngineInitialization(
                            reason: 'soloud-music-player',
                          );
                    }

                    _soloud!.setVisualizationEnabled(true);
                    _soloud!.setFftSmoothing(0.8);
                    _audioData = AudioData(GetSamplesKind.linear);

                    _isInitialized = true;
                    _startStreamTimers();
                    _initCompleter!.complete();
                  } catch (e) {
                    _logger.e('Error initializing music player: $e');
                    _initCompleter!.completeError(e);
                    _initCompleter = null;
                  }
                }

                /// Updates the current playlist
              '''),
              music,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('music_player_service.dart: init() replacement failed')
          write(music_name, music)

          # ------------------------------------------------------------------
          # Video clients retain their own controller lifecycles but no longer
          # mutate or arbitrate the shared AVAudioSession.
          # ------------------------------------------------------------------
          shader_name = 'lib/widgets/shaders/shader_gif_widget.dart'
          shader = read(shader_name).replace(
              "\nimport '../../services/audio_policy_service.dart';\n",
              '\n',
          )
          shader, count = re.subn(
              r'    final controller = VideoPlayerController\.file\(\s*'
              r'file,\s*videoPlayerOptions:\s*VideoPlayerOptions\('
              r'mixWithOthers:\s*true\),\s*\);',
              '    final controller = VideoPlayerController.file(file);',
              shader,
              count=1,
          )
          if count != 1:
              raise SystemExit('shader_gif_widget.dart: controller replacement failed')
          shader = remove_policy_calls(shader)
          if 'AudioPolicyService' in shader:
              raise SystemExit('shader_gif_widget.dart still references audio policy')
          write(shader_name, shader)

          replace_once(
              'lib/screens/game_screen/my_games_list.dart',
              "\nimport 'package:neostation/services/audio_policy_service.dart';\n",
              '\n',
          )
          primary_name = (
              'lib/screens/game_screen/my_games_list/secondary_display.dart'
          )
          primary = read(primary_name)
          primary = re.sub(
              r'    // This is the sole owner of the primary preview.*?'
              r'AudioPolicyService\(\)\.setVideoPlaybackActive\(false\);\n',
              '',
              primary,
              count=1,
              flags=re.DOTALL,
          )
          primary, count = re.subn(
              r'      final controller = VideoPlayerController\.file\(\s*'
              r'File\(videoPath\),\s*videoPlayerOptions:\s*'
              r'VideoPlayerOptions\(mixWithOthers:\s*true\),\s*\);',
              '      final controller = VideoPlayerController.file('
              'File(videoPath));',
              primary,
              count=1,
          )
          if count != 1:
              raise SystemExit('secondary_display.dart: controller replacement failed')
          primary = remove_policy_calls(primary)
          primary = re.sub(
              r'        // From here on this controller owns the shared audio session.*?'
              r"        _videoController = controller;",
              '        _videoController = controller;',
              primary,
              count=1,
              flags=re.DOTALL,
          )
          if 'AudioPolicyService' in primary:
              raise SystemExit('secondary_display.dart still references audio policy')
          write(primary_name, primary)

          details_name = (
              'lib/screens/game_screen/game_details_card/'
              'game_details_card_list.dart'
          )
          details = read(details_name).replace(
              "import 'package:neostation/services/audio_policy_service.dart';\n",
              '',
          )
          details = remove_policy_calls(details)
          details = re.sub(
              r'\n\s*// Keep the shared audio-session gate.*?'
              r'\n\s*with the audible state:.*?\n',
              '\n',
              details,
              count=1,
              flags=re.DOTALL,
          )
          if 'AudioPolicyService' in details:
              raise SystemExit('game_details_card_list.dart still references policy')
          write(details_name, details)

          secondary_name = 'lib/screens/secondary_screen/secondary_screen.dart'
          secondary = read(secondary_name).replace(
              "\nimport 'package:neostation/services/audio_policy_service.dart';\n",
              '\n',
          )
          secondary, count = re.subn(
              r'      controller = VideoPlayerController\.file\(\s*'
              r'File\(path\),\s*videoPlayerOptions:\s*'
              r'VideoPlayerOptions\(mixWithOthers:\s*true\),\s*\);',
              '      controller = VideoPlayerController.file(File(path));',
              secondary,
              count=1,
          )
          if count != 1:
              raise SystemExit('secondary_screen.dart: controller replacement failed')
          secondary = remove_policy_calls(secondary)
          secondary = re.sub(
              r'\n\s*// Unrelated clients \(SFX, music\).*?'
              r'\n\s*stop resetting the shared audio unit under this video.*?\n',
              '\n',
              secondary,
              count=1,
              flags=re.DOTALL,
          )
          if 'AudioPolicyService' in secondary:
              raise SystemExit('secondary_screen.dart still references audio policy')
          write(secondary_name, secondary)

          # ------------------------------------------------------------------
          # Native session owner: idempotent policy plus structural observers.
          # ------------------------------------------------------------------
          native_name = (
              'packages/external_folder_access/ios/Classes/'
              'ExternalFolderAccessPlugin.swift'
          )
          native = read(native_name)
          native, count = re.subn(
              r'(    private var pendingResult: FlutterResult\?\n'
              r'    private var channel: FlutterMethodChannel\?\n)',
              lambda match: match.group(1) + clean(r'''
                    private var audioSessionObservers: [NSObjectProtocol] = []
                    private var audioSessionKnownActive = false
              '''),
              native,
              count=1,
          )
          if count != 1:
              raise SystemExit('native plugin: property insertion failed')
          native, count = re.subn(
              r'(        let instance = ExternalFolderAccessPlugin\(\)\n'
              r'        instance\.channel = channel\n)',
              lambda match: match.group(1)
              + '        instance.installAudioSessionObservers()\n',
              native,
              count=1,
          )
          if count != 1:
              raise SystemExit('native plugin: observer registration failed')

          native_section = clean(r'''
              // MARK: - iOS audio session

              /// Registers infrequent structural recovery hooks. Normal player
              /// starts, pauses, volume changes and disposals never touch
              /// AVAudioSession.
              private func installAudioSessionObservers() {
                  let center = NotificationCenter.default
                  let session = AVAudioSession.sharedInstance()

                  audioSessionObservers.append(
                      center.addObserver(
                          forName: AVAudioSession.interruptionNotification,
                          object: session,
                          queue: .main
                      ) { [weak self] notification in
                          guard let self else { return }
                          guard
                              let number = notification.userInfo?[
                                  AVAudioSessionInterruptionTypeKey
                              ] as? NSNumber,
                              let type = AVAudioSession.InterruptionType(
                                  rawValue: number.uintValue
                              )
                          else {
                              return
                          }

                          switch type {
                          case .began:
                              self.audioSessionKnownActive = false
                          case .ended:
                              try? self.applySilentModeAudioSession(
                                  forceActivation: true
                              )
                          @unknown default:
                              break
                          }
                      }
                  )

                  audioSessionObservers.append(
                      center.addObserver(
                          forName: AVAudioSession.routeChangeNotification,
                          object: session,
                          queue: .main
                      ) { [weak self] _ in
                          guard let self else { return }
                          try? self.applySilentModeAudioSession(
                              forceActivation: false
                          )
                      }
                  )
              }

              deinit {
                  for observer in audioSessionObservers {
                      NotificationCenter.default.removeObserver(observer)
                  }
              }

              /// Applies NeoStation's one app-wide audio policy.
              ///
              /// Category writes are skipped when the session is already correct.
              /// Activation is forced only at startup, application resume, shared
              /// SoLoud engine creation, or interruption end.
              @discardableResult
              private func applySilentModeAudioSession(
                  forceActivation: Bool
              ) throws -> Bool {
                  let session = AVAudioSession.sharedInstance()
                  let desiredOptions: AVAudioSession.CategoryOptions = [
                      .mixWithOthers
                  ]
                  let categoryNeedsUpdate =
                      session.category != .ambient ||
                      session.mode != .default ||
                      session.categoryOptions != desiredOptions

                  if categoryNeedsUpdate {
                      try session.setCategory(
                          .ambient,
                          mode: .default,
                          options: desiredOptions
                      )
                  }

                  if forceActivation || !audioSessionKnownActive {
                      try session.setActive(true)
                      audioSessionKnownActive = true
                  }
                  return true
              }

              private func configureAudioSessionForSilentMode(
                  result: @escaping FlutterResult
              ) {
                  do {
                      result(
                          try applySilentModeAudioSession(
                              forceActivation: true
                          )
                      )
                  } catch {
                      result(
                          FlutterError(
                              code: "AUDIO_SESSION_FAILED",
                              message: error.localizedDescription,
                              details: nil
                          )
                      )
                  }
              }

          ''')
          native, count = re.subn(
              r'    // MARK: - iOS audio session\n.*?'
              r'    // MARK: - Raw URL opening\n',
              lambda _: textwrap.indent(native_section, '    ')
              + '    // MARK: - Raw URL opening\n',
              native,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('native plugin: audio section replacement failed')
          write(native_name, native)

          # ------------------------------------------------------------------
          # Durable patch for Flutter's iOS video plugin.
          # ------------------------------------------------------------------
          write(
              'build-utils/patch_ios_video_player_audio_session.py',
              clean(r'''#!/usr/bin/env python3
              """Keep video_player_avfoundation from owning AVAudioSession."""

              from __future__ import annotations

              import argparse
              import json
              import re
              import sys
              from pathlib import Path
              from urllib.parse import unquote, urlparse

              MARKER = 'NEOSTATION_AUDIO_SESSION_OWNED_EXTERNALLY'
              RELATIVE_TARGET = Path(
                  'darwin/video_player_avfoundation/Sources/'
                  'video_player_avfoundation/VideoPlayerPlugin.swift'
              )

              def uri_path(value: str, base: Path) -> Path:
                  parsed = urlparse(value)
                  if parsed.scheme == 'file':
                      return Path(unquote(parsed.path)).resolve()
                  return (base / unquote(value)).resolve()

              def locate_plugin_source() -> Path:
                  config_path = Path('.dart_tool/package_config.json')
                  if config_path.is_file():
                      payload = json.loads(
                          config_path.read_text(encoding='utf-8')
                      )
                      for package in payload.get('packages', []):
                          if package.get('name') != 'video_player_avfoundation':
                              continue
                          root = uri_path(package['rootUri'], config_path.parent)
                          target = root / RELATIVE_TARGET
                          if target.is_file():
                              return target

                  candidates = sorted(
                      Path.home().glob(
                          '.pub-cache/hosted/pub.dev/'
                          'video_player_avfoundation-*/'
                          + str(RELATIVE_TARGET)
                      )
                  )
                  if candidates:
                      return candidates[-1]
                  raise SystemExit(
                      'video_player_avfoundation source not found; '
                      'run flutter pub get first'
                  )

              def function_block(
                  source: str,
                  signature: str,
              ) -> tuple[int, int, str]:
                  start = source.find(signature)
                  if start < 0:
                      raise SystemExit(f'Missing Swift function: {signature}')
                  opening = source.find('{', start)
                  if opening < 0:
                      raise SystemExit(
                          f'Missing opening brace for: {signature}'
                      )

                  depth = 0
                  for index in range(opening, len(source)):
                      char = source[index]
                      if char == '{':
                          depth += 1
                      elif char == '}':
                          depth -= 1
                          if depth == 0:
                              return start, index + 1, source[start:index + 1]
                  raise SystemExit(f'Unbalanced Swift function: {signature}')

              def verify(source: str) -> None:
                  _, _, initialize = function_block(
                      source,
                      '  func initialize() throws {',
                  )
                  if MARKER not in initialize:
                      raise SystemExit(
                          'video_player initialize() is not NeoStation-owned'
                      )
                  if 'requestedCategory: .playback' in initialize:
                      raise SystemExit(
                          'video_player still upgrades AVAudioSession to .playback'
                      )

                  _, _, mix = function_block(
                      source,
                      '  func setMixWithOthers(_ mixWithOthers: Bool) throws {',
                  )
                  if MARKER not in mix:
                      raise SystemExit('setMixWithOthers() is not neutralized')
                  if 'upgradeAudioSessionCategory' in mix or 'setCategory' in mix:
                      raise SystemExit(
                          'setMixWithOthers() still mutates AVAudioSession'
                      )

              def patch(target: Path) -> None:
                  source = target.read_text(encoding='utf-8')
                  if MARKER not in source:
                      pattern = re.compile(
                          r'(?ms)^    #if os\(iOS\)\n'
                          r'      // Allow audio playback when the Ring/Silent '
                          r'switch is set to silent\n'
                          r'      upgradeAudioSessionCategory\(\n.*?'
                          r'^    #endif\n'
                      )
                      replacement = (
                          '    #if os(iOS)\n'
                          f'      // {MARKER}\n'
                          '      // NeoStation configures the single shared '
                          'AVAudioSession.\n'
                          '      // The plugin must not upgrade `.ambient` '
                          'to `.playback`.\n'
                          '    #endif\n'
                      )
                      source, count = pattern.subn(
                          replacement,
                          source,
                          count=1,
                      )
                      if count != 1:
                          raise SystemExit(
                              'Could not find video_player iOS .playback block'
                          )

                      start, end, _ = function_block(
                          source,
                          '  func setMixWithOthers('
                          '_ mixWithOthers: Bool) throws {',
                      )
                      replacement_function = (
                          '  func setMixWithOthers('
                          '_ mixWithOthers: Bool) throws {\n'
                          f'    // {MARKER}\n'
                          '    // Per-player mixing hints must not reconfigure '
                          'the app-wide\n'
                          '    // AVAudioSession owned by NeoStation.\n'
                          '    _ = mixWithOthers\n'
                          '  }'
                      )
                      source = (
                          source[:start]
                          + replacement_function
                          + source[end:]
                      )
                      target.write_text(source, encoding='utf-8')

                  verify(target.read_text(encoding='utf-8'))
                  print(
                      'Verified NeoStation audio-session ownership patch: '
                      f'{target}'
                  )

              def main() -> int:
                  parser = argparse.ArgumentParser()
                  parser.add_argument('--check', action='store_true')
                  args = parser.parse_args()

                  target = locate_plugin_source()
                  if args.check:
                      verify(target.read_text(encoding='utf-8'))
                      print(
                          'Verified NeoStation audio-session ownership patch: '
                          f'{target}'
                      )
                  else:
                      patch(target)
                  return 0

              if __name__ == '__main__':
                  sys.exit(main())
              '''),
          )

          codemagic_name = 'codemagic.yaml'
          codemagic = read(codemagic_name)
          dependency_step = clean(r'''
                - name: Keep iOS audio session owned by NeoStation
                  script: python3 build-utils/patch_ios_video_player_audio_session.py
          ''')
          if 'Keep iOS audio session owned by NeoStation' not in codemagic:
              codemagic, count = re.subn(
                  r'(      - name: Resolve Flutter dependencies\n'
                  r'        script: flutter pub get\n)',
                  lambda match: match.group(1) + '\n' + dependency_step,
                  codemagic,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('codemagic: dependency patch insertion failed')

          verify_step = clean(r'''
                - name: Verify iOS video player audio-session patch
                  script: python3 build-utils/patch_ios_video_player_audio_session.py --check
          ''')
          if 'Verify iOS video player audio-session patch' not in codemagic:
              codemagic, count = re.subn(
                  r'(      - name: Install CocoaPods dependencies\n'
                  r'        script: \|\n'
                  r'          cd ios\n'
                  r'          pod install --repo-update\n)',
                  lambda match: match.group(1) + '\n' + verify_step,
                  codemagic,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('codemagic: verification insertion failed')
          write(codemagic_name, codemagic)

          # ------------------------------------------------------------------
          # Regression tests and architecture documentation.
          # ------------------------------------------------------------------
          write(
              'test/audio_policy_service_test.dart',
              clean(r'''
