name: Build iOS (NeoStation)

# Dedicated iOS build workflow. It remains separate from the main release
# pipeline while the iOS port is maintained independently.
#
# Signed builds require:
#   IOS_CERTIFICATE_BASE64
#   IOS_CERTIFICATE_PASSWORD
#   IOS_PROVISIONING_PROFILE_BASE64
#   IOS_TEAM_ID
#
# Without signing secrets, the workflow produces an unsigned IPA that can be
# signed by the installer before sideloading.

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create .env from secrets
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          : > .env
          if [ -n "$SCREENSCRAPER_DEV_ID" ]; then
            echo "SCREENSCRAPER_DEV_ID=$SCREENSCRAPER_DEV_ID" >> .env
          fi
          if [ -n "$SCREENSCRAPER_DEV_PASSWORD" ]; then
            echo "SCREENSCRAPER_DEV_PASSWORD=$SCREENSCRAPER_DEV_PASSWORD" >> .env
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold ios/ platform if missing
        run: |
          if [ ! -d "ios" ]; then
            echo "No ios/ folder committed yet — generating one with flutter create."
            flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          else
            echo "ios/ already exists in the repo, skipping scaffold."
          fi

      - name: Set iOS deployment target to 18.0
        run: |
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Patch Info.plist
        run: |
          PLIST=ios/Runner/Info.plist

          # NeoStation uses a landscape-only interface on iOS and iPadOS.
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"

          # Expose the app's Documents directory through iOS document APIs.
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true

          # Register NeoStation's callback URL scheme for emulator integrations.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"

          # Allow availability checks and launches for supported iOS integrations.
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"

          plutil -lint "$PLIST"

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch device_info_plus for older Xcode SDK compatibility
        run: |
          # Some runner SDKs do not expose NSProcessInfo.isiOSAppOnVision.
          # NeoStation does not consume that value, so remove the unsupported
          # assignment when it is present in the resolved plugin source.
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" 2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            echo "Patching $DEVICE_INFO_FILE"
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          else
            echo "device_info_plus source not found at the expected path — skipping patch."
          fi

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Import signing certificate & provisioning profile
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_CERTIFICATE_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "No IOS_CERTIFICATE_BASE64 / IOS_PROVISIONING_PROFILE_BASE64 secret set."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed IPA
        if: steps.signing.outputs.signed == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          flutter build ipa --release --export-options-plist=ExportOptions.plist --dart-define-from-file=.env

      - name: Build unsigned .app (no signing secrets configured)
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail

          # Configure Flutter first, then build Runner directly without signing
          # so the workflow retains useful Xcode diagnostics on failure.
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-unsigned.log

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Unsigned Runner.app was not produced."
            exit 1
          fi

          echo "Unsigned app produced at: $APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          cd build/ios/unsigned
          zip -r ../../../NeoStation-unsigned.ipa Payload
          echo "::warning::NeoStation-unsigned.ipa must still be signed by SideStore before installation."

      - name: Upload signed IPA
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: NeoStation-ios-signed
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload unsigned build
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: NeoStation-ios-unsigned
          path: NeoStation-unsigned.ipa
          retention-days: 14
