name: Build iOS (NeoStation)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate and create ScreenScraper build environment
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import pathlib
          import sys

          values = {
              "SCREENSCRAPER_DEV_ID": os.environ.get("SCREENSCRAPER_DEV_ID", ""),
              "SCREENSCRAPER_DEV_PASSWORD": os.environ.get(
                  "SCREENSCRAPER_DEV_PASSWORD", ""
              ),
          }

          missing = [name for name, value in values.items() if not value]
          if missing:
              print(
                  "::error::Missing required Production secrets: "
                  + ", ".join(missing)
              )
              sys.exit(1)

          malformed = [
              name
              for name, value in values.items()
              if value != value.strip() or "\n" in value or "\r" in value
          ]
          if malformed:
              print(
                  "::error::Leading/trailing whitespace or newline detected in: "
                  + ", ".join(malformed)
              )
              sys.exit(1)

          path = pathlib.Path(".env")
          path.write_text(
              "\n".join(f"{name}={value}" for name, value in values.items()) + "\n",
              encoding="utf-8",
          )
          path.chmod(0o600)
          print("ScreenScraper build environment is present and non-empty.")
          PY

      - name: Verify ScreenScraper developer access
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode(
              {
                  "devid": os.environ["SCREENSCRAPER_DEV_ID"],
                  "devpassword": os.environ["SCREENSCRAPER_DEV_PASSWORD"],
                  "softname": "neostation-ios-ci",
                  "output": "json",
              }
          )
          request = urllib.request.Request(
              "https://api.screenscraper.fr/api2/ssinfraInfos.php?" + query,
              headers={
                  "User-Agent": "NeoStation/1.0",
                  "Accept": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=40) as response:
                  status = response.status
                  body = response.read()
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read()
          except Exception as error:
              print(
                  "::error::ScreenScraper developer preflight network failure: "
                  + type(error).__name__
              )
              sys.exit(1)

          print(f"ScreenScraper developer preflight HTTP status: {status}")
          if status != 200:
              print(
                  "::error::ScreenScraper rejected or could not validate the "
                  "configured developer credentials."
              )
              sys.exit(1)

          try:
              payload = json.loads(body.decode("utf-8"))
          except Exception:
              print("::error::ScreenScraper preflight returned invalid JSON.")
              sys.exit(1)

          header = payload.get("header") if isinstance(payload, dict) else None
          success = header.get("success") if isinstance(header, dict) else None
          if str(success).lower() not in {"true", "1"}:
              print(
                  "::error::ScreenScraper developer preflight response did not "
                  "report success."
              )
              sys.exit(1)

          print("ScreenScraper developer credentials were accepted by the API.")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold iOS platform if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi

      - name: Set iOS deployment target to 18.0
        run: |
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Patch Info.plist
        run: |
          set -euo pipefail
          PLIST=ios/Runner/Info.plist

          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"

          plutil -lint "$PLIST"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Patch device_info_plus for runner SDK compatibility
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" \
            -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" \
            2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Configure iOS build with ScreenScraper defines
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      - name: Verify ScreenScraper defines in generated Xcode configuration
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          config = pathlib.Path("ios/Flutter/Generated.xcconfig")
          if not config.is_file():
              print("::error::ios/Flutter/Generated.xcconfig was not generated.")
              sys.exit(1)

          encoded = None
          for line in config.read_text(encoding="utf-8").splitlines():
              if line.startswith("DART_DEFINES="):
                  encoded = line.split("=", 1)[1]
                  break

          if not encoded:
              print("::error::DART_DEFINES is missing from Generated.xcconfig.")
              sys.exit(1)

          decoded = set()
          for item in encoded.split(","):
              if not item:
                  continue
              try:
                  decoded.add(base64.b64decode(item).decode("utf-8"))
              except Exception:
                  print("::error::A generated DART_DEFINES entry is invalid.")
                  sys.exit(1)

          expected = {
              "SCREENSCRAPER_DEV_ID=" + os.environ["SCREENSCRAPER_DEV_ID"],
              "SCREENSCRAPER_DEV_PASSWORD="
              + os.environ["SCREENSCRAPER_DEV_PASSWORD"],
          }

          if not expected.issubset(decoded):
              print(
                  "::error::The generated iOS configuration does not contain "
                  "the exact ScreenScraper developer defines."
              )
              sys.exit(1)

          print(
              "Both ScreenScraper developer defines are embedded in the "
              "generated iOS build configuration."
          )
          PY

      - name: Import signing certificate and provisioning profile
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_CERTIFICATE_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | \
            base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed IPA
        if: steps.signing.outputs.signed == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          flutter build ipa \
            --release \
            --export-options-plist=ExportOptions.plist \
            --dart-define-from-file=.env

      - name: Build unsigned IPA
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail

          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-unsigned.log

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Unsigned Runner.app was not produced."
            exit 1
          fi

          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (
            cd build/ios/unsigned
            zip -r ../../../NeoStation-unsigned.ipa Payload
          )

      - name: Upload signed IPA
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-ios-signed
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload unsigned IPA
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-ios-unsigned
          path: NeoStation-unsigned.ipa
          retention-days: 14

      - name: Remove build-time ScreenScraper environment file
        if: always()
        run: rm -f .env
