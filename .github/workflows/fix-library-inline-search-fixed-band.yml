name: Fix Library Inline Search Fixed Band

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/fix_library_inline_search_fixed_band.py
      - .github/workflows/fix-library-inline-search-fixed-band.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply fixed-band patch
        run: python3 tooling/fix_library_inline_search_fixed_band.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/screens/library_screen/library_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(library): keep inline search band visible"
          git push origin HEAD:feature/library-native
