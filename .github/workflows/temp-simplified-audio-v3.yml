name: Temporary NeoStation simplified iOS audio architecture IPA v3

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

env:
  SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
  SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

jobs:
  build:
    if: github.event.head_commit.message == 'Start simplified iOS audio architecture build v3'
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'pending',
              'context': 'neostation/simplified-audio-ipa-v3',
              'description': f"run_id={os.environ['RUN_ID']}",
              'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        shell: bash
        run: |
          flutter pub get
          git restore pubspec.lock analysis_options.yaml 2>/dev/null || true

      - name: Apply corrected architecture patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          # Remove the obsolete explanatory block that contains the class name.
          # The v2 patch already removes the import and invocation themselves.
          details_path = Path(
              'lib/screens/game_screen/game_details_card/'
              'game_details_card_list.dart'
          )
          details = details_path.read_text(encoding='utf-8')
          details, count = re.subn(
              r'\n\s*// Keep the shared audio-session gate '
              r'\(see AudioPolicyService\) in sync\n'
              r'\s*// with the audible state: SFX/music should be free to '
              r'reassert the\n'
              r'\s*// native session again as soon as this preview goes '
              r'silent\.\n',
              '\n',
              details,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not remove obsolete game-details policy comment')
          details_path.write_text(details, encoding='utf-8')

          # Reuse the audited v2 architecture script, extracting only its Python
          # heredoc so this corrective run cannot drift from the intended patch.
          workflow_path = Path(
              '.github/workflows/temp-simplified-audio-v2.yml'
          )
          workflow = workflow_path.read_text(encoding='utf-8')
          step = workflow.index(
              '      - name: Apply simplified iOS audio architecture'
          )
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker, step) + len(marker)
          end = workflow.index('\n          PY\n', start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, str(workflow_path), 'exec'), {'__name__': '__main__'})

          # The extracted script uses dedented snippets. Dart and Swift are
          # whitespace-insensitive inside braces, and dart format fixes Dart.
          # YAML is not, so restore the exact CodeMagic step indentation here.
          codemagic_path = Path('codemagic.yaml')
          codemagic = codemagic_path.read_text(encoding='utf-8')
          codemagic = codemagic.replace(
              '\n- name: Keep iOS audio session owned by NeoStation\n'
              '  script: python3 build-utils/'
              'patch_ios_video_player_audio_session.py\n',
              '\n      - name: Keep iOS audio session owned by NeoStation\n'
              '        script: python3 build-utils/'
              'patch_ios_video_player_audio_session.py\n',
          )
          codemagic = codemagic.replace(
              '\n- name: Verify iOS video player audio-session patch\n'
              '  script: python3 build-utils/'
              'patch_ios_video_player_audio_session.py --check\n',
              '\n      - name: Verify iOS video player audio-session patch\n'
              '        script: python3 build-utils/'
              'patch_ios_video_player_audio_session.py --check\n',
          )
          if codemagic.count('Keep iOS audio session owned by NeoStation') != 1:
              raise SystemExit('CodeMagic dependency patch step is missing or duplicated')
          if codemagic.count('Verify iOS video player audio-session patch') != 1:
              raise SystemExit('CodeMagic verification step is missing or duplicated')
          codemagic_path.write_text(codemagic, encoding='utf-8')

          # Remove obsolete comments whose related calls were intentionally removed.
          secondary_path = Path(
              'lib/screens/secondary_screen/secondary_screen.dart'
          )
          secondary = secondary_path.read_text(encoding='utf-8')
          secondary = secondary.replace(
              '      // Unrelated clients (SFX, music) will skip their own native audio\n'
              '      // session reassertions while this is true, so their frequent calls\n'
              "      // stop resetting the shared audio unit under this video's audio track.\n",
              '',
          )
          secondary_path.write_text(secondary, encoding='utf-8')

          # Keep native members conventionally indented for maintainability.
          native_path = Path(
              'packages/external_folder_access/ios/Classes/'
              'ExternalFolderAccessPlugin.swift'
          )
          native = native_path.read_text(encoding='utf-8')
          native = native.replace(
              '\nprivate var audioSessionObservers: [NSObjectProtocol] = []\n',
              '\n    private var audioSessionObservers: [NSObjectProtocol] = []\n',
          )
          native = native.replace(
              '\nprivate var audioSessionKnownActive = false\n',
              '\n    private var audioSessionKnownActive = false\n',
          )
          native_path.write_text(native, encoding='utf-8')

          print('Corrected simplified iOS audio architecture applied.')
          PY

      - name: Format changed Dart sources
        shell: bash
        run: |
          dart format \
            lib/services/audio_policy_service.dart \
            lib/services/sfx_service.dart \
            lib/services/home_music_service.dart \
            lib/services/music_player_service.dart \
            lib/widgets/shaders/shader_gif_widget.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/my_games_list/secondary_display.dart \
            lib/screens/game_screen/game_details_card/game_details_card_list.dart \
            lib/screens/secondary_screen/secondary_screen.dart \
            test/audio_policy_service_test.dart \
            test/home_music_silent_mode_test.dart

      - name: Patch and verify video_player_avfoundation
        shell: bash
        run: |
          python3 build-utils/patch_ios_video_player_audio_session.py
          python3 build-utils/patch_ios_video_player_audio_session.py --check

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run targeted regression tests
        run: |
          flutter test \
            test/audio_policy_service_test.dart \
            test/home_music_silent_mode_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/ios_gamepad_navigation_test.dart \
            test/rpcs3_stage7_test.dart \
            test/rpcs3_library_service_test.dart

      - name: Commit durable patch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NeoStation Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm \
            .github/workflows/temp-simplified-audio-ipa.yml \
            .github/workflows/temp-simplified-audio-v2.yml \
            .github/workflows/temp-simplified-audio-v3.yml
          git add \
            lib/services/audio_policy_service.dart \
            lib/services/sfx_service.dart \
            lib/services/home_music_service.dart \
            lib/services/music_player_service.dart \
            lib/widgets/shaders/shader_gif_widget.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/my_games_list/secondary_display.dart \
            lib/screens/game_screen/game_details_card/game_details_card_list.dart \
            lib/screens/secondary_screen/secondary_screen.dart \
            packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift \
            build-utils/patch_ios_video_player_audio_session.py \
            codemagic.yaml \
            test/audio_policy_service_test.dart \
            test/home_music_silent_mode_test.dart \
            docs/IOS_AUDIO_ARCHITECTURE.md
          git commit -m "Simplify iOS audio ownership and preserve preview lifecycle"
          git push origin HEAD:main
          mkdir -p build
          git rev-parse HEAD > build/audio-architecture-commit.txt

      - name: Prepare ScreenScraper build defines
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCREENSCRAPER_DEV_ID"
          test -n "$SCREENSCRAPER_DEV_PASSWORD"
          printf 'SCREENSCRAPER_DEV_ID=%s\nSCREENSCRAPER_DEV_PASSWORD=%s\n' \
            "$SCREENSCRAPER_DEV_ID" "$SCREENSCRAPER_DEV_PASSWORD" > .env
          chmod 600 .env

      - name: Scaffold iOS if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi

      - name: Configure generated iOS project
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile
          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' \
            ios/Runner.xcodeproj/project.pbxproj

          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"

      - name: Patch device_info_plus for runner SDK compatibility
        shell: bash
        run: |
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" \
            -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" \
            2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate and force fork icon
        shell: bash
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          pod install --repo-update

      - name: Verify dependency patch after CocoaPods
        run: python3 build-utils/patch_ios_video_player_audio_session.py --check

      - name: Configure Flutter with ScreenScraper defines
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-simplified-audio.log

          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          (
            cd build/ios/unsigned
            zip -r ../../../NeoStation-simplified-audio-unsigned.ipa Payload
          )
          rm -f .env

      - name: Create build report
        shell: bash
        run: |
          set -euo pipefail
          PATCH_SHA=$(cat build/audio-architecture-commit.txt)
          IPA_SHA=$(shasum -a 256 NeoStation-simplified-audio-unsigned.ipa | awk '{print $1}')
          IPA_SIZE=$(stat -f %z NeoStation-simplified-audio-unsigned.ipa)
          cat > NeoStation-simplified-audio-report.txt <<EOF
          NeoStation simplified iOS audio architecture
          Patch commit: $PATCH_SHA
          Build workflow run: ${{ github.run_id }}
          IPA SHA-256: $IPA_SHA
          IPA bytes: $IPA_SIZE

          Verified:
          - lifecycle-only central AVAudioSession policy
          - video_player_avfoundation cannot upgrade .ambient to .playback
          - direct SoLoud SFX playback
          - independent home/music/video reader lifecycles
          - two-second preview delay preserved
          - generation invalidation preserved
          - serialized AVPlayer replacement/disposal preserved
          - iOS gamepad regression test passed
          - RPCS3 integration tests passed
          EOF

      - name: Upload IPA and report
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-simplified-audio-unsigned-ipa
          path: |
            NeoStation-simplified-audio-unsigned.ipa
            NeoStation-simplified-audio-report.txt
            build/ios/xcodebuild-simplified-audio.log
          if-no-files-found: error

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure',
              'context': 'neostation/simplified-audio-ipa-v3',
              'description': f"run_id={os.environ['RUN_ID']}",
              'target_url': f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY
