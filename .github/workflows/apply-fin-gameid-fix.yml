name: Apply Fin Game ID Launch Fix

on:
  push:
    branches:
      - feature/library-native
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-fin-gameid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/library-native
          fetch-depth: 0

      - name: Apply Fin Shortcut Game ID contract
        run: |
          set -euo pipefail
          python3 tools/apply_fin_shortcut_gameid_fix.py
          git diff --check

      - name: Commit generated source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/fin_library_service.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: pass Fin Game ID to Shortcut"
            git push origin HEAD:feature/library-native
          else
            echo "Fin Game ID launch contract already applied."
          fi
