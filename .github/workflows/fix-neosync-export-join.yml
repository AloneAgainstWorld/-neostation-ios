name: Fix NeoSync Export Join

on:
  push:
    branches:
      - feature/library-native
    paths:
      - tooling/fix_neosync_export_join.py
      - .github/workflows/fix-neosync-export-join.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-native
      - name: Apply fix
        run: python3 tooling/fix_neosync_export_join.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/screens/neo_sync_screen/login_screen/neo_sync_content.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(neosync): use valid joined export paths"
          git push origin HEAD:feature/library-native
