name: PR Checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Analysis & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate GitHub automation scripts
        run: python3 -m py_compile .github/scripts/upstream_monthly_review.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Show formatting diff
        run: |
          dart format .
          git diff -- lib/screens/scraper_screen/ios_scraper_login_screen.dart
          exit 1

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

  lint-alias:
    name: lint
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Confirm quality checks passed
        run: echo "Lint, analysis and tests passed."
