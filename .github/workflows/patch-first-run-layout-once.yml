name: Apply first-run layout patch

on:
  push:
    branches:
      - fix/first-run-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/first-run-layout

      - name: Patch SetupWizard layout
        run: python3 .github/scripts/patch_first_run_layout.py

      - name: Commit patch
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/setup_wizard.dart
          git commit -m "Keep localized setup buttons within bounds"
          git push origin HEAD:fix/first-run-layout
